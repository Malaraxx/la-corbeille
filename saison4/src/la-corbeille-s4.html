<title>La Corbeille · Saison 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --navy:#0B1E3B;--navy2:#13294B;--navy3:#1D3A63;--line-d:#2A4570;
  --bg:#F2F4F8;--card:#FFFFFF;--line:#DCE2EC;--ink:#0E1726;--muted:#5B6B82;--muted-d:#A9B8CF;
  --red:#C8102E;--red-l:#FBE7EA;--gold:#C9A227;--gold-l:#FBF4DC;--gold-d:#7A5F0A;--green:#1F8A5B;--green-l:#E3F3EA;--blue-l:#E6EEF9;
  --up-d:#4FD18F;--dn-d:#FF6B7F;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.app{width:100%;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.H{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;letter-spacing:-.01em}
.M{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dark .lab,.lab.d{color:var(--muted-d)}
.up{color:var(--green)}.dn{color:var(--red)}
.dark .up,.end .up{color:var(--up-d)}.dark .dn,.end .dn{color:var(--dn-d)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.note{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.dark .note{color:var(--muted-d)}

/* boutons */
.btn{border:0;border-radius:12px;min-height:50px;padding:0 18px;font:700 16px 'Public Sans',sans-serif;cursor:pointer;background:var(--navy);color:#fff;transition:transform .08s,filter .15s;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn.hold{touch-action:none}
.btn:active{transform:scale(.98)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.dark .btn.ghost,.end .btn.ghost{color:#fff;border-color:var(--line-d)}
.btn.sm{min-height:44px;font-size:14px;padding:0 12px}
.btn[disabled]{opacity:.4;cursor:default}
.btn .fill{position:absolute;inset:0;background:rgba(255,255,255,.3);transform:scaleX(0);transform-origin:left;pointer-events:none}
.btn.on .fill{transform:scaleX(1);transition:transform .5s linear}
.btn span{position:relative}
.link{background:none;border:0;color:var(--navy);font:600 14px 'Public Sans',sans-serif;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 6px}
.dark .link{color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--blue-l);color:var(--navy);white-space:nowrap}
.chip.g{background:var(--green-l);color:var(--green)}.chip.r{background:var(--red-l);color:var(--red)}.chip.o{background:var(--gold-l);color:var(--gold-d)}
.chips{display:flex;gap:5px;flex-wrap:wrap}

/* cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(11,30,59,.05);min-width:0}
.card.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.pad{padding:14px 16px}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-h h2{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:20px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.dark .kv,.end .kv{border-color:var(--line-d)}
.kv:last-child{border-bottom:0}
.kv b{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right;flex:0 1 auto;max-width:64%;overflow-wrap:break-word}
.kv b.w{white-space:normal;font-family:'Public Sans',sans-serif;font-size:13.5px}
.kv>span{color:var(--muted);min-width:0;flex:1 1 auto}
.kv>span small{display:block;font-size:12px;line-height:1.3}
.dark .kv>span,.end .kv>span{color:var(--muted-d)}
.kv.tot{font-size:16px}.kv.tot span{color:inherit;font-weight:700}
.big{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:85%;font-size:38px;line-height:1;letter-spacing:-.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-d{display:flex;flex-direction:column;gap:18px}

/* titre */
.title{position:relative;height:100%;overflow-y:auto;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.title .logo{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:80%;font-size:clamp(46px,13vw,84px);line-height:.95;letter-spacing:-.02em}
.title .logo i{font-style:normal;color:var(--gold)}
.title .rule{width:56px;height:3px;background:var(--red)}
.title p{margin:0;color:var(--muted-d);font-size:16px;max-width:34ch;line-height:1.45}
.title .btn{min-width:240px}
.title a{color:var(--muted-d);font-size:13px}

/* en-tête */
.hud{background:var(--navy);color:#fff;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;flex-direction:column;gap:8px}
.hud-top{display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none;border:0;padding:0;cursor:pointer;background:var(--navy3)}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who b{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12.5px;color:var(--muted-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);background:var(--gold);border-radius:6px;padding:2px 6px;font-weight:600;white-space:nowrap}
.next{border:0;border-radius:12px;background:var(--gold);color:var(--navy);font:700 14px 'Public Sans',sans-serif;min-height:44px;padding:0 12px;cursor:pointer;white-space:nowrap}
.next.wait{background:var(--navy3);color:var(--muted-d)}
.hud-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hn{background:var(--navy2);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.hn small{font-size:10.5px;color:var(--muted-d);font-weight:600;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hn b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;gap:10px;align-items:center}
.rest{flex:none;font-size:12px;font-weight:600;color:var(--muted-d);white-space:nowrap}
.rest b{font-family:'IBM Plex Mono',monospace;color:#fff;font-weight:600}
.rest b.dn{color:var(--dn-d)}
.meter{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted-d);min-width:0;white-space:nowrap}
.meter .ml{overflow:hidden;text-overflow:ellipsis;max-width:90px}
@media (max-width:520px){.meter .mw{display:none}}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--navy3);overflow:hidden;min-width:24px}
.meter i b{display:block;height:100%;border-radius:3px;transition:width .5s}
.meter em{font-style:normal;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px}

.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-top:14px;padding-bottom:90px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:4px max(2px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(2px,env(safe-area-inset-left,0px))}
.nav button{flex:1 1 0;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font:600 10px 'Public Sans',sans-serif;color:var(--muted);cursor:pointer;min-height:54px;border-radius:10px;padding:0;position:relative;white-space:nowrap}
.nav button .e{font-size:20px;line-height:1.3}
.nav button .t{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button .tl{display:none}
.nav button[aria-current="page"]{color:var(--navy);background:var(--blue-l)}
.nav button .dot{position:absolute;top:5px;right:calc(50% - 17px);width:8px;height:8px;border-radius:4px;background:var(--red)}

/* Une et décision */
.une{display:flex;flex-direction:column;gap:8px}
.une b.t{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:19px;line-height:1.2}
.une p{margin:0;color:var(--muted-d);font-size:14.5px;line-height:1.5}
.une .dn2{margin-top:4px;padding-top:10px;border-top:1px solid var(--line-d);display:flex;flex-direction:column;gap:6px}
.une .dn2 span{font-size:14px;line-height:1.45}
.ev{overflow:hidden}
.ev-top{background:var(--navy);color:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ev-top .kick{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.1em;background:var(--red);color:#fff;border-radius:4px;padding:3px 7px}
.ev-top h3{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:21px;line-height:1.15}
.ev-top p{margin:0;color:var(--muted-d);font-size:14.5px;line-height:1.45}
.vs{display:grid;grid-template-columns:1fr 1fr;position:relative}
.vs button{border:0;background:#fff;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;min-height:150px;font-family:inherit;color:var(--ink);transition:background .15s;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;overflow:hidden;min-width:0}
.vs button+button{border-left:1px solid var(--line)}
.vs button .e{font-size:34px;line-height:1.15}
.vs button b{font-size:15.5px;line-height:1.2}
.vs button .chips{justify-content:center}
.vs button .chip{white-space:normal;text-align:center;line-height:1.25}
.vs button.on{background:var(--gold-l)}
.vs button .fill{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left}
.vs button.on .fill{transform:scaleX(1);transition:transform .5s linear}
.vs .x{position:absolute;left:50%;top:38px;transform:translateX(-50%);width:34px;height:34px;border-radius:17px;background:var(--navy);color:var(--gold);font:800 12px 'Archivo',sans-serif;display:flex;align-items:center;justify-content:center;border:3px solid #fff;pointer-events:none}
.ev-foot{padding:8px 16px 12px;font-size:12.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
.done{display:flex;gap:10px;align-items:flex-start}
.done .e{font-size:22px}
.doss{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}
.doss:last-child{border-bottom:0}
.doss .e{font-size:20px;flex:none}
.doss .n{flex:1;min-width:0}
.doss small{display:block;color:var(--muted);font-size:12.5px}

/* curseurs */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--navy) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--navy)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:14px;background:#fff;border:3px solid var(--navy);margin-top:-10px;box-shadow:0 2px 6px rgba(11,30,59,.25)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:14px;background:#fff;border:3px solid var(--navy)}
.amount{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.quick button{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:44px;padding:0 2px;font:600 13px 'Public Sans',sans-serif;cursor:pointer;color:var(--ink);white-space:nowrap}

/* listes */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;width:100%;text-align:left;font-family:inherit;color:var(--ink);border-left:0;border-right:0;border-top:0;cursor:pointer;min-height:60px}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.row .n{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .n b{font-size:15px;font-weight:700}
.row .n small{font-size:12.5px;color:var(--muted);line-height:1.3}
.row .v{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.row .v b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14.5px}
.row .v small{font-size:12px;font-weight:600}
.list{overflow:hidden;padding:0}
.env-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--navy);color:#fff}
.env-h .n{flex:1;display:flex;flex-direction:column;min-width:0}
.env-h .n b{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:17px}
.env-h .n small{font-size:12px;color:var(--muted-d)}
.env-h .t{font-family:'IBM Plex Mono',monospace;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;min-height:44px;font:600 14px 'Public Sans',sans-serif;color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.alloc{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--line)}
.alloc i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* budget */
.bblk{padding:0;overflow:hidden}
.bblk h3{margin:0;padding:12px 16px 8px;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.bblk h3 b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px}
.bl{display:flex;justify-content:space-between;gap:12px;padding:8px 16px;border-top:1px solid var(--line);font-size:14.5px;align-items:baseline}
.bl span{min-width:0}
.bl small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:1px}
.bl b{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap}

/* fiche de paie, ticket */
.ticket{background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;padding:16px 16px 20px;position:relative;font-family:'IBM Plex Mono',monospace;margin-bottom:12px}
.ticket::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-12px;height:12px;background:linear-gradient(-45deg,transparent 7px,#fff 0) 0 0/14px 12px repeat-x,linear-gradient(45deg,transparent 7px,#fff 0) 0 0/14px 12px repeat-x}
.ticket h3{margin:0;text-align:center;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:85%;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.ticket .d{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.ticket .grp{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin:10px 0 2px}
.ticket .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.ticket .ln small{display:block;font-family:'Public Sans',sans-serif;font-size:11.5px;color:var(--muted)}
.ticket .tot{display:flex;justify-content:space-between;font-size:17px;padding-top:10px;font-weight:600}

/* immo */
.prop{overflow:hidden;padding:0}
.prop-h{display:flex;gap:12px;padding:14px;align-items:flex-start}
.prop-h .ph{width:60px;height:60px;border-radius:10px;background:var(--navy2);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-size:24px;line-height:1}
.prop-h .ph small{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--muted-d);margin-top:4px}
.prop-h .n{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prop-h .n b{font-size:16px;font-weight:700;line-height:1.2}
.prop-h .n small{font-size:13px;color:var(--muted);line-height:1.35}
.prop-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.prop-k div{padding:8px 10px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0}
.prop-k div:last-child{border-right:0}
.prop-k small{font-size:11px;color:var(--muted);font-weight:600;line-height:1.2}
.prop-k b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);font-size:13px}
.dpe{display:inline-flex;width:22px;height:22px;border-radius:4px;color:#fff;font-weight:800;font-size:12px;align-items:center;justify-content:center;vertical-align:middle}

/* boutique */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{border:1px solid var(--line);background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;cursor:pointer;font:600 12px 'Public Sans',sans-serif;color:var(--ink);min-height:64px}
.cat .e{font-size:24px}
.cat[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);border-left:0;border-right:0;border-top:0;min-height:60px}
.item:last-child{border-bottom:0}
.item .e{font-size:30px;width:44px;text-align:center;flex:none}
.item .n{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.item .n b{font-size:15px}.item .n small{font-size:12.5px;color:var(--muted)}
.item .p{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;white-space:nowrap}
.item.own{background:var(--green-l)}
.slot{display:flex;justify-content:center;gap:8px;padding:14px;background:var(--navy);border-radius:12px}
.slot span{width:60px;height:68px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:36px}
.wheel{width:120px;height:120px;border-radius:60px;margin:0 auto;border:6px solid var(--gold);display:flex;align-items:center;justify-content:center;font:800 40px 'Archivo',sans-serif;color:#fff;background:var(--navy)}

/* création */
.make{height:100%;overflow-y:auto;width:100%;max-width:600px;margin:0 auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.steps{display:flex;align-items:center;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--navy)}

    var eq=eff(function(a){return a.qual;}); if (Math.abs(eq)>.01) W.push({k:'v',t:(eq<0?'Ta qualité est sous ce qu’attendent tes clients ':'Ta qualité dépasse ce qu’attendent tes clients ')+'('+S.pos[B.pos].n.toLowerCase()+') : '+pc2(eq)+' de demande.',v:eq});
    var ec=eff(function(a){return a.com;}); if (ec>.01) W.push({k:'v',t:'Ton temps commercial'+(B.team.com?' et tes commerciaux':'')+' : '+pc2(ec)+' de demande.',v:ec});
    var sz=S.season[R.q-1]-1; if (Math.abs(sz)>.01) W.push({k:'v',t:(R.q===4?'Les fêtes de fin d’année : ':R.q===3?'Le creux de l’été : ':'La saison : ')+pc2(sz)+' de demande.',v:sz});
    var cj=Math.pow(X.conj,S.pos[B.pos].cy)-1; if (Math.abs(cj)>.01) W.push({k:'v',t:'La conjoncture ('+conjName(ST.ecoY)+')'+(B.pos==='entree'&&cj>0?', les clients descendent en gamme':B.pos==='premium'?', le premium y est très sensible':'')+' : '+pc2(cj)+' de demande.',v:cj});
    if (X.fit&&Math.abs(X.fit-1)>.05&&iqOf(B)<8) W.push({k:'v',t:X.fit<1?'Ton produit prend moins que prévu auprès des clients : ton prévisionnel l’apprend peu à peu.':'Ton produit plaît plus que prévu : ton prévisionnel s’ajuste.',v:X.fit-1});
    var nz=0; for (var z in R.F) nz+=R.F[z].dz/(X.noise[z]||1); var al=R.D/Math.max(1e-9,nz)-1; if (Math.abs(al)>.03) W.push({k:'v',t:'Le hasard du trimestre : '+pc2(al)+' de demande.',v:al});
  }
  for (var z2 in R.F){ var o2=R.F[z2]; if (o2.up>.01) W.push({k:'v',t:'Ta promotion '+(z2==='ville'?'dans ta ville':'dans ta région')+' ('+eur(d.promo[z2])+') a fait '+pc2(o2.up)+' de notoriété (effet en racine carrée : doubler la promo ne double pas l’effet).',v:o2.up}); }
  if (R.lostStock>.5) W.push({k:'v',t:'Rupture de stock : '+eur(R.lostStock*R.price)+' de ventes perdues ('+Math.round(R.lostStock)+' '+P.us+'). Ton image en prend un coup.',v:-R.lostStock*R.price,al:'rupture'});
  if (R.lostCap>.5) W.push({k:'v',t:'Ton équipe est saturée : '+eur(R.lostCap*R.price)+' de ventes perdues. Embauche ou prends plus de temps sur la production.',v:-R.lostCap*R.price,al:'capacite'});
  else if (R.cap>0&&R.util<.55&&R.sold>0) W.push({k:'v',t:'Ton équipe est occupée à '+Math.round(R.util*100)+' % : des salaires qui tournent à vide.',al:'vide'});
  if (R.sol.n) W.push({k:'v',t:'Soldes à −'+Math.round(d.soldes*100)+' % : '+Math.round(R.sol.n)+' '+P.us+' écoulés pour '+eur(R.sol.ca)+'.',v:R.sol.ca});
  if (R.ret>1) W.push({k:'m',t:'Retours et réclamations ('+Math.round(R.retRate*100)+' % des ventes) : −'+eur(R.ret).replace('−','')+'.',v:-R.ret});
  if (R.ca>0) W.push({k:'m',t:'Marge brute de '+Math.round(R.mb/R.ca*100)+' % : coût des '+P.us+' vendus '+eur(R.cogs)+', transport '+eur(R.trans)+'.',v:R.mb});
  if (R.dem>1) W.push({k:'m',t:'Démarque (casse, vol, erreurs) : −'+eur(R.dem).replace('−','')+'. Plus de temps de gestion la réduit.',v:-R.dem});
  if (R.dep>1) W.push({k:'m',t:'Stock dormant depuis un an : décoté de moitié, −'+eur(R.dep).replace('−','')+'. Pense aux soldes.',v:-R.dep,al:'dormant'});
  var fx=R.rent+R.frais+R.staff+R.dir+R.hire; W.push({k:'m',t:'Charges fixes : '+eur(fx)+' (local '+eur(R.rent)+', ta rémunération '+eur(R.dir)+(R.staff?', équipe '+eur(R.staff):'')+(R.hire?', recrutements et départs '+eur(R.hire):'')+', assurance et comptable '+eur(R.frais)+').',v:-fx});
  if (R.promo) W.push({k:'m',t:'Promotion : −'+eur(R.promo).replace('−','')+'.',v:-R.promo});
  if (R.int>1) W.push({k:'m',t:'Intérêts du prêt et du découvert : −'+eur(R.int).replace('−','')+'.',v:-R.int});
  var dc=R.cash1-R.cash0; W.push({k:'t',t:'Résultat du trimestre : '+sgn(R.res)+'.',v:R.res});
  var dB=R.bfr1-R.bfr0; if (Math.abs(dB)>1) W.push({k:'t',t:dB>0?'Ton activité immobilise '+eur(dB)+' de plus (stock acheté et pas encore vendu, moins les fournisseurs pas encore payés).':'Ton stock a fondu : '+eur(-dB)+' reviennent en trésorerie.',v:-dB});
  if (R.dep+R.amort+R.dem>1) W.push({k:'t',t:'Décote, démarque et amortissements : '+eur(R.dep+R.amort+R.dem)+' de charges sans sortie d’argent ce trimestre.',v:R.dep+R.amort+R.dem});
  if (R.bankPr>1) W.push({k:'t',t:'Remboursement du prêt : −'+eur(R.bankPr).replace('−','')+'.',v:-R.bankPr});
  if (R.late) W.push({k:'t',t:R.lead>1?'Ta commande d’Asie est en retard : elle arrivera un trimestre plus tard que prévu.':'Ta commande est en retard : la moitié arrivera le trimestre prochain.',al:'retard'});
  var other=dc-(R.res-dB+R.dep+R.amort+R.dem-R.bankPr); if (Math.abs(other)>2) W.push({k:'t',t:'Autres mouvements (ouverture de zone, emprunt, apport) : '+sgn(other)+'.',v:other});
  W.push({k:'t',t:'Trésorerie : '+eur(R.cash0)+' → '+eur(R.cash1)+'.',v:dc}); }

/* ===== MOTEUR : entreprise, décisions et prévisionnel ===== */
function cloneDec(d){ return JSON.parse(JSON.stringify(d)); }
// Décisions valides : bornes, minimum de commande, soldes seulement en janvier et en juillet.
function cleanDec(B,d){ var S=SEC(B), o=cloneDec(d||B.dec), k=ST.cpi;
  if (!S.pos[o.pos]) o.pos=B.pos; if (!S.sup[o.sup]) o.sup='eu';
  o.px=clamp(Math.round((+o.px||1)*100)/100,.6,1.5);
  var mq=moqOf(B,o.sup), mx=Math.round(4*sum(S.zoneOrder,function(z){return B.zones[z].open?zoneMkt(B,z,o.pos)*1.3:0;})); o.order=Math.round(+o.order||0); if (o.order>0&&o.order<mq) o.order=mq; o.order=clamp(o.order,0,Math.max(mq,mx));
  o.promo=o.promo||{}; S.zoneOrder.forEach(function(z){ o.promo[z]=B.zones[z].open?clamp(Math.round(+o.promo[z]||0),0,2e6*k):0; });
  o.soldes=S.soldes[ST.q-1]?([0,.2,.3,.5].indexOf(+o.soldes)>=0?+o.soldes:0):0;
  o.team=o.team||{}; ROLE_K.forEach(function(r){ o.team[r]=clamp(Math.round(+o.team[r]||0),0,300); });
  var t=o.time||{c:40,p:40,g:20}; t.c=clamp(Math.round(+t.c||0),0,100); t.p=clamp(Math.round(+t.p||0),0,100-t.c); t.g=100-t.c-t.p; o.time=t;
  o.pay=r10(clamp(+o.pay||0,0,20000*k)); return o; }
// Commande suggérée : la demande attendue (selon le passé), jusqu'à l'arrivée de la commande suivante, moins le stock et ce qui arrive.
function suggestOrder(B,d){ var S=SEC(B), sp=S.sup[d.sup], q=ST.q, lead=sp.lead, H=B.hist.slice(-2), base;
  if (H.length) base=sum(H,function(h){return h.D/S.season[h.q-1];})/H.length; else base=forecastQ(B,d,1,true).D/S.season[q-1];
  var need=0; for (var i=0;i<=lead;i++) need+=base*S.season[(q-1+i)%4];
  var o=Math.max(0,need*1.05-stockN(B)-pipeN(B)), mq=moqOf(B,d.sup); if (o<mq*.5) return 0; return Math.max(mq,Math.round(o/10)*10); }
// Prévisionnel en fourchette (§3.1) : simulé sur une copie, sans hasard, avec la conjoncture connue ; jamais une valeur exacte.
function forecastQ(B,d,f,noOrder){ var C=JSON.parse(JSON.stringify(B)), dd=cleanDec(C,d); if (noOrder) dd.order=0;
  var X={noise:{},late:false,conj:conjOf(knownE()),fit:C.fitEst}; SEC(C).zoneOrder.forEach(function(z){ X.noise[z]=f; }); var R=runQuarter(C,dd,X); return R; }
function forecast(d){ var B=ST.biz; if (!B) return null; var lo=forecastQ(B,d,.86), mid=forecastQ(B,d,1), hi=forecastQ(B,d,1.15);
  // capped : même dans le bas de la fourchette, le stock ou l'équipe limitent les ventes (le prévisionnel donne alors un plafond)
  return {caLo:lo.ca,caHi:hi.ca,resLo:lo.res,resHi:hi.res,cashLo:lo.cash1,cashHi:hi.cash1,D:mid.D,cap:mid.cap,stock:stockN(B)+(mid.arrived||0),sold:mid.sold,lost:mid.lostStock+mid.lostCap,mid:mid,capped:hi.ca-lo.ca<1,lim:lo.cap<lo.D&&lo.cap<=lo.stockEnd+lo.sold?'équipe':'stock'}; }
// « Garder mes réglages » : les réglages du trimestre dernier, avec la commande préremplie au réassort suggéré
// (rejouer la même quantité quel que soit le stock remplirait l'entrepôt ou viderait les rayons).
function keepDec(B){ var d=cleanDec(B,B.dec); d.order=suggestOrder(B,d); if (!SEC(B).soldes[ST.q-1]) d.soldes=0; return d; }
// Pilote automatique (§4.5) : garde les prix et la promotion, recommande selon la demande passée, ne prend aucun risque.
function autoDec(B){ var d=cleanDec(B,B.dec), H=B.hist.slice(-2), H4=B.hist.slice(-4); d.soldes=0;
  // une seule prise de risque : ouvrir la zone suivante quand la trésorerie couvre cinq fois son coût et six mois de charges et que l'année a été bénéficiaire
  SEC(B).zoneOrder.forEach(function(z){ if (canOpen(B,z)&&H4.length===4&&sum(H4,function(h){return h.ebe;})>0&&B.cash>5*zoneCost(B,z)+6*monthlyFixed(B)) bizOpen(z); }); d=cleanDec(B,d);
  if (H.length===2&&H.every(function(h){return h.util>=.95;})&&B.last&&B.last.lostCap>.1*B.last.D&&B.cash>3*monthlyFixed(B)) d.team.emp++;
  else if (H.length===2&&H.every(function(h){return h.util<.4;})&&d.team.emp>0) d.team.emp--;
  d.order=suggestOrder(B,d); return d; }

/* ===== MOTEUR : entreprise, actions hors trimestre ===== */
function canOpen(B,z){ return B&&!B.dead&&SEC(B).zones[z]&&!B.zones[z].open; }
function zoneCost(B,z){ return SEC(B).zones[z].entry*ST.cpi; }
// Ouvrir une zone : un coût d'entrée payé tout de suite (dépôt, référencement), amorti sur 8 trimestres.
function bizOpen(z){ var B=ST.biz; if (!canOpen(B,z)) return null; var c=zoneCost(B,z); bizCash(-c,'ouverture',B); B.amort.push({a:c/8,n:8}); B.zones[z].open=true; B.dec.promo[z]=Math.round(1500*ST.cpi/100)*100; logL('Ouverture : '+SEC(B).zones[z].n,-c); return c; }
// Emprunter (au plus 3 années d'EBE, dette comprise, après 4 trimestres d'activité bénéficiaires).
function borrowMax(B){ B=B||ST.biz; if (!B||B.hist.length<4) return 0; var e=sum(B.hist.slice(-4),function(h){return h.ebe;}); return Math.max(0,Math.floor((Math.min(BANK_MAX*2*ST.cpi,3*e)-bankLeft(B))/1000)*1000); }
function bizBorrow(x){ var B=ST.biz; x=Math.floor(Math.min(x,borrowMax(B))); if (x<1000) return null; var L=bankLeft(B)+x; bizCash(x,'emprunt',B); B.bank={left:L,rate:BANK_RATE,pmt:Math.round(qpay(L,BANK_RATE,BANK_NQ)*100)/100}; logL('Emprunt de '+B.name,x); return x; }
// Apport en compte courant d'associé : ton argent perso prêté à ta société (rendu quand elle a de la trésorerie).
function bizCca(x){ var B=ST.biz; x=Math.floor(Math.min(x,Math.max(0,ST.cash))); if (!B||x<=0) return null; cash(-x,'compte courant'); bizCash(x,'compte courant',B); B.cca+=x; logL('Apport en compte courant',-x); return x; }

/* ===== MOTEUR : le trimestre complet (entreprise + perso) ===== */
function playQuarter(dec){ if (ST.over||ST.q>4) return null; var N=[], R=null, B=ST.biz;
  if (B){ var d=cleanDec(B,dec), sp=SEC(B).sup[d.sup], X={noise:{},late:d.order>0&&rnd()<sp.late,conj:conjOf(ST.ecoY),fit:B.fit};
    SEC(B).zoneOrder.forEach(function(z){ X.noise[z]=Math.exp(SEC(B).noise*gauss()); });
    B.dec=d; R=runQuarter(B,d,X); B.fitEst=Math.round((B.fitEst+.5*(B.fit-B.fitEst))*1000)/1000; bizTreasury(B,R,N); }
  // l'argent perso du trimestre : trois mois de budget
  var bud=budget(); cash(bud.rest*3,'epargne'); if (ST.cash<0) cover(-ST.cash,N);
  var out={y:ST.year,q:ST.q,R:R,N:N,rest:bud.rest*3}; ST.lastQ=out.R?slim(out.R):null; ST.lastQN=N; ST.q++;
  return out; }
// Trésorerie dans le rouge au-delà du découvert autorisé : apport automatique en compte courant si tu peux sans te mettre en danger
// (moins de la moitié de ton argent disponible), sinon cessation de paiements et liquidation (v2 §5). Le message dit toujours pourquoi.
function bizTreasury(B,R,N){ var lim=odLimit(B); if (B.cash>=-lim) { B.red=0; if (B.cash<0) N.push('⚠️ '+B.name+' est à découvert : '+eur(B.cash)+' (autorisé jusqu’à '+eur(-lim)+'). Agios à 9 % par an.'); return; }
  var need=Math.ceil(-B.cash), liq=Math.max(0,ST.cash)+ST.livret;
  if (need<=liq*.5){ var t=Math.min(need,Math.max(0,ST.cash)); if (t) cash(-t,'compte courant'); var l2=need-t; if (l2>0){ ST.livret-=l2; } bizCash(need,'compte courant',B); B.cca+=need;
    N.push('💸 Trésorerie de '+B.name+' au-delà du découvert autorisé : tu apportes '+eur(need)+' en compte courant d’associé.'); logL('Apport en compte courant',-need); return; }
  // Premier dépassement : la banque laisse un trimestre pour revenir sous le découvert autorisé (sauf au-delà du double).
  if (!B.red&&B.cash>=-2*lim){ B.red=1; N.push('🚨 '+B.name+' dépasse son découvert autorisé ('+eur(B.cash)+' pour '+eur(-lim)+'). La banque te laisse un trimestre pour revenir dans les clous : vends ton stock, réduis tes commandes ou ton salaire, ou apporte de l’argent en compte courant.'); return; }
  bizFail(N,(B.red?'Deuxième trimestre au-delà du découvert autorisé':'Trésorerie de '+eur(B.cash)+', plus du double du découvert autorisé ('+eur(-lim)+')')+' : la banque refuse de payer, c’est la cessation de paiements.'); }
function bizFail(N,why){ var B=ST.biz; B.dead=true; ST.flags.fails=(ST.flags.fails||0)+1; ST.flags.everFail=1;
  ST.bizPast.push({name:B.name,born:B.born,end:ST.year,q:ST.q,why:why,cca:B.cca});
  N.push('💀 Faillite de '+B.name+'. '+why+' La société est liquidée'+(B.cca?' et ton compte courant de '+eur(B.cca)+' est perdu':'')+'. Président·e de SAS, tu n’as pas droit au chômage.');
  logL('Faillite : '+B.name); bump('hum',-15); bump('rep',-5);
  ST.prof='chomage'; ST.cho={are:0,left:0,ref:Math.max(1600*ST.cpi,B.pay||0),title:'Chargé·e de développement',emp2:'Nord Distribution'}; ST.biz=null; }

/* ===== MOTEUR : clôture annuelle de l'entreprise (§3.3) ===== */
function bizYearData(B){ var H=B.hist.filter(function(h){return h.y===ST.year;});
  return {n:H.length,ca:sum(H,function(h){return h.ca;}),mb:sum(H,function(h){return h.mb;}),ebe:sum(H,function(h){return h.ebe;}),res:sum(H,function(h){return h.res;})}; }
function primeMax(){ var B=ST.biz; if (!B) return 0; return Math.max(0,Math.floor(Math.min(B.cash,Math.max(0,bizYearData(B).res))/100)*100); }
// Que fais-tu du résultat ? prime = coût pour la société ; div = dividende brut. Fonction pure : le curseur montre tout en direct.
function affectPreview(prime,div){ var B=ST.biz, Y=bizYearData(B); prime=clamp(Math.round(prime||0),0,primeMax());
  var res=Y.res-prime, base=Math.max(0,res-B.lossCarry), is=isCalc(base), net=res-is, dmax=Math.max(0,Math.floor(Math.min(B.ran+net,B.cash-prime-is))); div=clamp(Math.round(div||0),0,dmax);
  var pNet=prime/DIR_COST, tb=taxBase(), irD=pNet>0?irCalc(tb+pNet*.9,parts())-irCalc(tb,parts()):0, dNet=div*(1-PFU_IR-PS);
  return {Y:Y,prime:prime,res:res,is:is,net:net,divMax:dmax,div:div,primeNet:pNet-irD,primeIR:irD,divNet:dNet,divTax:div-dNet,pocket:pNet-irD+dNet,stay:B.cash-prime-is-div}; }
function bizAffect(prime,div){ var B=ST.biz; if (!B||B.affY===ST.year) return null; var A=affectPreview(prime,div);
  if (A.prime){ bizCash(-A.prime,'prime',B); cash(A.primeNet,'prime'); ST.yr.prime+=A.primeNet; ST.yr.primeTax+=A.primeIR; }
  if (A.is) bizCash(-A.is,'is',B);
  if (A.res<0) B.lossCarry+=-A.res; else B.lossCarry=Math.max(0,B.lossCarry-A.res);
  B.ran+=A.net;
  if (A.div){ bizCash(-A.div,'dividendes',B); B.ran-=A.div; B.divs+=A.div; cash(A.divNet,'dividendes'); ST.yr.div+=A.divNet; ST.yr.divTax+=A.divTax; }
  // compte courant d'associé rendu quand la trésorerie dépasse 3 mois de charges fixes
  var fx=(city().rent.t2*ST.cpi+SEC(B).frais*ST.cpi+teamCost(B.team)+B.pay*DIR_COST)*3, back=Math.max(0,Math.min(B.cca,B.cash-fx));
  if (back>=1){ back=Math.floor(back); bizCash(-back,'compte courant',B); cash(back,'compte courant'); B.cca-=back; }
  B.years.push({y:ST.year,ca:Math.round(A.Y.ca),ebe:Math.round(A.Y.ebe),res:Math.round(A.res),is:Math.round(A.is),net:Math.round(A.net),div:A.div,prime:A.prime,cash:Math.round(B.cash),val:Math.round(bizValue(B).v)});
  B.affY=ST.year; logL('Clôture des comptes de '+B.name+' : résultat net '+sgn(A.net)+(A.div?' · dividende '+eur(A.div):'')+(A.prime?' · prime '+eur(A.prime):''));
  return A; }

/* ===== MOTEUR : valorisation calculée (§4.7) ===== */
// Valeur = EBE retraité × Multiple + Trésorerie nette − Dette. Multiple = Base × croissance sur 3 ans × récurrence × marge × dépendance au dirigeant
// × concentration des clients × conjoncture. Le détail s'affiche dans l'onglet Entreprise. Sans EBE positif : actif net (trésorerie + stock au coût − dettes).
function bizValue(B){ var S=SEC(B), V=S.val, k=ST.cpi, H=B.hist, L4=H.slice(-4), f=[];
  var ca4=sum(L4,function(h){return h.ca;}), ebe4=sum(L4,function(h){return h.ebe;}), dir4=sum(L4,function(h){return h.dir||0;}), sc=L4.length?4/L4.length:0;
  ca4*=sc; ebe4*=sc; dir4*=sc;
  var ebeR=ebe4+dir4-V.dirNorm*k, debt=bankLeft(B)+B.cca+Math.max(0,-B.cash)+payablesV(B), tn=Math.max(0,B.cash);
  var floor=Math.max(0,tn+stockV(B)+sum(B.pipe,function(l){return l.n*l.uc;})-debt); // actif net : trésorerie + stock au coût − dettes
  var old=H.length>=16?H.slice(-16,-12):H.length>=8?H.slice(0,4):null, g3=0, span=H.length>=16?3:1;
  if (old&&old.length===4){ var c0=sum(old,function(h){return h.ca;}); g3=c0>0?Math.pow(Math.max(.01,ca4/c0),1/span)-1:0; }
  var fg=clamp(1+2*(g3-.05),.6,2); f.push(['Croissance',fg,old?'CA '+(g3>=0?'+':'−')+Math.round(Math.abs(g3)*100)+' % par an sur '+(span===3?'3 ans':'1 an'):'trop jeune pour juger']);
  f.push(['Récurrence du chiffre d’affaires',V.rec,'des clients qui ne reviennent pas forcément']);
  var mg=ca4>0?ebeR/ca4:0, fm=clamp(1+3*(mg-.08),.6,1.6); f.push(['Marge',fm,'EBE retraité '+Math.round(mg*100)+' % du CA']);
  var T=B.team, n=staffOf(T), fd=T.cad?1.1:T.man?1:n>=3?.85:.75; f.push(['Dépendance au dirigeant',fd,T.cad?'une direction en place':T.man?'un·e chef·fe d’équipe':'tout repose sur toi']);
  f.push(['Concentration des clients',1,'des particuliers, aucun client ne pèse lourd']);
  var fc=ST.ecoY&&ST.q>1?conjOf(ST.ecoY):conjOf(ST.eco); fc=clamp(fc+(fc<1?-.05:0),.75,1.05); f.push(['Conjoncture',fc,conjName(ST.q>1?ST.ecoY:ST.eco)]);
  var mult=V.base; f.forEach(function(x){ mult*=x[1]; });
  var v=ebeR>0?Math.max(floor,ebeR*mult+tn-debt):floor;
  return {v:Math.max(0,v),ebeR:ebeR,mult:mult,base:V.base,f:f,tn:tn,debt:debt,floor:floor,ca4:ca4}; }
// Charges fixes d'un mois (local, frais, équipe, toi) : sert aux « mois de trésorerie restants ».
function monthlyFixed(B){ B=B||ST.biz; var S=SEC(B), n=staffOf(B.team); return city().rent.t2*ST.cpi*S.rentK*(1+S.rentStaff*n)+S.frais*ST.cpi+teamCost(B.team)+B.pay*DIR_COST; }
// Le salaire net qu'il te faut pour que ton budget perso du mois ne soit pas dans le rouge (fonction pure).
function payNeeded(){ var B=ST.biz; if (!B) return 0; var p0=B.pay, lo=0, hi=20000*ST.cpi; B.pay=0; if (monthRest()>=0){ B.pay=p0; return 0; }
  for (var i=0;i<22;i++){ var m=(lo+hi)/2; B.pay=m; if (monthRest()>=0) hi=m; else lo=m; } B.pay=p0; return Math.ceil(hi/10)*10; }

/* ===== MOTEUR : marchés et économie ===== */
// Tirée en janvier pour toute l'année (cachée) : la conjoncture des trimestres et la Bourse de décembre sont la même.
function drawEco(){ var e=ST.eco, shock=rnd()<.05;
  var infl=clamp(.6*e.infl+.4*.02+.007*gauss()+(shock?.025:0),-.005,.08);
  var crash=rnd()<1/8, m=crash?-.25+.07*gauss():.115+.12*gauss();
  var rate=clamp(e.rate+.45*(infl+.005-e.rate)+.003*gauss()-(crash?.01:0),0,.07);
  return {infl:infl,crash:crash,m:m,rate:rate}; }
function assetRet(a,m){ if (a.fixed) return Math.max(.005,ST.eco.rate+.005); return Math.max(-.9,a.mu+a.b*(m-.07)+a.i*gauss()); }

/* ===== MOTEUR : carrière hors entreprise (une année) ===== */
// Après une faillite (v2 §5) : chômage, CDD de transition de 2 ans au plus, puis nouveau projet.
function careerYear(N){ var p=ST.prof, infl=ST.eco.infl;
  if (p==='salarie'){ var j=ST.job; j.net=r10(j.net*(1+infl*.95+.01)); if (j.cdd&&ST.year+1>=j.cdd){ cddEnd(N); } return; }
  if (p==='chomage'){ var c=ST.cho; c.left=Math.max(0,c.left-12); var find=clamp(.55+(ST.rep-50)/150-(ST.age>55?.25:0),.15,.9);
    if (rnd()<find){ startJob(c.ref*(.92+rnd()*.12),c.title||'Commercial·e',c.emp2||'Nord Distribution',2); ST.cho=null; N.push('💼 CDD de transition de 2 ans : '+gz(ST.job.title)+' à '+eur(ST.job.net)+' net.'); logL('Retour à l’emploi'); } } }
function startJob(netM,title,emp,cdd){ ST.prof='salarie'; ST.job={net:r10(netM),title:title,emp:emp,since:ST.year,cdd:cdd?ST.year+cdd:0}; }
function cddEnd(N){ var j=ST.job, brut=j.net/.78, m=Math.min(24,Math.max(6,(ST.year+1-j.since)*12)); ST.cho={are:Math.round(brut*.57*.93),left:m,ref:j.net,title:j.title,emp2:j.emp}; ST.job=null; ST.prof='chomage';
  N.push('📄 Fin de ton CDD chez '+j.emp+'. Tu touches le chômage '+m+' mois : le moment de relancer un projet.'); logL('Fin de CDD'); }
function jobOffer(){ var c=ST.cho, ref=c?c.ref:1600*ST.cpi; return {net:r10(Math.max(SMIC_NET*ST.cpi,ref*.88)),title:(c&&c.title)||'Commercial·e',emp:'Nord Distribution'}; }
function takeJob(){ if (ST.prof!=='chomage') return null; var o=jobOffer(); ST.cho=null; startJob(o.net,o.title,o.emp,2); logL('CDD de transition : '+gz(o.title)); return o; }

/* ===== MOTEUR : vie perso (une année) ===== */
function lifeYear(N){ var d=0;
  if (ST.home==='parents'&&ST.age>=23) d-=3;
  if (inCouple()) d+=1; else if (ST.age>28) d-=1;
  if (ST.eco.crash&&invTot()>5000) d-=4;
  if (monthRest()<0) d-=5;
  if (ST.biz&&ST.biz.last&&ST.biz.last.res<0) d-=2;
  d+=Math.round((62-ST.hum)*.12); bump('hum',d);
  if (ST.hum<30&&(ST.prof==='salarie'||ST.prof==='chef')&&rnd()<.3){ bump('hum',14); bump('rep',-4); N.push('🛌 Burn-out : trois mois au ralenti. Prends du temps de gestion et délègue.'); logL('Burn-out'); }
  if (inCouple()){ ST.pInc=r10(ST.pInc*(1+ST.eco.infl+.008)); bump('couple',ST.married?-2:-3); if (ST.hum<30) bump('couple',-3);
    if (ST.couple<15){ var fee=ST.married?Math.round(6000*ST.cpi):0; if (fee) cash(-fee,'vie'); N.push('💔 '+ST.partner+' te quitte.'+(fee?' Divorce : '+eur(-fee)+' de frais.':'')); logL('Rupture avec '+ST.partner,-fee); ST.couple=null; ST.partner=''; ST.married=false; ST.pInc=0; bump('hum',-15); if (ST.home==='t2'||ST.home==='t3'||ST.home==='maison') ST.home=ST.kids?'t2':'studio'; } }
  if (inCouple()&&(ST.home==='parents'||ST.home==='coloc'||ST.home==='studio')){ ST.home='t2'; N.push('📦 Vous emménagez à deux dans un T2.'); }
  if (ST.kids&&ST.home!=='t3'&&ST.home!=='maison'&&ST.home!=='parents'){ ST.home='t3'; N.push('📦 La famille s’agrandit : déménagement dans un T3.'); }
  ST.humH.push(ST.hum); }

/* ===== MOTEUR : clôture de l'année (après le T4 et la décision « Que fais-tu du résultat ? ») ===== */
function workMonthly(){ return sum(workLines(),function(x){return x.a;}); }
function snap(){ return {cash:ST.cash,livret:ST.livret,pea:envVal('pea'),cto:envVal('cto'),av:envVal('av'),pee:envVal('pee'),debts:debtTot(),biz:bizVal()+ccaVal(),doss:dossVal(),net:net(),
  work:workMonthly(),prof:ST.prof,title:ST.prof?profName():'',hum:ST.hum,couple:ST.couple,kids:ST.kids,married:ST.married,partner:ST.partner,bizRes:ST.biz&&ST.biz.years.length?ST.biz.years[ST.biz.years.length-1].net:null}; }
function yearReady(){ return ST.q>4&&!ST.ev&&(!ST.biz||ST.biz.affY===ST.year); }
function closeYear(){ if (ST.q<=4) return null; if (ST.biz&&ST.biz.affY!==ST.year) bizAffect(0,0);
  var S0=snap(), y=ST.year, N=[], before=ST.yr.start, invB=placed(), bizB=bizVal()+ccaVal(), E=ST.ecoY||drawEco(), e=ST.eco;
  // 1. marchés de l'année (tirés en janvier)
  e.m=E.m; e.crash=E.crash;
  for (var k in ASSETS) ASSETS[k].forEach(function(a){ var r=assetRet(a,E.m); ST.last.r[a.id]=r; var h=ST.env[k].hold[a.id]; if (h) h.v=Math.round(h.v*(1+r)*100)/100; });
  var livI=Math.round(ST.livret*e.livA*100)/100; ST.livret+=livI;
  if (E.crash) N.push('📉 Krach : les marchés mondiaux '+pct(E.m,0)+' sur l’année.');
  // 2. dettes perso : les mensualités ont été payées chaque trimestre dans le budget
  ST.debts.forEach(function(d){ if (d.mens>0&&d.left>0){ var it=d.left*d.rate; d.left=Math.max(0,Math.round(d.left+it-d.mens*12)); if (!d.left) N.push('✅ '+d.t+' : entièrement remboursé.'); } });
  ST.debts=ST.debts.filter(function(d){ return d.left>0; }); ST.debts.forEach(function(d){ if (d.mens>d.left*1.1&&d.left>0) d.mens=Math.round(d.left/12+1); });
  // 3. carrière hors entreprise, dossiers, vie perso
  careerYear(N);
  var DN=resolveDossiers(y+1);
  lifeYear(N);
  if (ST.cash<0) cover(-ST.cash,N);
  if (ST.surend&&ST.year+1>=ST.surend.until) endSurend(N);
  // 4. nouvelle année
  ST.cpi*=1+E.infl; e.infl=E.infl; e.rate=E.rate; e.livA=Math.max(.005,Math.round((E.infl+E.rate)/2*1000)/1000); e.mort=clamp(E.rate+.013+.002*gauss(),.01,.09);
  ST.age++; ST.year++; ST.q=1; ST.yr0=ST.yr; ST.yr=yrFresh();
  if (ST.biz&&ST.biz.pay) ST.biz.pay=r10(ST.biz.pay*(1+E.infl)); if (ST.biz) ST.biz.dec.pay=ST.biz.pay;
  if (ST.year>ST.endY){ ST.over=true; N.push('🏁 Fin de ta partie Standard : vingt ans d’entreprise.'); logL('Fin de partie'); }
  else if (ST.age>=RETIRE_AGE) retire(N);
  var after=net(), delta=after-before;
  ST.xp+=20+(delta>0?10:0);
  ST.hist.push({y:y,n:Math.round(after),r:Math.round(real(after))});
  logL('Clôture de '+y,delta);
  checkAch(); if (!ST.over){ ST.ecoY=drawEco(); ST.une=yearNews(DN); ST.ev=pickEvent(); }
  ST.yr.start=after;
  var biz=bizVal()+ccaVal()-bizB, inv=placed()-invB, saved=ST.yr0.saved||0;
  return {S0:S0,S1:snap(),y:y,delta:delta,inv:inv,biz:biz,other:delta-inv-biz,news:N.concat(DN.map(function(x){return x.txt;})),yr:ST.yr0,infl:E.infl,m:E.m,crash:E.crash}; }
// Trou sur le compte courant : Livret A, puis ventes forcées des placements, puis crédit plafonné, puis surendettement.
function cover(need,N){ var t=Math.min(need,ST.livret); if (t>0){ ST.livret-=t; cash(t,'livret'); need-=t; if (need<=0){ N.push('⚠️ Compte à sec : ton Livret A a comblé le trou.'); return; } }
  var got=forceSell(need); if (got>0){ need-=got; N.push('🔻 Ventes forcées de tes placements : '+eur(got)+' après impôt.'); } if (need<=0.005) return;
  need=Math.round(need*100)/100;
  var cap=creditCap(); ST.flags.capUsed=cap;
  var room=ST.surend?0:Math.max(0,cap-debtOf('conso')), lend=Math.min(need,room);
  if (lend>0){ cash(lend,'credit'); need-=lend; var cd=debtOf('conso',true); cd.left+=lend; cd.mens=Math.round(mensu(cd.left,.065,60)); N.push('🚨 Découvert perso : la banque t’accorde '+eur(lend)+' de plus à 6,5 % sur 5 ans (plafond : '+eur(cap)+').'); }
  if (need>0.005){ if (!ST.surend) startSurend(N);
    cash(need,'restrictions'); bump('hum',-6); N.push('🥖 La banque ne prête plus : tu te serres la ceinture, '+eur(need)+' de dépenses en moins.'); logL('Restrictions',need); } }
// Crédit de trésorerie perso : la banque prête au plus 6 mois de revenus du travail (3 000 € au minimum, indexés).
function creditCap(){ return Math.round(Math.max(3000*ST.cpi,6*Math.max(0,workMonthly()))); }
function debtOf(k,make){ var d=ST.debts.filter(function(x){return x.k===k;})[0]; if (!d&&make){ d={k:'conso',t:'Crédit de trésorerie',left:0,mens:0,rate:.065}; ST.debts.push(d); } return make?d:(d?d.left:0); }
function forceSell(need){ var got=0; ['cto','av','pea'].forEach(function(k){ if (got>=need) return; var H=ST.env[k].hold;
  for (var id in H){ if (got>=need) break; var h=H[id]; if (h.v<=0) continue; var gross=Math.min(h.v,(need-got)/.69+1), part=gross/h.v, gain=(h.v-h.b)*part, tax=taxOn(k,gain);
    h.v-=gross; h.b-=h.b*part; if (h.v<.01){ delete H[id]; } var nt=gross-tax; cash(nt,'vente'); ST.yr.out+=nt; ST.yr.tax+=tax; got+=nt; } }); return got; }
// Surendettement (Banque de France) : plan de 7 ans à 0 %, plus aucun crédit ; ce qui reste à la fin est effacé.
function startSurend(N){ ST.surend={y:ST.year,until:ST.year+7}; ST.flags.surend=(ST.flags.surend||0)+1; bump('hum',-10);
  ST.debts.forEach(function(d){ if (d.k==='conso'){ d.rate=0; d.mens=Math.round(d.left/84); d.t=d.t+' · plan de surendettement'; } });
  N.push('⚖️ Dossier de surendettement à la Banque de France : tes crédits sont gelés à 0 % sur 7 ans, et plus aucune banque ne te prête.'); logL('Surendettement'); }
function endSurend(N){ var er=0; ST.debts.forEach(function(d){ if (d.t.indexOf('plan de surendettement')>=0){ er+=d.left; d.left=0; } }); ST.debts=ST.debts.filter(function(d){return d.left>0;});
  ST.surend=null; N.push('🕊️ Fin du plan de surendettement'+(er>0?' : '+eur(er)+' de dettes effacées.':'.')); logL('Fin du surendettement',er); }
function retire(N){ var last=ST.job?ST.job.net:ST.biz?ST.biz.pay:1200*ST.cpi; ST.pension=Math.max(1000*ST.cpi,Math.round(last*.5)); ST.prof='retraite'; ST.over=true; N.push('🏖️ À '+RETIRE_AGE+' ans, tu prends ta retraite.'); logL('Retraite'); }

/* ===== MOTEUR : la Une ===== */
function yearNews(DN){ var y=ST.year, e=ST.eco, m=e.m;
  var res={tag:'Économie',t:'',p:'',dn:(DN||[]).map(function(x){return x.txt;})};
  if (y===Y0){ res.t='Les taux se stabilisent, la consommation repart doucement'; res.p='La BCE garde son taux à 2 %. Les ménages consomment prudemment, les petites marques en ligne se multiplient. Le SMIC est à 1 823 € brut.'; return res; }
  var inf=' Inflation de l’an dernier : '+pc(e.infl,1)+'. Livret A : '+pc(e.livA,1)+'.';
  if (e.crash){ res.tag='Krach'; res.t='Les Bourses mondiales ont chuté de '+pc(-m,0)+' l’an dernier'; res.p='Les ménages ont serré leur budget : les ventes des marques ont plongé. La reprise viendra, mais personne ne sait quand.'+inf; }
  else if (m>.2){ res.tag='Marchés'; res.t='Année faste : '+pct(m,0)+' pour les actions mondiales'; res.p='La confiance est là, les clients dépensent. Les meilleures années sont souvent suivies d’un coup de frein.'+inf; }
  else if (m<0){ res.tag='Marchés'; res.t='Économie au ralenti : '+pct(m,0)+' pour les actions mondiales'; res.p='Les commandes ralentissent, les clients comparent les prix.'+inf; }
  else if (e.infl>.035){ res.tag='Inflation'; res.t='Les prix flambent : '+pc(e.infl,1)+' d’inflation'; res.p='Tes fournisseurs et tes loyers suivent. Les clients regardent les étiquettes.'+inf; }
  else { res.t='Croissance modérée, marchés '+pct(m,0); res.p='L’emploi tient, les salaires suivent les prix. Une année classique pour les commerçants.'+inf; }
  return res; }

// E(id, condition, rubrique, titre, texte, choix A, choix B) ; un choix = {e, t, fx (étiquettes), run() → message}
function E(id,cond,kick,t,p,a,b,w){ return {id:id,cond:cond,kick:kick,t:t,p:p,a:a,b:b,w:w||1}; }
var EVENTS=[];
function evText(s){ return gz(String(s).replace(/%P/g,ST.partner||g('ta copine','ton copain')).replace(/%B/g,ST.biz?ST.biz.name:'ta boîte').replace(/%V/g,city().n).replace(/%E/g,ST.job?ST.job.emp:'ton employeur')); }
function evById(id){ for (var i=0;i<EVENTS.length;i++) if (EVENTS[i].id===id) return EVENTS[i]; return null; }
function pickEvent(){ var pool=EVENTS.filter(function(e){ if (ST.evY[e.id]!==undefined&&ST.year-ST.evY[e.id]<5) return false; if (e.once&&ST.evY[e.id]!==undefined) return false; try{ return !!e.cond(); }catch(x){ return false; } });
  if (!pool.length) return null; var tot=sum(pool,function(e){return typeof e.w==='function'?e.w():e.w;}), u=rnd()*tot;
  for (var i=0;i<pool.length;i++){ u-=typeof pool[i].w==='function'?pool[i].w():pool[i].w; if (u<=0) return pool[i].id; } return pool[pool.length-1].id; }
function chooseEvent(k,amt){ var e=evById(ST.ev); if (!e) return null; var msg;
  if (e.bet){ amt=Math.max(0,Math.min(Math.round(amt||0),Math.floor(ST.cash))); if (amt>0){ cash(-amt,'dossier'); openDossier({id:e.id,e:e.e||'🎲',t:e.dt||e.t,stake:amt,o:e.o,due:ST.year+(e.delay||1),steps:e.steps||[],ach:e.ach}); msg='Tu as misé '+eur(amt)+'. Dénouement en '+(ST.year+(e.delay||1))+'.'; } else msg='Tu n’as rien misé.'; ST.evDone=evText(e.t)+' · '+msg; }
  else { msg=evText(e[k].run()); ST.evDone=evText(e[k].t)+' · '+msg; }
  ST.evY[e.id]=ST.year; ST.ev=null; ST.xp+=10; ST.yr.ev=ST.evDone; logL(ST.evDone); checkAch(); return msg; }

/* ===== MOTEUR : dossiers en cours ===== */
function openDossier(D){ D.open=ST.year; D.uid=(ST.flags.duid=(ST.flags.duid||0)+1); ST.doss.push(D); }
function resolveDossiers(y){ var out=[], keep=[];
  ST.doss.forEach(function(D){
    (D.steps||[]).forEach(function(s){ if (D.open+s[0]===y&&y<D.due) out.push({txt:(D.e||'📁')+' '+evText(s[1])}); });
    if (D.due>y){ keep.push(D); return; }
    var u=rnd(), acc=0, o=D.o[D.o.length-1]; for (var i=0;i<D.o.length;i++){ acc+=D.o[i][0]; if (u<acc){ o=D.o[i]; break; } }
    var pay=Math.round((D.stake||0)*o[1]); if (pay) cash(pay,'dossier');
    var gain=pay-(D.stake||0); if (D.ach&&gain>0) (ST.achQ=ST.achQ||[]).push(D.ach);
    out.push({txt:(gain>0?'✅ ':gain<0?'❌ ':'📁 ')+evText(o[2])+(gain?' ('+sgn(gain)+')':''),gain:gain}); logL(evText(D.t)+' : '+evText(o[2]),gain); });
  ST.doss=keep; return out; }

  var rg=function(a,b,f){ return F.capped?'au plus '+f(b):f(a)+' à '+f(b); };
  if (F.capped) warn.unshift('Ton '+F.lim+' limite tes ventes.');
  el.innerHTML='<div class="card dark"><span class="lab d">Prévisionnel du T'+ST.q+' · une fourchette, jamais un chiffre exact</span><div class="fc3"><div><small>Chiffre d’affaires</small><b>'+rg(F.caLo,F.caHi,eur)+'</b></div><div><small>Résultat</small><b>'+rg(F.resLo,F.resHi,sgn)+'</b></div><div><small>Trésorerie</small><b>'+rg(F.cashLo,F.cashHi,eur)+'</b></div></div>'+
    '<p class="note">Demande ≈ '+Math.round(F.D/10)*10+' '+P.us+' · stock '+Math.round(F.stock)+' · capacité '+Math.round(F.cap)+'</p>'+(warn.length?'<p class="note" style="color:var(--dn-d)">⚠️ '+warn.join(' ')+'</p>':'')+
    '<div class="grid2"><button class="btn ghost sm" id="d-back"><span>Annuler</span></button><button class="btn gold" id="dec-go"><span>Maintenir pour lancer le T'+ST.q+'</span></button></div></div>';
  $('d-back').addEventListener('click',function(){ U.dec=null; go('biz'); });
  hold($('dec-go'),function(btn){ var dd=U.dec; U.dec=null; playQ(dd,btn); }); }

/* ===== UI : résultat du trimestre ===== */
function playQ(dec,btn){ var old=ST.cash, lvB=lvl(); var o=playQuarter(dec); if (!o) return; checkAch(); save(); showQuarter(o,old,lvB); }
function showQuarter(o,old,lvB){ screen('scr-end'); var r=o.R, gain=r?r.res>=0:o.rest>=0, B=ST.biz;
  var h='<span class="lab d">Résultat du T'+o.q+' '+o.y+(r?' · '+esc((B||{name:''}).name||ST.bizPast.length&&ST.bizPast[ST.bizPast.length-1].name||''):'')+'</span><div class="end-vis" id="end-vis"></div><div class="delta" id="end-d" style="color:'+(gain?'var(--up-d)':'var(--dn-d)')+'">0 €</div><p style="margin:0;text-align:center;color:var(--muted-d)">'+(r?'Résultat du trimestre':'Ce que ton budget perso a laissé')+'</p>';
  if (r) h+='<div class="card pad">'+kv('Chiffre d’affaires',eur(r.ca))+kv('Marge brute',eur(r.mb)+(r.ca?' · '+Math.round(r.mb/r.ca*100)+' %':''))+kv('EBE',sgn(r.ebe),r.ebe>=0?'up':'dn')+kv('Ventes',Math.round(r.sold+r.sol.n)+' '+(B?PROD(B).us:'unités')+' sur une demande de '+Math.round(r.D))+kv('Trésorerie',eur(r.cash0)+' → '+eur(r.cash1),r.cash1>=r.cash0?'up':'dn')+'</div>';
  if (o.N.length) h+='<div class="news">'+o.N.map(function(n){return '<span>'+esc(gz(n))+'</span>';}).join('')+'</div>';
  if (r) h+='<button class="btn ghost" id="why-go"><span>Pourquoi ?</span></button><div id="why" hidden>'+whyList(r)+'</div>';
  h+='<div class="card pad">'+kv('Ton compte perso',eur(ST.cash)+' <small class="'+(ST.cash-old>=0?'up':'dn')+'" style="font-size:12px">'+sgn(ST.cash-old)+'</small>')+kv('Patrimoine',eur(net()))+'</div>';
  h+='<button class="btn gold" id="end-go" style="margin-top:auto"><span>'+(ST.q>4?'Les comptes de '+o.y:'Continuer vers le T'+ST.q)+'</span></button>';
  $('end').innerHTML=h; $('end').parentNode.scrollTop=0;
  var val=r?r.res:o.rest;
  if (gain){ $('end-vis').innerHTML='<div style="font-size:80px;line-height:1;'+(RM?'':'animation:pop .5s cubic-bezier(.2,1.6,.4,1)')+'">💰</div>'; countTo($('end-d'),0,val,1000,sgn); for (var i=0;i<2;i++) setTimeout(function(){ bills($('end-vis'),10); },i*220); }
  else { $('end-vis').innerHTML='<svg width="90" height="108" viewBox="0 0 150 170" aria-hidden="true" style="'+(RM?'':'animation:slam .45s cubic-bezier(.5,0,.6,1.4)')+'"><path d="M50 6h50v92h38L75 164 12 98h38z" fill="#C8102E"/></svg>'; countTo($('end-d'),0,val,900,sgn); setTimeout(function(){ shake(app); },RM?0:420); }
  if (lvl()>lvB) setTimeout(function(){ toast('⬆️ <b>Niveau '+lvl()+'</b> · '+gz(LVT[Math.min(LVT.length-1,lvl()-1)])); },900);
  var w=$('why-go'); if (w) w.addEventListener('click',function(){ var z=$('why'); z.hidden=!z.hidden; w.lastChild.textContent=z.hidden?'Pourquoi ?':'Masquer le détail'; });
  $('end-go').addEventListener('click',function(){ if (ST.q>4) { go('home'); annual(); } else go(ST.biz?'biz':'home'); }); $('end-go').focus({preventScroll:true}); }

/* ===== UI : clôture de l'année ===== */
function annual(){ if (ST.q<=4) return; if (ST.ev){ if (cur!=='home') go('home'); shake($('next')); toast('Décide d’abord : '+esc(evText(evById(ST.ev).t)),'bad'); return; }
  if (ST.biz&&ST.biz.affY!==ST.year){ affectSheet(); return; } preRecap(); }
function affectSheet(){ var B=ST.biz, A0=affectPreview(0,0), Y=A0.Y, pm=primeMax();
  var S=sheet('Les comptes de '+ST.year,'<span class="lab">Clôture '+ST.year+'</span><h3>Que fais-tu du résultat ?</h3>'+
    '<div class="ticket"><h3>'+esc(B.name)+'</h3><div class="d">Compte de résultat '+ST.year+'</div><div class="ln"><span>Chiffre d’affaires</span><span>'+eur(Y.ca)+'</span></div><div class="ln"><span>Marge brute</span><span>'+eur(Y.mb)+'</span></div><div class="ln"><span>EBE</span><span>'+sgn(Y.ebe)+'</span></div><div class="ln"><span>Résultat avant impôt</span><span>'+sgn(Y.res)+'</span></div><div class="ln"><span>Impôt sur les sociétés<small>15 % jusqu’à 42 500 €, 25 % au-delà'+(B.lossCarry?' · pertes passées déduites':'')+'</small></span><span id="af-is"></span></div><div class="tot"><span>RÉSULTAT NET</span><span id="af-net"></span></div></div>'+
    '<div class="card pad sec"><label class="lab" for="af-p">Une prime pour toi (coût pour ta société)</label><input type="range" id="af-p" min="0" max="'+pm+'" step="100" value="0"'+(pm?'':' disabled')+'><div class="kv"><span>Prime</span><b id="af-p-v"></b></div>'+
    '<label class="lab" for="af-d">Un dividende (flat tax 31,4 %)</label><input type="range" id="af-d" min="0" max="'+Math.max(0,A0.divMax)+'" step="100" value="0"'+(A0.divMax>0?'':' disabled')+'><div class="kv"><span>Dividende</span><b id="af-d-v"></b></div>'+
    '<div class="kv tot"><span>Dans ta poche</span><b id="af-pk" class="up"></b></div><div class="kv"><span>Reste dans ta boîte</span><b id="af-st"></b></div><p class="note">Réinvestir garde la trésorerie pour grandir. Une prime est une charge (moins d’impôt sur les sociétés) mais coûte 1,8 fois ce que tu touches et paie l’impôt sur le revenu. Un dividende vient du bénéfice après impôt.</p></div>',
    '<button class="btn gold" id="af-ok"><span>Maintenir pour valider</span></button><button class="btn ghost" id="af-no"><span>Plus tard</span></button>');
  var rp=$('af-p'), rd=$('af-d');
  function upd(){ var A=affectPreview(+rp.value,+rd.value); rd.max=Math.max(0,A.divMax); if (+rd.value>A.divMax) rd.value=A.divMax; A=affectPreview(+rp.value,+rd.value); [rp,rd].forEach(rangeFill);
    $('af-is').textContent=A.is>.5?'−'+eur(A.is).replace('−',''):'0 €'; $('af-net').textContent=sgn(A.net); $('af-net').className=A.net>=0?'up':'dn';
    $('af-p-v').textContent=A.prime?eur(A.prime)+' → '+eur(A.primeNet)+' nets d’impôt':'Aucune'; $('af-d-v').textContent=A.div?eur(A.div)+' → '+eur(A.divNet)+' nets':'Aucun';
    $('af-pk').textContent=sgn(A.pocket); $('af-st').textContent=eur(A.stay); }
  rp.addEventListener('input',upd); rd.addEventListener('input',upd); upd();
  $('af-no').addEventListener('click',S.close);
  hold($('af-ok'),function(btn){ var o=ST.cash, A=bizAffect(+rp.value,+rd.value); S.close(); save(); hud(o); if (A&&A.pocket>0) bills(btn,8,$('hn-cash')); setTimeout(preRecap,RM?0:300); }); }
function preRecap(){ var Bu=budget(), B=ST.biz, Y=B&&B.years.length&&B.years[B.years.length-1].y===ST.year?B.years[B.years.length-1]:null;
  var S=sheet('Clôturer '+ST.year,'<span class="lab">Avant de valider</span><h3>Ton année '+ST.year+'</h3>'+
    '<div class="card pad"><div class="blk-h"><b>🏢 Vie pro</b></div>'+(Y?kv('Chiffre d’affaires',eur(Y.ca))+kv('Résultat net',sgn(Y.net),Y.net>=0?'up':'dn')+kv('Trésorerie',eur(B.cash))+kv('Valorisation',eur(bizValue(B).v))+(Y.div?kv('Dividende versé',eur(Y.div)):''):kv('Situation',esc(gz(profName()||'—')),'w'))+'</div>'+
    '<div class="card dark pad"><div class="blk-h"><b>🏛️ Patrimoine</b></div>'+kv('💳 Compte perso',eur(ST.cash))+(ST.livret?kv('🐷 Livret A',eur(ST.livret)):'')+(debtTot()?kv('🏦 Tes dettes',eur(-debtTot())):'')+(B?kv('🏢 Ta part de '+esc(B.name)+' (nette d’impôt latent)',eur(bizVal()+ccaVal())):'')+(ST.doss.length?kv('📁 Mises en cours',eur(dossVal())):'')+'<div class="kv tot"><span>Patrimoine total</span><b style="color:var(--gold)">'+eur(net())+'</b></div></div>'+
    '<div class="card pad"><div class="blk-h"><b>❤️ Vie perso</b></div>'+kv('Décision',esc(ST.yr.ev||'—'),'w')+kv('Couple',ST.couple===null?'Célibataire':ST.partner+' · '+ST.couple+' / 100')+kv('Enfants',ST.kids||'Aucun')+kv('Budget du mois',sgn(Bu.rest),Bu.rest>=0?'up':'dn')+'</div>'+
    '<p class="note">Les marchés, ta vie perso et l’économie de '+(ST.year+1)+' se jouent à la clôture.</p>',
    '<button class="btn gold" id="pr-ok"><span>Maintenir pour clôturer '+ST.year+'</span></button><button class="btn ghost" id="pr-no"><span>Revenir</span></button>');
  $('pr-no').addEventListener('click',S.close);
  hold($('pr-ok'),function(){ S.close(); var lv=lvl(), rep=closeYear(); var hi=+(store(KEY+'-hi')||0), rn=Math.round(real(net())); if (rn>hi) store(KEY+'-hi',String(rn)); save(); showBilan(rep,lv); }); }
function dl(a,b,lab){ var d=b-a; return '<div class="kv"><span>'+lab+'</span><b>'+eur(b)+(Math.round(d)?' <small class="'+(d>=0?'up':'dn')+'" style="font-size:12px">'+sgn(d)+'</small>':'')+'</b></div>'; }
function showBilan(o,lvB){ screen('scr-end'); var gain=o.delta>=0, A=o.S0, Z=o.S1;
  var pro=(A.title!==Z.title?kv('Avant',esc(gz(A.title||'—')),'w')+kv('Maintenant',esc(gz(Z.title||'—')),'w'):kv('Situation',esc(gz(Z.title||'—')),'w'))+(Z.bizRes!==null&&Z.bizRes!==undefined?kv('Résultat net de ta boîte',sgn(Z.bizRes),Z.bizRes>=0?'up':'dn'):'');
  var pat=dl(A.cash,Z.cash,'💳 Compte perso')+(A.livret||Z.livret?dl(A.livret,Z.livret,'🐷 Livret A'):'')+(A.debts||Z.debts?dl(-A.debts,-Z.debts,'🏦 Dettes'):'')+(A.biz||Z.biz?dl(A.biz,Z.biz,'🏢 Ta boîte'):'')+(A.doss||Z.doss?dl(A.doss,Z.doss,'📁 Mises en cours'):'')+
    '<div class="kv tot"><span>Patrimoine</span><b style="color:var(--gold)">'+eur(Z.net)+'</b></div>'+kv('En euros de 2026',eur(real(Z.net)));
  var per=kv('Décision',esc(o.yr.ev||'—'),'w')+kv('Humeur',A.hum+' → '+Z.hum)+(Z.couple!==null||A.couple!==null?kv('Couple',(A.couple===null?'—':A.couple)+' → '+(Z.couple===null?'célibataire':Z.couple)):'')+(Z.kids!==A.kids?kv('Enfants',A.kids+' → '+Z.kids):'');
  var h='<span class="lab d">Bilan de l’année '+o.y+' · '+esc(ST.pseudo)+', '+(ST.age-1)+' ans</span><div class="end-vis" id="end-vis"></div><div class="delta" id="end-d" style="color:'+(gain?'var(--up-d)':'var(--dn-d)')+'">0 €</div><p style="margin:0;text-align:center;color:var(--muted-d)">Inflation '+pc(o.infl,1)+' · actions mondiales '+pct(o.m,0)+'</p>'+
    (o.news.length?'<div class="news">'+o.news.map(function(n){return '<span>'+esc(gz(n))+'</span>';}).join('')+'</div>':'')+
    '<div class="card pad"><div class="blk-h"><b>🏢 Vie pro</b></div>'+pro+'</div><div class="card pad"><div class="blk-h"><b>🏛️ Patrimoine</b></div>'+pat+'</div><div class="card pad"><div class="blk-h"><b>❤️ Vie perso</b></div>'+per+'</div>'+
    '<button class="btn gold" id="end-go" style="margin-top:auto"><span>'+(ST.over?'Voir la fin de partie':'Commencer '+ST.year)+'</span></button>';
  $('end').innerHTML=h; $('end').parentNode.scrollTop=0;
  if (gain){ $('end-vis').innerHTML='<div style="font-size:80px;line-height:1;'+(RM?'':'animation:pop .5s cubic-bezier(.2,1.6,.4,1)')+'">💰</div>'; countTo($('end-d'),0,o.delta,1100,sgn); for (var i=0;i<3;i++) setTimeout(function(){ bills($('end-vis'),12); },i*220); }
  else { $('end-vis').innerHTML='<svg width="90" height="108" viewBox="0 0 150 170" aria-hidden="true"><path d="M50 6h50v92h38L75 164 12 98h38z" fill="#C8102E"/></svg>'; countTo($('end-d'),0,o.delta,900,sgn); }
  if (lvl()>lvB) setTimeout(function(){ toast('⬆️ <b>Niveau '+lvl()+'</b> · '+gz(LVT[Math.min(LVT.length-1,lvl()-1)])); },900);
  $('end-go').addEventListener('click',function(){ if (ST.over) endGame(); else go('home'); }); $('end-go').focus({preventScroll:true}); }
function endGame(){ screen('scr-end'); var n=net(), nr=real(n), rk=rankOf(nr), hum=ST.humH.length?Math.round(sum(ST.humH)/ST.humH.length):ST.hum, B=ST.biz;
  $('end').innerHTML='<span class="lab d">Fin de partie · '+(ST.year-1)+' · '+esc(ST.pseudo)+'</span><div style="font-size:80px;text-align:center;line-height:1.1">'+rk[0]+'</div><h2 class="H" style="margin:0;text-align:center;font-size:30px">'+gz(rk[1])+'</h2><div class="delta" id="fin" style="color:var(--gold)">0 €</div><p style="margin:0;text-align:center;color:var(--muted-d)">soit '+eur(nr)+' en euros de 2026</p>'+
    '<div class="card pad">'+kv('Âge',ST.age+' ans')+(B?kv('Ta boîte',esc(B.name)+' · valorisée '+eur(bizValue(B).v)):kv('Ta boîte','Aucune en activité'))+kv('Faillites',ST.flags.fails||0)+kv('Niveau',lvl())+kv('Succès',Object.keys(ST.ach).length+' / '+ACH.length)+kv('Bien-être moyen',hum+' / 100')+kv('Record',eur(Math.max(nr,+(store(KEY+'-hi')||0)))+' (euros 2026)')+'</div>'+
    '<button class="btn gold" id="replay" style="margin-top:auto"><span>Rejouer</span></button>';
  countTo($('fin'),0,n,1600); bills($('fin'),16);
  $('replay').addEventListener('click',function(){ store(KEY,null); renderTitle(); }); }

/* ===== UI : budget, placements, profil ===== */
function blk(title,L,sign){ var t=sum(L,function(x){return x.a;}); return '<section class="card bblk"><h3><span>'+title+'</span><b>'+(L.length?(sign>0?'+':'−')+eur(Math.abs(t)).replace('−',''):'—')+'</b></h3>'+(L.length?L.map(function(x){ return '<div class="bl"><span>'+esc(gz(x.t))+(x.s?'<small>'+esc(gz(x.s))+'</small>':'')+'</span><b class="'+(sign>0&&x.a<0?'dn':'')+'">'+(sign>0?(x.a<0?'':'+'):'−')+eur(Math.abs(x.a)).replace('−','')+'</b></div>'; }).join(''):'<div class="bl"><span class="muted">Rien pour l’instant</span></div>')+'</section>'; }
VIEWS.budget=function(){ var B=budget(), W=where100(B);
  var h='<section class="sec full"><div class="sec-h"><h2>Où vont tes 100 €</h2><span class="lab">'+esc(ST.pseudo)+' · '+ST.year+'</span></div><div class="card pad sec"><div class="alloc" role="img" aria-label="Répartition de tes revenus">'+W.map(function(p){return p[1]>0?'<i style="width:'+(p[1]*100)+'%;background:'+p[2]+'"></i>':'';}).join('')+'</div><div class="legend">'+W.map(function(p){return '<span><i style="background:'+p[2]+'"></i>'+p[0]+' '+Math.round(p[1]*100)+' €</span>';}).join('')+'</div>'+
    kv('Ce qui rentre chaque mois',eur(B.tin))+kv('Ce qui sort',eur(-B.tout))+'<div class="kv tot"><span>Reste du mois</span><b class="'+(B.rest>=0?'up':'dn')+'">'+sgn(B.rest)+'</b></div>'+(ST.biz?kv('Salaire qu’il te faut pour ne pas être dans le rouge',eur(payNeeded())):'')+'</div></section>';
  h+='<div class="sec">'+blk('💼 Revenus du travail',B.W,1)+'</div><div class="sec">'+blk('🧾 Charges fixes',B.F,-1)+blk('🏦 Crédits',B.C,-1)+'</div>';
  $('body').innerHTML='<div class="grid-d">'+h+'</div>'; };
VIEWS.inv=function(){ $('body').innerHTML='<section class="sec"><div class="sec-h"><h2>Placer</h2></div><div class="card pad done"><span class="e">📈</span><span style="font-size:14.5px;line-height:1.5">Livret A, PEA, compte-titres et assurance vie arrivent avec la clôture annuelle complète (étape G). Pour l’instant, ton épargne reste sur ton compte perso.</span></div></section>'; };
VIEWS.profil=function(){ var L=ST.log.slice(-12).reverse();
  $('body').innerHTML='<div class="grid-d"><section class="sec"><div class="sec-h"><h2>Profil</h2></div><div class="card pad">'+kv('Pseudo',esc(ST.pseudo))+kv('Parcours',STARTS[ST.start].n)+kv('Patrimoine',eur(net()))+kv('En euros de 2026',eur(real(net())))+kv('Fin de partie','Décembre '+ST.endY+' (format Standard, 20 ans)')+'</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn ghost" id="quit"><span>Écran titre</span></button><button class="btn ghost" id="wipe"><span>Effacer la partie</span></button></div></section>'+
    '<section class="sec"><div class="sec-h"><h2>Journal</h2></div><div class="card pad">'+L.map(function(x){ return kv((x.q?'T'+x.q+' ':'')+x.y,esc(gz(x.txt)),'w'); }).join('')+'</div></section></div>'; bindQuit(); };
function bindQuit(){ $('quit').addEventListener('click',function(){ save(); renderTitle(); });
  var w=$('wipe'), armed=false; w.addEventListener('click',function(){ if (!armed){ armed=true; w.lastChild.textContent='Sûr ? Touche encore'; w.style.borderColor='var(--red)'; return; } store(KEY,null); renderTitle(); }); }
/* ===== UI : conseils « ! » ===== */
var tipI=0;
function tipRefresh(){ var L=tipsFor(cur==='dec'?'biz':cur); $('tip-n').textContent=L.length; $('tip').hidden=!L.length; $('tip').dataset.seen=ST.seenTips[cur+ST.year]?'1':'0'; var o=$('bubble'); if (o) o.remove(); tipI=0; }
$('tip').addEventListener('click',function(){ var o=$('bubble'); if (o){ o.remove(); return; } var L=tipsFor(cur==='dec'?'biz':cur); if (!L.length) return; ST.seenTips[cur+ST.year]=1; $('tip').dataset.seen='1'; save();
  var b=document.createElement('div'); b.className='bubble'; b.id='bubble'; b.setAttribute('role','dialog'); b.setAttribute('aria-label','Conseil');
  function draw(){ var t=L[tipI]; b.innerHTML='<h4>'+t[0]+'</h4><p>'+t[1]+'</p><div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">'+(tipI+1)+' / '+L.length+'</span><button class="btn sm" id="tip-n2"><span>'+(tipI<L.length-1?'Suivant':'Compris')+'</span></button></div>'; $('tip-n2').addEventListener('click',function(){ if (tipI<L.length-1){ tipI++; draw(); } else { b.remove(); tipI=0; } }); }
  $('scr-hub').appendChild(b); draw(); });

/* ===== UI : code secret ===== */
function cheat(){ if (!ST||!ST.prof) return; if (ST.konami){ toast('👾 Code déjà utilisé.'); return; } ST.konami=true; var old=ST.cash; cash(1000,'autre'); unlock('konami'); save(); hud(old); bills($('hud-av'),12,$('hn-cash')); toast('👾 <b>Code secret</b> · +1 000 €'); }
var KS=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'],kp=0;
document.addEventListener('keydown',function(e){ if ($('scr-hub').hidden) return; var k=e.key.length===1?e.key.toLowerCase():e.key; kp=k===KS[kp]?kp+1:(k===KS[0]?1:0); if (kp===KS.length){ kp=0; cheat(); } });
var taps=0,tapT=0; $('hud-av').addEventListener('click',function(){ var n=Date.now(); taps=n-tapT<700?taps+1:1; tapT=n; if (taps>=7){ taps=0; cheat(); } });

renderTitle();
})();
</script>
