<!doctype html>

<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="La Corbeille, Saison 4 : une vie de 20 ans à la retraite. Études, boulot ou boîte, placements, immobilier, fiscalité 2026.">
<meta property="og:title" content="La Corbeille · Saison 4">
<meta property="og:description" content="Tu as 20 ans. Bâtis ton patrimoine sans rater ta vie.">
<meta property="og:type" content="website">
<title>La Corbeille · Saison 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --navy:#0B1E3B;--navy2:#13294B;--navy3:#1D3A63;--line-d:#2A4570;
  --bg:#F2F4F8;--card:#FFFFFF;--line:#DCE2EC;--ink:#0E1726;--muted:#5B6B82;--muted-d:#A9B8CF;
  --red:#C8102E;--red-l:#FBE7EA;--gold:#C9A227;--gold-l:#FBF4DC;--gold-d:#7A5F0A;--green:#1F8A5B;--green-l:#E3F3EA;--blue-l:#E6EEF9;
  --up-d:#4FD18F;--dn-d:#FF6B7F;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.app{width:100%;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.H{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;letter-spacing:-.01em}
.M{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dark .lab,.lab.d{color:var(--muted-d)}
.up{color:var(--green)}.dn{color:var(--red)}
.dark .up,.end .up{color:var(--up-d)}.dark .dn,.end .dn{color:var(--dn-d)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.note{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.dark .note{color:var(--muted-d)}

/* boutons */
.btn{border:0;border-radius:12px;min-height:50px;padding:0 18px;font:700 16px 'Public Sans',sans-serif;cursor:pointer;background:var(--navy);color:#fff;transition:transform .08s,filter .15s;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn.hold{touch-action:none}
.btn:active{transform:scale(.98)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.dark .btn.ghost,.end .btn.ghost{color:#fff;border-color:var(--line-d)}
.btn.sm{min-height:44px;font-size:14px;padding:0 12px}
.btn[disabled]{opacity:.4;cursor:default}
.btn .fill{position:absolute;inset:0;background:rgba(255,255,255,.3);transform:scaleX(0);transform-origin:left;pointer-events:none}
.btn.on .fill{transform:scaleX(1);transition:transform .5s linear}
.btn span{position:relative}
.link{background:none;border:0;color:var(--navy);font:600 14px 'Public Sans',sans-serif;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 6px}
.dark .link{color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--blue-l);color:var(--navy);white-space:nowrap}
.chip.g{background:var(--green-l);color:var(--green)}.chip.r{background:var(--red-l);color:var(--red)}.chip.o{background:var(--gold-l);color:var(--gold-d)}
.chips{display:flex;gap:5px;flex-wrap:wrap}

/* cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(11,30,59,.05);min-width:0}
.card.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.pad{padding:14px 16px}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-h h2{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:20px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.dark .kv,.end .kv{border-color:var(--line-d)}
.kv:last-child{border-bottom:0}
.kv b{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right;flex:0 1 auto;max-width:64%;overflow-wrap:break-word}
.kv b.w{white-space:normal;font-family:'Public Sans',sans-serif;font-size:13.5px}
.kv>span{color:var(--muted);min-width:0;flex:1 1 auto}
.kv>span small{display:block;font-size:12px;line-height:1.3}
.dark .kv>span,.end .kv>span{color:var(--muted-d)}
.kv.tot{font-size:16px}.kv.tot span{color:inherit;font-weight:700}
.big{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:85%;font-size:38px;line-height:1;letter-spacing:-.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-d{display:flex;flex-direction:column;gap:18px}

/* titre */
.title{position:relative;height:100%;overflow-y:auto;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.title .logo{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:80%;font-size:clamp(46px,13vw,84px);line-height:.95;letter-spacing:-.02em}
.title .logo i{font-style:normal;color:var(--gold)}
.title .rule{width:56px;height:3px;background:var(--red)}
.title p{margin:0;color:var(--muted-d);font-size:16px;max-width:34ch;line-height:1.45}
.title .btn{min-width:240px}
.title a{color:var(--muted-d);font-size:13px}

/* en-tête */
.hud{background:var(--navy);color:#fff;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;flex-direction:column;gap:8px}
.hud-top{display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none;border:0;padding:0;cursor:pointer;background:var(--navy3)}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who b{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12.5px;color:var(--muted-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);background:var(--gold);border-radius:6px;padding:2px 6px;font-weight:600;white-space:nowrap}
.next{border:0;border-radius:12px;background:var(--gold);color:var(--navy);font:700 14px 'Public Sans',sans-serif;min-height:44px;padding:0 12px;cursor:pointer;white-space:nowrap}
.next.wait{background:var(--navy3);color:var(--muted-d)}
.hud-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hn{background:var(--navy2);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.hn small{font-size:10.5px;color:var(--muted-d);font-weight:600;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hn b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;gap:10px;align-items:center}
.rest{flex:none;font-size:12px;font-weight:600;color:var(--muted-d);white-space:nowrap}
.rest b{font-family:'IBM Plex Mono',monospace;color:#fff;font-weight:600}
.rest b.dn{color:var(--dn-d)}
.meter{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted-d);min-width:0;white-space:nowrap}
.meter .ml{overflow:hidden;text-overflow:ellipsis;max-width:90px}
@media (max-width:520px){.meter .mw{display:none}}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--navy3);overflow:hidden;min-width:24px}
.meter i b{display:block;height:100%;border-radius:3px;transition:width .5s}
.meter em{font-style:normal;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px}

.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-top:14px;padding-bottom:90px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:4px max(2px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(2px,env(safe-area-inset-left,0px))}
.nav button{flex:1 1 0;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font:600 10px 'Public Sans',sans-serif;color:var(--muted);cursor:pointer;min-height:54px;border-radius:10px;padding:0;position:relative;white-space:nowrap}
.nav button .e{font-size:20px;line-height:1.3}
.nav button .t{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button .tl{display:none}
.nav button[aria-current="page"]{color:var(--navy);background:var(--blue-l)}
.nav button .dot{position:absolute;top:5px;right:calc(50% - 17px);width:8px;height:8px;border-radius:4px;background:var(--red)}

/* Une et décision */
.une{display:flex;flex-direction:column;gap:8px}
.une b.t{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:19px;line-height:1.2}
.une p{margin:0;color:var(--muted-d);font-size:14.5px;line-height:1.5}
.une .dn2{margin-top:4px;padding-top:10px;border-top:1px solid var(--line-d);display:flex;flex-direction:column;gap:6px}
.une .dn2 span{font-size:14px;line-height:1.45}
.ev{overflow:hidden}
.ev-top{background:var(--navy);color:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ev-top .kick{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.1em;background:var(--red);color:#fff;border-radius:4px;padding:3px 7px}
.ev-top h3{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:21px;line-height:1.15}
.ev-top p{margin:0;color:var(--muted-d);font-size:14.5px;line-height:1.45}
.vs{display:grid;grid-template-columns:1fr 1fr;position:relative}
.vs button{border:0;background:#fff;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;min-height:150px;font-family:inherit;color:var(--ink);transition:background .15s;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;overflow:hidden;min-width:0}
.vs button+button{border-left:1px solid var(--line)}
.vs button .e{font-size:34px;line-height:1.15}
.vs button b{font-size:15.5px;line-height:1.2}
.vs button .chips{justify-content:center}
.vs button .chip{white-space:normal;text-align:center;line-height:1.25}
.vs button.on{background:var(--gold-l)}
.vs button .fill{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left}
.vs button.on .fill{transform:scaleX(1);transition:transform .5s linear}
.vs .x{position:absolute;left:50%;top:38px;transform:translateX(-50%);width:34px;height:34px;border-radius:17px;background:var(--navy);color:var(--gold);font:800 12px 'Archivo',sans-serif;display:flex;align-items:center;justify-content:center;border:3px solid #fff;pointer-events:none}
.ev-foot{padding:8px 16px 12px;font-size:12.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
.done{display:flex;gap:10px;align-items:flex-start}
.done .e{font-size:22px}
.doss{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}
.doss:last-child{border-bottom:0}
.doss .e{font-size:20px;flex:none}
.doss .n{flex:1;min-width:0}
.doss small{display:block;color:var(--muted);font-size:12.5px}

/* curseurs */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--navy) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--navy)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:14px;background:#fff;border:3px solid var(--navy);margin-top:-10px;box-shadow:0 2px 6px rgba(11,30,59,.25)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:14px;background:#fff;border:3px solid var(--navy)}
.amount{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.quick button{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:44px;padding:0 2px;font:600 13px 'Public Sans',sans-serif;cursor:pointer;color:var(--ink);white-space:nowrap}

/* listes */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;width:100%;text-align:left;font-family:inherit;color:var(--ink);border-left:0;border-right:0;border-top:0;cursor:pointer;min-height:60px}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.row .n{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .n b{font-size:15px;font-weight:700}
.row .n small{font-size:12.5px;color:var(--muted);line-height:1.3}
.row .v{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.row .v b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14.5px}
.row .v small{font-size:12px;font-weight:600}
.list{overflow:hidden;padding:0}
.env-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--navy);color:#fff}
.env-h .n{flex:1;display:flex;flex-direction:column;min-width:0}
.env-h .n b{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:17px}
.env-h .n small{font-size:12px;color:var(--muted-d)}
.env-h .t{font-family:'IBM Plex Mono',monospace;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;min-height:44px;font:600 14px 'Public Sans',sans-serif;color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.alloc{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--line)}
.alloc i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* budget */
.bblk{padding:0;overflow:hidden}
.bblk h3{margin:0;padding:12px 16px 8px;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.bblk h3 b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px}
.bl{display:flex;justify-content:space-between;gap:12px;padding:8px 16px;border-top:1px solid var(--line);font-size:14.5px;align-items:baseline}
.bl span{min-width:0}
.bl small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:1px}
.bl b{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap}

/* fiche de paie, ticket */
.ticket{background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;padding:16px 16px 20px;position:relative;font-family:'IBM Plex Mono',monospace;margin-bottom:12px}
.ticket::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-12px;height:12px;background:linear-gradient(-45deg,transparent 7px,#fff 0) 0 0/14px 12px repeat-x,linear-gradient(45deg,transparent 7px,#fff 0) 0 0/14px 12px repeat-x}
.ticket h3{margin:0;text-align:center;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:85%;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.ticket .d{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.ticket .grp{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin:10px 0 2px}
.ticket .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.ticket .ln small{display:block;font-family:'Public Sans',sans-serif;font-size:11.5px;color:var(--muted)}
.ticket .tot{display:flex;justify-content:space-between;font-size:17px;padding-top:10px;font-weight:600}

/* immo */
.prop{overflow:hidden;padding:0}
.prop-h{display:flex;gap:12px;padding:14px;align-items:flex-start}
.prop-h .ph{width:60px;height:60px;border-radius:10px;background:var(--navy2);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-size:24px;line-height:1}
.prop-h .ph small{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--muted-d);margin-top:4px}
.prop-h .n{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prop-h .n b{font-size:16px;font-weight:700;line-height:1.2}
.prop-h .n small{font-size:13px;color:var(--muted);line-height:1.35}
.prop-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.prop-k div{padding:8px 10px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0}
.prop-k div:last-child{border-right:0}
.prop-k small{font-size:11px;color:var(--muted);font-weight:600;line-height:1.2}
.prop-k b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);font-size:13px}
.dpe{display:inline-flex;width:22px;height:22px;border-radius:4px;color:#fff;font-weight:800;font-size:12px;align-items:center;justify-content:center;vertical-align:middle}

/* boutique */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{border:1px solid var(--line);background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;cursor:pointer;font:600 12px 'Public Sans',sans-serif;color:var(--ink);min-height:64px}
.cat .e{font-size:24px}
.cat[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);border-left:0;border-right:0;border-top:0;min-height:60px}
.item:last-child{border-bottom:0}
.item .e{font-size:30px;width:44px;text-align:center;flex:none}
.item .n{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.item .n b{font-size:15px}.item .n small{font-size:12.5px;color:var(--muted)}
.item .p{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;white-space:nowrap}
.item.own{background:var(--green-l)}
.slot{display:flex;justify-content:center;gap:8px;padding:14px;background:var(--navy);border-radius:12px}
.slot span{width:60px;height:68px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:36px}

function closeYear(){ var S0=snap(), y=ST.year, N=[], before=net(), invB=placed(), propB=propNet(), bizB=bizVal(), cash0=ST.cash, B=budget();
  var flow0={}; for (var q in ST.flow) flow0[q]=ST.flow[q];

  var saved=B.rest*12; cash(saved,'epargne');
  if (ST.prof==='etudiant'&&ST.fund==='pret'){ var st=ST.debts.filter(function(x){return x.k==='stu';})[0]; if (st) st.left+=ST.study.loanM*12; }
  // 2. économie
  var E=drawEco(), e=ST.eco; e.m=E.m; e.crash=E.crash;

  for (var k in ASSETS) ASSETS[k].forEach(function(a){ var r=assetRet(a,E.m); ST.last.r[a.id]=r; var h=ST.env[k].hold[a.id]; if (h) h.v=Math.round(h.v*(1+r)*100)/100; });
  var livI=Math.round(ST.livret*e.livA*100)/100; ST.livret+=livI;
  if (E.crash) N.push('📉 Krach : les marchés mondiaux '+pct(E.m,0)+' sur l’année.');
  // 3. immobilier
  for (var c in e.ci){ var gr=E.infl+.004+.035*gauss()-(E.rate-e.rate>.008?.05:0); e.ci[c]*=1+gr; ST.last['ci_'+c]=gr; }
  ST.props.forEach(function(p){ var gr=ST.last['ci_'+p.cityK]; p.val=Math.round(p.val*(1+gr)); p.rent=Math.round(p.rent*(1+E.infl*.9)*100)/100;
    if (p.left>0){ var it=p.left*p.rate; p.left=Math.max(0,Math.round(p.left-(p.mens*12-it))); if (!p.left){ p.mens=0; p.ins=0; N.push('🏦 Crédit de ton '+p.t+' entièrement remboursé !'); } }
    if (p.ptz&&p.ptz.left>0){ p.ptz.left=Math.max(0,Math.round(p.ptz.left-p.ptz.mens*12)); } });
  // 4. dettes
  ST.debts.forEach(function(d){ if (d.mens>0&&d.left>0){ var it=d.left*d.rate; d.left=Math.max(0,Math.round(d.left+it-d.mens*12)); if (!d.left) N.push('✅ '+d.t+' : entièrement remboursé.'); } });
  ST.debts=ST.debts.filter(function(d){ return d.left>0||(d.k==='stu'&&ST.prof==='etudiant'); }); ST.debts.forEach(function(d){ if (d.mens>d.left*1.1&&d.left>0) d.mens=Math.round(d.left/12+1); });
  // 5. carrière

  // 6. dossiers qui arrivent à échéance

  // 8. découvert

      else { var cd=ST.debts.filter(function(x){return x.k==='conso';})[0]; if (!cd) ST.debts.push(cd={k:'conso',t:'Crédit de trésorerie',left:0,mens:0,rate:.065}); cd.left+=need; cd.mens=Math.round(mensu(cd.left,.065,60)); N.push('🚨 Découvert : la banque t’accorde '+eur(need)+' de plus à 6,5 % sur 5 ans.'); } }

  return {S0:S0,S1:snap(),y:y,delta:delta,saved:saved,inv:placed()-invB,prop:propNet()-propB,biz:bizVal()-bizB,other:other,news:N.concat(DN.map(function(x){return x.txt;})),yr:ST.yr0,infl:E.infl,m:E.m,crash:E.crash}; }

function openDossier(D){ D.open=ST.year; D.uid=(ST.flags.duid=(ST.flags.duid||0)+1); ST.doss.push(D); }
function resolveDossiers(y){ var out=[], keep=[];
  ST.doss.forEach(function(D){
    (D.steps||[]).forEach(function(s){ if (D.open+s[0]===y&&y<D.due) out.push({txt:(D.e||'📁')+' '+evText(s[1])}); });
    if (D.due>y){ keep.push(D); return; }
    var u=rnd(), acc=0, o=D.o[D.o.length-1]; for (var i=0;i<D.o.length;i++){ acc+=D.o[i][0]; if (u<acc){ o=D.o[i]; break; } }
    var oi=D.o.indexOf(o), ex=D.ex&&D.ex[oi]||{}, pay=Math.round((D.stake||0)*o[1])+(ex.cash||0); if (pay) cash(pay,'dossier');
    if (ex.tre&&ST.biz) ST.biz.tre+=ex.tre; if (ex.hum) bump('hum',ex.hum); if (ex.rep) bump('rep',ex.rep);
    var gain=pay-(D.stake||0); if (D.ach&&gain>0) (ST.achQ=ST.achQ||[]).push(D.ach);
    out.push({txt:(gain>0?'✅ ':gain<0?'❌ ':'📁 ')+evText(o[2])+(gain?' ('+sgn(gain)+')':''),gain:gain}); logL(evText(D.t)+' : '+evText(o[2]),gain); });

function contractKV(pre){ var d=dom(), p=ST.prof, h='';
  if (p==='apprenti'){ var b=apprentiBrut(ST.age,ST.study.y)*ST.cpi; h+=kv('Employeur',vtxt(d.emp))+kv('Contrat','Apprentissage · '+d.d+' ans')+kv('Formation',d.dip+' · '+vtxt(d.school))+kv('Rythme','3 sem. atelier / 1 sem. CFA')+kv('Salaire brut',eur(b))+kv('Salaire net',eur(apprentiNet(b)))+kv('Soit',Math.round(b/ST.cpi/SMIC*100)+' % du SMIC, '+ST.study.y+(ST.study.y===1?'re':'e')+' année')+kv('Après le diplôme','CDI possible · '+eur(d.sal*city().sal)+' net'); }
  else if (p==='etudiant'){ h+=kv('École',vtxt(d.school))+kv('Diplôme visé',d.dip)+kv('Année',ST.study.y+(ST.study.y===1?'re':'e')+' sur '+ST.study.d)+kv('Frais de scolarité',eur(d.fees*ST.cpi)+' / an')+kv('Financement',ST.fund==='parents'?'Tes parents':ST.fund==='job'?'Job étudiant':'Prêt de '+eur(ST.loanStu)+' + bourse')+kv('Débouché',gz(d.job)+' · ≈ '+eur(d.sal*city().sal)+' net'); }
  else if (p==='salarie'){ var j=ST.job, ps=payslip(); h+=kv('Employeur',esc(j.emp))+kv('Poste',gz(j.title))+kv('Contrat',j.cdd?'CDD de transition · jusqu’en '+(j.cdd-1):'Salarié·e')+kv('Salaire brut',eur(ps.brut))+kv('Salaire net',eur(j.net))+(j.comm?kv('Commissions','Selon le marché'):'')+(j.tips?kv('Pourboires','≈ '+eur(j.tips*ST.cpi)+' / mois'):''); }
  else if (p==='independant'){ var I=ST.indep; h+=kv('Statut','Micro-entreprise')+kv('Activité',gz(INDEP[I.k].n))+kv('Tarif',eur(I.tjm)+' la journée')+kv('Jours facturés','≈ '+I.days+' par an')+kv('Cotisations URSSAF',pc(I.urs)); }
  else if (p==='chef'){ var B=ST.biz; h+=kv('Société',esc(B.name))+kv('Secteur',d.sect)+kv('Statut',g('SASU · président','SASU · présidente'))+kv('Mise de départ',eur(d.mise))+kv('Trésorerie',eur(B.tre))+kv('Ton salaire',B.pay?eur(B.pay)+' / mois':'Aucun au départ'); }

function bindMake(id){
  var b=$('mk-back'); if (b) b.addEventListener('click',function(){ mk--; renderMake(); });
  var hm=$('mk-home'); if (hm) hm.addEventListener('click',renderTitle);
  var nx=$('mk-next');
  if (id==='qui'){
    document.querySelectorAll('[data-sx]').forEach(function(x){ x.addEventListener('click',function(){ var was=D.sexe; D.sexe=x.dataset.sx; if (PSEUDOS[was].indexOf(D.pseudo)>=0) D.pseudo=PSEUDOS[D.sexe][0]; renderMake(); }); });
    $('pseudo').addEventListener('input',function(e){ D.pseudo=e.target.value; });
    $('dice').addEventListener('click',function(){ var L=PSEUDOS[D.sexe]; D.pseudo=L[(L.indexOf(D.pseudo)+1)%L.length]; $('pseudo').value=D.pseudo; });
    nx.addEventListener('click',function(){ D.pseudo=(D.pseudo||'').trim(); if (!D.pseudo){ shake($('pseudo')); return; } mk++; renderMake(); }); }
  if (id==='ville') document.querySelectorAll('[data-city]').forEach(function(x){ x.addEventListener('click',function(){ D.city=x.dataset.city; mk++; renderMake(); }); });
  if (id==='domaine') document.querySelectorAll('[data-dom]').forEach(function(x){ x.addEventListener('click',function(){ D.dk=x.dataset.dom; D.loan=0; D.fund=''; var d=ddom(); D.put=d.mise?Math.min(2400,d.mise):0; D.honor=0; D.love=0; D.bank=0; if (d.mise>2400){ D.honor=Math.min(20000,Math.ceil((d.mise-2400)/500)*500); } mk++; renderMake(); }); });
  if (id==='maison') document.querySelectorAll('[data-home]').forEach(function(x){ x.addEventListener('click',function(){ D.home=x.dataset.home; mk++; renderMake(); }); });
  if (id==='argent'){ var r=$('loan');
    var upd=function(){ var d=ddom(); document.querySelectorAll('[data-fund]').forEach(function(x){ x.setAttribute('aria-pressed',String(x.dataset.fund===D.fund)); }); $('loanbox').hidden=D.fund!=='pret';
      $('f-info').textContent=D.fund==='parents'?'Ils paient tes frais de scolarité et te versent 500 € par mois. En échange, ils compteront sur toi : plus de décisions « famille ».':D.fund==='job'?'12 h par semaine en caisse : environ 650 € par mois. '+(d.fees>3000?'Attention : ça ne couvre pas '+eur(d.fees)+' de frais par an. Tes partiels en pâtiront aussi.':'Ça couvre tes frais, mais tes partiels en pâtiront un peu.'):D.fund==='pret'?'Ta bourse CROUS (échelon selon les revenus de tes parents) plus les versements du prêt chaque mois. Remboursement sur 10 ans après le diplôme, à 2,5 %.':'Choisis comment tu finances tes études.';
      D.loan=D.fund==='pret'?+r.value:0; rangeFill(r); $('loan-v').textContent=eur(D.loan);
      if (D.fund){ var o=ST; newGame(Object.assign({},D,{seed:1,home:D.home||'coloc'})); var rm=monthRest(); ST=o; $('f-rest').innerHTML=kv('Reste du mois estimé (en colocation)',sgn(rm),rm>=0?'up':'dn')+(rm<0?'<p class="note">Il te manquera '+eur(-rm)+' par mois : ta banque complétera par un prêt étudiant à 3 %, à rembourser après le diplôme.</p>':''); } else $('f-rest').innerHTML=''; $('loan-m').textContent=D.loan?'≈ '+eur(mensu(D.loan*1.05,.025,120))+' / mois pendant 10 ans':'—'; nx.disabled=!D.fund; };
    document.querySelectorAll('[data-fund]').forEach(function(x){ x.addEventListener('click',function(){ D.fund=x.dataset.fund; if (D.fund==='pret'&&!+r.value) r.value=Math.min(20000,Math.max(5000,Math.ceil(ddom().fees*ddom().d/1000)*1000)); upd(); }); });
    r.addEventListener('input',upd); upd(); nx.addEventListener('click',function(){ mk++; renderMake(); }); }
  if (id==='recap') hold($('go'),function(btn){ D.seed=(Date.now()^Math.floor(Math.random()*4294967296))>>>0; newGame(D); save(); bills(btn,10); setTimeout(function(){ go('home'); },RM?0:350); });
}

function hud(from){
  $('hud-av').innerHTML=avatar(ST.sexe,44); $('hud-name').textContent=ST.pseudo;
  $('hud-sub').textContent=ST.age+' ans · '+gz(profName())+' · '+ST.year;

  $('hn-inv').textContent=eur(placed()); $('hn-net').textContent=eur(net());
  var r=monthRest(); $('hn-rest').textContent=sgn(r)+'/mois'; $('hn-rest').className=r<0?'dn':'';

function evCard(){ var e=evById(ST.ev); if (!e) return '';
  if (e.bet){ return '<article class="card ev"><div class="ev-top"><span class="kick">'+e.kick+'</span><h3>'+evText(e.t)+'</h3><p>'+evText(e.p)+'</p></div><div class="pad sec" id="bet-box"></div><div class="ev-foot">Pris sur ton compte courant ('+eur(ST.cash)+'). L’argent misé devient un dossier en cours.</div></article>'; }

    ['a','b'].map(function(k){ var o=e[k]; return '<button data-vs="'+k+'"><span class="fill"></span><span class="e">'+o.e+'</span><b>'+evText(o.t)+'</b>'+chipsH(evText(o.fx).split(' · ').map(function(s){ return [s,/−/.test(s)?'r':/\+/.test(s)?'g':'']; }))+'</button>'; }).join('')+'<span class="x">VS</span></div><div class="ev-foot">Maintiens ton choix pour valider</div></article>'; }
function bindEv(){ var e=evById(ST.ev); if (!e) return;
  if (e.bet){ var A=amountCtl('bet',ST.cash,function(x){ A.zone(prudence(x)); var b=$('bet-ok'); if (b) b.lastChild.textContent=x>0?'Maintenir pour miser '+eur(x):'Maintenir pour ne rien miser'; });
    $('bet-box').innerHTML=A.html+'<button class="btn green" id="bet-ok"><span>Maintenir pour ne rien miser</span></button>'; A.bind();
    hold($('bet-ok'),function(btn){ var x=A.get(), old=ST.cash; var msg=chooseEvent(null,x); if (x>0) bills($('hn-cash'),6,btn); save(); hud(old); toast(esc(msg)); setTimeout(VIEWS.home,RM?0:500); }); return; }
  document.querySelectorAll('[data-vs]').forEach(function(btn){
    var tm=0; function go2(ev){ if (ev.cancelable) ev.preventDefault(); btn.classList.add('on'); clearTimeout(tm); tm=setTimeout(function(){ btn.classList.remove('on'); pick2(btn); },RM?120:520); }
    function stop(){ clearTimeout(tm); btn.classList.remove('on'); }
    btn.addEventListener('pointerdown',go2); ['pointerup','pointerleave','pointercancel'].forEach(function(v){ btn.addEventListener(v,stop); });
    btn.addEventListener('keydown',function(ev){ if ((ev.key==='Enter'||ev.key===' ')&&!ev.repeat) go2(ev); }); btn.addEventListener('keyup',function(ev){ if (ev.key==='Enter'||ev.key===' ') stop(); });
    btn.addEventListener('contextmenu',function(ev){ ev.preventDefault(); }); });
  function pick2(btn){ if (!ST.ev) return; var old=ST.cash, msg=chooseEvent(btn.dataset.vs); burst(btn,['✨','⭐'],8); if (ST.cash>old) bills(btn,6,$('hn-cash')); toast(esc(msg),'good'); save(); hud(old); setTimeout(VIEWS.home,RM?0:700); } }

    A.bind(); A.zone(''); $('cw-no').addEventListener('click',S.close); hold($('cw-ok'),function(btn){ var old=ST.cash; if (!crowdIn(o.i,A.get())) return; bills($('hn-cash'),6,btn); S.close(); done('🤝 Tu détiens des parts de '+o.n+'. Dénouement en '+(ST.year+o.dur)+'.','good',old); }); }); });
  document.querySelectorAll('[data-br]').forEach(function(b){ b.addEventListener('click',function(){ bridgeSheet(b.dataset.br); }); }); }
function confirmSheet(title,html,label,fn,color,disabled){ var S=sheet(title,'<h3>'+esc(title)+'</h3><div class="note" style="font-size:14px">'+html+'</div>','<button class="btn '+(color||'green')+'" id="cf-ok"'+(disabled?' disabled':'')+'><span>'+label+'</span></button><button class="btn ghost" id="cf-no"><span>Annuler</span></button>');
  $('cf-no').addEventListener('click',S.close); hold($('cf-ok'),function(btn){ S.close(); fn(btn); }); return S; }
function bridgeSheet(to){
  if (to==='indep'){ var L=indepChoices(); var S=sheet('À mon compte','<h3>Me mettre à mon compte</h3><p class="note">Micro-entreprise : pas de chômage, des trous d’activité, mais tu fixes ton tarif.</p><div class="sec">'+L.map(function(k){ var I=INDEP[k]; return '<button class="opt" data-ind="'+k+'"><span class="e">'+({dev:'💻',coach:'🏋️',artisan:'🔧',inf:'🩺',avocat:'⚖️'}[k]||'💼')+'</span><span><b>'+gz(I.n)+'</b><small>≈ '+eur(I.tjm*ST.cpi)+' la journée, '+I.days+' jours par an, URSSAF '+pc(I.urs)+'</small></span></button>'; }).join('')+'</div>','<button class="btn ghost" id="in-no"><span>Annuler</span></button>');
    $('in-no').addEventListener('click',S.close); S.el.querySelectorAll('[data-ind]').forEach(function(b){ b.addEventListener('click',function(){ var r=bridgeIndep(b.dataset.ind); S.close(); done('💻 À ton compte'+(r.ind?' · '+eur(r.ind)+' d’indemnité':'')+'.'); }); }); return; }
  if (to==='boite'){ var S2=sheet('Créer ma boîte','<h3>Créer ma boîte</h3><p class="note">Ta mise vient de ton compte courant ('+eur(ST.cash)+') et d’un prêt d’honneur à 0 % si besoin. '+(BRIDGE[ST.dk]?'Ton expérience compte dans : '+domOf('boite',BRIDGE[ST.dk]).n.toLowerCase()+' (risque −30 %, clients dès le départ).':'')+'</p><div class="sec">'+DOMS.boite.map(function(d){ var need=Math.max(0,d.mise*ST.cpi-ST.cash), ok=need<=20000; return '<button class="opt" data-nb="'+d.k+'"'+(ok?'':' disabled style="opacity:.5"')+'><span class="e">'+d.e+'</span><span><b>'+d.n+(BRIDGE[ST.dk]===d.k?' · ton domaine':'')+'</b><small>Mise '+eur(d.mise*ST.cpi)+(need>0?' · prêt d’honneur de '+eur(Math.ceil(need/500)*500):'')+'</small></span></button>'; }).join('')+'</div>','<button class="btn ghost" id="nb-no"><span>Annuler</span></button>');
    $('nb-no').addEventListener('click',S2.close); S2.el.querySelectorAll('[data-nb]').forEach(function(b){ b.addEventListener('click',function(){ var d=domOf('boite',b.dataset.nb), m=d.mise*ST.cpi, put=Math.min(ST.cash,m), hon=Math.ceil(Math.max(0,m-put)/500)*500; var old=ST.cash; var r=bridgeBiz(d.k,put,hon); S2.close(); if (!r){ toast('Impossible de réunir la mise.','bad'); return; } done('🚀 C’est parti'+(r.ind?' · '+eur(r.ind)+' d’indemnité':'')+'.','good',old); }); }); }
}

/* ===== UI : récap avant clôture ===== */
$('next').addEventListener('click',function(){ if (!ST||ST.over) return;
  if (ST.ev){ shake($('next')); if (cur!=='home') go('home'); toast('Décide d’abord : '+esc(evText(evById(ST.ev).t)),'bad'); return; }
  preRecap(); });
function recapPro(){ var p=ST.prof, B=budget(), w=sum(B.W,function(x){return x.a;}), h='';
  if (p==='etudiant'||p==='apprenti') h+=kv(p==='apprenti'?'Apprentissage':'Études',ST.study.y+(ST.study.y===1?'re':'e')+' année sur '+ST.study.d)+kv('Ressources du mois',eur(w));
  else if (p==='salarie') h+=kv('Salaire net',eur(ST.job.net)+' / mois')+kv('Employeur',esc(ST.job.emp),'w')+kv('Fin du CDD',ST.job.cdd?String(ST.job.cdd-1):'—');
  else if (p==='chef'){ var hb=ST.biz.hist[ST.biz.hist.length-1]; h+=kv('Trésorerie de '+esc(ST.biz.name),eur(ST.biz.tre))+kv('Résultat net l’an dernier',hb?sgn(hb.net):'Première année')+kv('Ton salaire',eur(ST.biz.pay)+' / mois')+kv('Dividendes reçus cette année',eur(ST.yr.div)); }
  else if (p==='independant') h+=kv('Chiffre d’affaires prévu',eur(ST.indep.tjm*ST.indep.days))+kv('Revenu net du mois',eur(w));
  else if (p==='chomage') h+=kv('Allocation',eur(w)+' / mois');
  return h; }
function recapPat(){ return kv('💳 Compte courant',eur(ST.cash))+kv('🐷 Livret A',eur(ST.livret))+(ST.env.pea.open?kv('🇫🇷 PEA',eur(envVal('pea'))):'')+(envVal('cto')?kv('🌍 Compte-titres',eur(envVal('cto'))):'')+(ST.env.av.open?kv('🛡️ Assurance vie',eur(envVal('av'))):'')+(envVal('pee')?kv('🏢 PEE',eur(envVal('pee'))):'')+
  (ST.props.length?kv('🏢 Immobilier (valeur)',eur(propVal()))+kv('🏦 Crédit immobilier',eur(-propDebt())):'')+(debtTot()?kv('🏦 Autres dettes',eur(-debtTot())):'')+(ST.biz?kv('🚀 Part de ta société',eur(bizVal())):'')+(ST.doss.length?kv('📁 Mises en cours',eur(dossVal())):'')+
  '<div class="kv tot"><span>Patrimoine total</span><b style="color:var(--gold)">'+eur(net())+'</b></div>'+kv('Investi cette année',eur(ST.yr.inv))+kv('Retiré',eur(ST.yr.out))+kv('Impôts payés sur tes ventes',eur(ST.yr.tax)); }
function recapPerso(){ return kv('Décision',esc(ST.yr.ev||'—'),'w')+kv('Couple',ST.couple===null?'Célibataire':ST.partner+' · '+ST.couple+' / 100')+kv('Enfants',ST.kids||'Aucun')+kv('Shopping',eur(ST.yr.shop))+kv('Casino',sgn(ST.yr.casino),ST.yr.casino>=0?'up':'dn'); }
function preRecap(){ var B=budget(), mn=B.rest;
  var S=sheet('Clôturer '+ST.year,'<span class="lab">Avant de valider</span><h3>Ton année '+ST.year+'</h3>'+
    '<div class="card pad"><div class="blk-h"><b>💼 Vie pro</b></div>'+recapPro()+'</div>'+
    '<div class="card dark pad"><div class="blk-h"><b>🏛️ Patrimoine</b></div>'+recapPat()+'</div>'+
    '<div class="card pad"><div class="blk-h"><b>❤️ Vie perso</b></div>'+recapPerso()+'</div>'+
    '<div class="card pad"><span class="lab">D’ici le 31 décembre</span>'+kv('Revenus (12 mois)',sgn(B.tin*12),'up')+kv('Dépenses (12 mois)',eur(-B.tout*12),'dn')+kv('Épargne qui arrivera sur ton compte',sgn(mn*12),mn>=0?'up':'dn')+'<p class="note" style="margin-top:6px">Les marchés, ton immobilier et ta carrière bougeront à la clôture.</p></div>'+
    (ST.doss.length?'<div class="card list">'+ST.doss.map(function(D2){return '<div class="doss"><span class="e">'+(D2.e||'📁')+'</span><span class="n">'+esc(evText(D2.t))+'<small>Dénouement en '+D2.due+'</small></span></div>';}).join('')+'</div>':''),
    '<button class="btn gold" id="pr-ok"><span>Maintenir pour clôturer '+ST.year+'</span></button><button class="btn ghost" id="pr-no"><span>Revenir gérer mon année</span></button>');
  $('pr-no').addEventListener('click',S.close);
  hold($('pr-ok'),function(){ S.close(); var lv=lvl(), rep=closeYear(); var hi=+(store(KEY+'-hi')||0), rn=Math.round(real(net())); if (rn>hi) store(KEY+'-hi',String(rn)); save(); showBilan(rep,lv); }); }

/* ===== UI : bilan animé ===== */
function dl(a,b,lab){ var d=b-a; return '<div class="kv"><span>'+lab+'</span><b>'+eur(b)+(Math.round(d)?' <small class="'+(d>=0?'up':'dn')+'" style="font-size:12px">'+sgn(d)+'</small>':'')+'</b></div>'; }
function showBilan(o,lvB){ screen('scr-end'); var gain=o.delta>=0, A=o.S0, Z=o.S1;
  var pro='';
  if (A.title!==Z.title) pro+=kv('Avant',esc(gz(A.title)),'w')+kv('Maintenant',esc(gz(Z.title)),'w');
  else pro+=kv('Situation',esc(gz(Z.title)),'w');
  pro+=dl(A.work,Z.work,'Revenus du travail par mois');
  if (Z.bizRes!==null&&Z.bizRes!==undefined) pro+=kv('Résultat net de ta société',sgn(Z.bizRes),Z.bizRes>=0?'up':'dn');
  var pat=dl(A.cash,Z.cash,'💳 Compte courant')+dl(A.livret,Z.livret,'🐷 Livret A')+(A.pea||Z.pea?dl(A.pea,Z.pea,'🇫🇷 PEA'):'')+(A.cto||Z.cto?dl(A.cto,Z.cto,'🌍 Compte-titres'):'')+(A.av||Z.av?dl(A.av,Z.av,'🛡️ Assurance vie'):'')+(A.pee||Z.pee?dl(A.pee,Z.pee,'🏢 PEE'):'')+
    (A.immo||Z.immo?dl(A.immo-A.immoDebt,Z.immo-Z.immoDebt,'🏢 Immobilier net'):'')+(A.debts||Z.debts?dl(-A.debts,-Z.debts,'🏦 Dettes'):'')+(A.biz||Z.biz?dl(A.biz,Z.biz,'🚀 Ta société'):'')+(A.doss||Z.doss?dl(A.doss,Z.doss,'📁 Mises en cours'):'')+
    '<div class="kv tot"><span>Patrimoine</span><b style="color:var(--gold)">'+eur(Z.net)+'</b></div>'+kv('En euros de 2026',eur(real(Z.net)));
  var per=kv('Décision',esc(o.yr.ev||'—'),'w')+kv('Humeur',A.hum+' → '+Z.hum)+(Z.couple!==null||A.couple!==null?kv('Couple',(A.couple===null?'—':A.couple)+' → '+(Z.couple===null?'célibataire':Z.couple)):'')+(Z.kids!==A.kids?kv('Enfants',A.kids+' → '+Z.kids):'')+(o.yr.shop?kv('Shopping',eur(-o.yr.shop)):'')+(o.yr.casino?kv('Casino',sgn(o.yr.casino),o.yr.casino>=0?'up':'dn'):'');
  var why=[['👛 Épargne de l’année',o.saved],['📈 Placements et Livret A',o.inv],['🏢 Immobilier (valeur − crédit)',o.prop],['🚀 Société',o.biz],['🎲 Décisions, dossiers et dettes',o.other]].filter(function(x){return Math.round(x[1]);});
  var h='<span class="lab d">Bilan de l’année '+o.y+' · '+esc(ST.pseudo)+', '+(ST.age-1)+' ans</span><div class="end-vis" id="end-vis"></div><div class="delta" id="end-d" style="color:'+(gain?'var(--up-d)':'var(--dn-d)')+'">0 €</div><p style="margin:0;text-align:center;color:var(--muted-d)">Inflation '+pc(o.infl,1)+' · actions mondiales '+pct(o.m,0)+'</p>'+
    (o.news.length?'<div class="news">'+o.news.map(function(n){return '<span>'+esc(gz(n))+'</span>';}).join('')+'</div>':'')+
    '<div class="card pad"><div class="blk-h"><b>Ce qui a fait bouger ton patrimoine</b></div>'+why.map(function(x){return kv(x[0],sgn(x[1]),x[1]>=0?'up':'dn');}).join('')+'</div>'+
    '<div class="card pad"><div class="blk-h"><b>💼 Vie pro</b></div>'+pro+'</div><div class="card pad"><div class="blk-h"><b>🏛️ Patrimoine</b></div>'+pat+'</div><div class="card pad"><div class="blk-h"><b>❤️ Vie perso</b></div>'+per+'</div>'+
    '<button class="btn gold" id="end-go" style="margin-top:auto"><span>'+(ST.over?'Voir la fin de partie':'Commencer '+ST.year)+'</span></button>';
  $('end').innerHTML=h; $('end').parentNode.scrollTop=0;
  if (gain){ $('end-vis').innerHTML='<div style="font-size:80px;line-height:1;'+(RM?'':'animation:pop .5s cubic-bezier(.2,1.6,.4,1)')+'">💰</div>'; countTo($('end-d'),0,o.delta,1100,sgn); for (var i=0;i<3;i++) setTimeout(function(){ bills($('end-vis'),12); },i*220); }
  else { $('end-vis').innerHTML='<svg width="90" height="108" viewBox="0 0 150 170" aria-hidden="true" style="'+(RM?'':'animation:slam .45s cubic-bezier(.5,0,.6,1.4)')+'"><path d="M50 6h50v92h38L75 164 12 98h38z" fill="#C8102E"/></svg>'; countTo($('end-d'),0,o.delta,900,sgn); setTimeout(function(){ shake(app); },RM?0:420); }
  if (lvl()>lvB) setTimeout(function(){ toast('⬆️ <b>Niveau '+lvl()+'</b> · '+gz(LVT[Math.min(LVT.length-1,lvl()-1)])); },900);
  $('end-go').addEventListener('click',function(){ if (ST.over) endGame(); else go('home'); }); $('end-go').focus({preventScroll:true}); }
function endGame(){ screen('scr-end'); var n=net(), nr=real(n), rk=rankOf(nr), hum=ST.humH.length?Math.round(sum(ST.humH)/ST.humH.length):ST.hum;
  $('end').innerHTML='<span class="lab d">Fin de partie · '+ST.year+' · '+esc(ST.pseudo)+'</span><div style="font-size:80px;text-align:center;line-height:1.1">'+rk[0]+'</div><h2 class="H" style="margin:0;text-align:center;font-size:30px">'+gz(rk[1])+'</h2><div class="delta" id="fin" style="color:var(--gold)">0 €</div><p style="margin:0;text-align:center;color:var(--muted-d)">soit '+eur(nr)+' en euros de 2026</p>'+
    '<div class="card pad">'+kv('Âge',ST.age+' ans')+kv('Pension',eur(ST.pension||0)+' / mois')+kv('Niveau',lvl())+kv('Succès',Object.keys(ST.ach).length+' / '+ACH.length)+kv('Bien-être moyen',hum+' / 100')+kv('Record',eur(Math.max(nr,+(store(KEY+'-hi')||0)))+' (euros 2026)')+'</div>'+
    '<button class="btn gold" id="replay" style="margin-top:auto"><span>Rejouer</span></button>';
  countTo($('fin'),0,n,1600); bills($('fin'),16);
  $('replay').addEventListener('click',function(){ store(KEY,null); renderTitle(); }); }

/* ===== UI : conseils « ! » ===== */
var tipI=0;
function tipRefresh(){ var L=tipsFor(cur); $('tip-n').textContent=L.length; $('tip').hidden=!L.length; $('tip').dataset.seen=ST.seenTips[cur+ST.year]?'1':'0'; var o=$('bubble'); if (o) o.remove(); tipI=0; }
$('tip').addEventListener('click',function(){ var o=$('bubble'); if (o){ o.remove(); return; } var L=tipsFor(cur); if (!L.length) return; ST.seenTips[cur+ST.year]=1; $('tip').dataset.seen='1'; save();
  var b=document.createElement('div'); b.className='bubble'; b.id='bubble'; b.setAttribute('role','dialog'); b.setAttribute('aria-label','Conseil');
  function draw(){ var t=L[tipI]; b.innerHTML='<h4>'+t[0]+'</h4><p>'+t[1]+'</p><div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">'+(tipI+1)+' / '+L.length+'</span><button class="btn sm" id="tip-n2"><span>'+(tipI<L.length-1?'Suivant':'Compris')+'</span></button></div>'; $('tip-n2').addEventListener('click',function(){ if (tipI<L.length-1){ tipI++; draw(); } else { b.remove(); tipI=0; } }); }
  $('scr-hub').appendChild(b); draw(); });

/* ===== UI : code secret ===== */
function cheat(){ if (!ST||!ST.prof) return; if (ST.konami){ toast('👾 Code déjà utilisé.'); return; } ST.konami=true; var old=ST.cash; cash(1000,'autre'); unlock('konami'); save(); hud(old); bills($('hud-av'),12,$('hn-cash')); toast('👾 <b>Code secret</b> · +1 000 €'); }
var KS=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'],kp=0;
document.addEventListener('keydown',function(e){ if ($('scr-hub').hidden) return; var k=e.key.length===1?e.key.toLowerCase():e.key; kp=k===KS[kp]?kp+1:(k===KS[0]?1:0); if (kp===KS.length){ kp=0; cheat(); } });
var taps=0,tapT=0; $('hud-av').addEventListener('click',function(){ var n=Date.now(); taps=n-tapT<700?taps+1:1; tapT=n; if (taps>=7){ taps=0; cheat(); } });

renderTitle();
})();
</script>
