<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>La Corbeille</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --navy:#0B1E3B;--navy2:#13294B;--navy3:#1D3A63;--line-d:#2A4570;
  --bg:#F2F4F8;--card:#FFFFFF;--line:#DCE2EC;--ink:#0E1726;--muted:#5B6B82;--muted-d:#A9B8CF;
  --red:#C8102E;--red-l:#FBE7EA;--gold:#C9A227;--gold-l:#FBF4DC;--green:#1F8A5B;--green-l:#E3F3EA;--blue-l:#E6EEF9;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app{width:100%;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.H{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;letter-spacing:-.01em}
.M{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dark .lab,.lab.d{color:var(--muted-d)}
.up{color:var(--green)}.dn{color:var(--red)}
.dark .up{color:#4FD18F}.dark .dn{color:#FF6B7F}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* boutons */
.btn{border:0;border-radius:12px;min-height:50px;padding:0 18px;font:700 16px 'Public Sans',sans-serif;cursor:pointer;background:var(--navy);color:#fff;transition:transform .08s,filter .15s;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.btn:active{transform:scale(.98)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.dark .btn.ghost{color:#fff;border-color:var(--line-d)}
.btn[disabled]{opacity:.4;cursor:default}
.btn .fill{position:absolute;inset:0;background:rgba(255,255,255,.28);transform:scaleX(0);transform-origin:left;pointer-events:none}
.btn.on .fill{transform:scaleX(1);transition:transform .5s linear}
.btn span{position:relative}
.link{background:none;border:0;color:var(--navy);font:600 14px 'Public Sans',sans-serif;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 6px}
.dark .link{color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--blue-l);color:var(--navy);white-space:nowrap}
.chip.g{background:var(--green-l);color:var(--green)}.chip.r{background:var(--red-l);color:var(--red)}.chip.o{background:var(--gold-l);color:#7A5F0A}

/* cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(11,30,59,.05)}
.card.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.pad{padding:14px 16px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:20px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.dark .kv{border-color:var(--line-d)}
.kv:last-child{border-bottom:0}
.kv b{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap}
.kv span{color:var(--muted)}
.dark .kv span{color:var(--muted-d)}
.big{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:85%;font-size:38px;line-height:1;letter-spacing:-.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* titre */
.title{position:relative;height:100%;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-block:24px}
.title .logo{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:80%;font-size:clamp(46px,13vw,84px);line-height:.95;letter-spacing:-.02em}
.title .logo i{font-style:normal;color:var(--gold)}
.title .rule{width:56px;height:3px;background:var(--red)}
.title p{margin:0;color:var(--muted-d);font-size:16px;max-width:34ch;line-height:1.45}
.title .btn{min-width:240px}

/* HUD */
.hud{background:var(--navy);color:#fff;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
.hud-top{display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none;border:0;padding:0;cursor:pointer;background:var(--navy3)}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who b{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12.5px;color:var(--muted-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);background:var(--gold);border-radius:6px;padding:2px 6px;font-weight:600}
.next{border:0;border-radius:12px;background:var(--green);color:#fff;font:700 14px 'Public Sans',sans-serif;min-height:44px;padding:0 12px;cursor:pointer;white-space:nowrap}
.next.wait{background:var(--navy3);color:var(--muted-d)}
.hud-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hn{background:var(--navy2);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.hn small{font-size:10.5px;color:var(--muted-d);font-weight:600;letter-spacing:.04em;white-space:nowrap}
.hn b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;gap:8px}
.meter{flex:1;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted-d);min-width:0}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--navy3);overflow:hidden;min-width:30px}
.meter i b{display:block;height:100%;border-radius:3px;transition:width .5s}
.meter em{font-style:normal;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px}

.body{flex:1;min-height:0;overflow-y:auto;padding-block:14px 90px;display:flex;flex-direction:column;gap:18px}
.nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font:600 10.5px 'Public Sans',sans-serif;color:var(--muted);cursor:pointer;min-height:54px;border-radius:10px;padding:0;position:relative}
.nav button .e{font-size:21px;line-height:1.3}
.nav button[aria-current="page"]{color:var(--navy);background:var(--blue-l)}
.nav button .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:4px;background:var(--red)}

/* événement */
.ev{overflow:hidden}
.ev-top{background:var(--navy);color:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ev-top .kick{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.1em;background:var(--red);color:#fff;border-radius:4px;padding:3px 7px}
.ev-top h3{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:21px;line-height:1.15}
.ev-top p{margin:0;color:var(--muted-d);font-size:14.5px;line-height:1.45}
.vs{display:grid;grid-template-columns:1fr 1fr;position:relative}
.vs button{border:0;background:#fff;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;min-height:140px;font-family:inherit;color:var(--ink);transition:background .15s;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;overflow:hidden}
.vs button+button{border-left:1px solid var(--line)}
.vs button .e{font-size:34px;line-height:1.15}
.vs button b{font-size:15.5px;line-height:1.2}
.vs button small{font-size:12.5px;color:var(--muted);line-height:1.3}
.vs button.on{background:var(--gold-l)}
.vs button .fill{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left}
.vs button.on .fill{transform:scaleX(1);transition:transform .5s linear}
.vs .x{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:18px;background:var(--navy);color:var(--gold);font:800 12px 'Archivo',sans-serif;display:flex;align-items:center;justify-content:center;border:3px solid #fff;pointer-events:none}
.ev-foot{padding:8px 16px 12px;font-size:12.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
.done{display:flex;gap:10px;align-items:flex-start}
.done .e{font-size:22px}

/* sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--navy) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--navy)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:14px;background:#fff;border:3px solid var(--navy);margin-top:-10px;box-shadow:0 2px 6px rgba(11,30,59,.25)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:14px;background:#fff;border:3px solid var(--navy)}
.amount{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* listes */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;width:100%;text-align:left;font-family:inherit;color:var(--ink);border-left:0;border-right:0;border-top:0;cursor:pointer;min-height:60px}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.row .n{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .n b{font-size:15px;font-weight:700}
.row .n small{font-size:12.5px;color:var(--muted);line-height:1.3}
.row .v{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.row .v b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14.5px}
.row .v small{font-size:12px;font-weight:600}
.list{overflow:hidden;padding:0}
.env-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--navy);color:#fff}
.env-h .n{flex:1;display:flex;flex-direction:column}
.env-h .n b{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:17px}
.env-h .n small{font-size:12px;color:var(--muted-d)}
.env-h .t{font-family:'IBM Plex Mono',monospace;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;min-height:40px;font:600 14px 'Public Sans',sans-serif;color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--line)}
.alloc i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* immo */
.prop{overflow:hidden;padding:0}
.prop-h{display:flex;gap:12px;padding:14px;align-items:flex-start}
.prop-h .ph{width:64px;height:64px;border-radius:10px;background:var(--navy2);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-size:26px;line-height:1}
.prop-h .ph small{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted-d);margin-top:4px}
.prop-h .n{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prop-h .n b{font-size:16px;font-weight:700;line-height:1.2}
.prop-h .n small{font-size:13px;color:var(--muted)}
.prop-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.prop-k div{padding:9px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0}
.prop-k div:last-child{border-right:0}
.prop-k small{font-size:11px;color:var(--muted);font-weight:600}
.prop-k b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13.5px;white-space:nowrap}
.prop-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);font-size:13px}
.dpe{display:inline-flex;width:22px;height:22px;border-radius:4px;color:#fff;font-weight:800;font-size:12px;align-items:center;justify-content:center}

/* ticket */
.ticket{background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;padding:18px 18px 22px;position:relative;font-family:'IBM Plex Mono',monospace}
.ticket::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-12px;height:12px;background:linear-gradient(-45deg,transparent 7px,#fff 0) 0 0/14px 12px repeat-x,linear-gradient(45deg,transparent 7px,#fff 0) 0 0/14px 12px repeat-x}
.ticket h3{margin:0;text-align:center;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:85%;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.ticket .d{text-align:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.ticket .grp{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin:10px 0 2px}
.ticket .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.ticket .ln small{display:block;font-family:'Public Sans',sans-serif;font-size:11.5px;color:var(--muted)}
.ticket .tot{display:flex;justify-content:space-between;font-size:17px;padding-top:10px;font-weight:600}

/* shop */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{border:1px solid var(--line);background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;cursor:pointer;font:600 12px 'Public Sans',sans-serif;color:var(--ink);min-height:64px}
.cat .e{font-size:24px}
.cat[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);border-left:0;border-right:0;border-top:0}
.item:last-child{border-bottom:0}
.item .e{font-size:30px;width:44px;text-align:center;flex:none}
.item .n{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.item .n b{font-size:15px}.item .n small{font-size:12.5px;color:var(--muted)}
.item .p{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;white-space:nowrap}
.item.own{background:var(--green-l)}
.slot{display:flex;justify-content:center;gap:8px;padding:14px;background:var(--navy);border-radius:12px}
.slot span{width:64px;height:72px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:38px}
.wheel{width:120px;height:120px;border-radius:60px;margin:0 auto;border:6px solid var(--gold);display:flex;align-items:center;justify-content:center;font:800 40px 'Archivo',sans-serif;color:#fff;background:var(--navy)}

/* création */
.make{height:100%;overflow-y:auto;width:100%;max-width:600px;margin:0 auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.steps{display:flex;align-items:center;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--navy)}
.back{border:1.5px solid var(--line);background:#fff;border-radius:10px;width:44px;height:44px;font-size:18px;cursor:pointer;flex:none;color:var(--ink)}
.make h1{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:85%;font-size:30px;line-height:1.08;text-wrap:balance}
.make .sub{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:14px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;width:100%;font-family:inherit;color:var(--ink)}
.opt:hover{border-color:var(--navy)}
.opt .e{font-size:30px;width:48px;height:48px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.opt b{font-size:16.5px;display:block}
.opt small{font-size:13.5px;color:var(--muted);display:block;line-height:1.35;margin-top:2px}
.opt .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.opt[aria-pressed="true"]{border:2px solid var(--navy);background:var(--blue-l)}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;height:54px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:700 19px 'Public Sans',sans-serif;color:var(--ink);background:#fff}
.dice{width:54px;height:54px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:24px;cursor:pointer;flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:44px;padding:0 12px;font:600 14px 'Public Sans',sans-serif;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* bilan */
.end{height:100%;overflow-y:auto;background:var(--navy);color:#fff}
.end-in{max-width:600px;margin:0 auto;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.end-in .card{background:var(--navy2);border-color:var(--line-d);color:#fff;box-shadow:none}
.end-vis{height:120px;display:flex;align-items:center;justify-content:center}
.delta{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:80%;font-size:58px;line-height:1;text-align:center;letter-spacing:-.02em}
.news span{display:block;padding:8px 12px;border-radius:10px;background:var(--navy3);font-size:14px;line-height:1.4}
.news{display:flex;flex-direction:column;gap:6px}

/* overlays */
.veil{position:absolute;inset:0;z-index:20;background:rgba(11,30,59,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .28s cubic-bezier(.2,1,.3,1)}
.sheet h3{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:88%;font-size:22px}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.toast{position:absolute;left:16px;right:16px;max-width:520px;margin:0 auto;top:calc(16px + env(safe-area-inset-top,0px));z-index:30;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;font-size:14.5px;line-height:1.4;box-shadow:0 8px 24px rgba(11,30,59,.3);animation:pop .3s;border-left:4px solid var(--gold)}
.toast.bad{border-left-color:var(--red)}.toast.good{border-left-color:#4FD18F}

function expenses(){

  else L.push(['Charges et taxe foncière',180,'Ta résidence principale']);

  ST.props.forEach(function(p){ if (p.left>0) L.push(['Crédit immobilier · '+p.t,p.mens,'Capital restant '+eur(p.left)]); });

}

  var nx=$('mk-next');
  if (id==='qui'){
    document.querySelectorAll('[data-sx]').forEach(function(x){ x.addEventListener('click',function(){ var was=ST.sexe; ST.sexe=x.dataset.sx; if (PSEUDOS[was].indexOf(ST.pseudo)>=0) ST.pseudo=PSEUDOS[ST.sexe][0]; renderMake(); }); });
    $('pseudo').addEventListener('input',function(e){ ST.pseudo=e.target.value; });
    $('dice').addEventListener('click',function(){ var L=PSEUDOS[ST.sexe]; ST.pseudo=L[(L.indexOf(ST.pseudo)+1)%L.length]; $('pseudo').value=ST.pseudo; });
    nx.addEventListener('click',function(){ ST.pseudo=(ST.pseudo||'').trim(); if (!ST.pseudo){ shake($('pseudo')); return; } mk++; renderMake(); });
  }
  if (id==='chemin') document.querySelectorAll('[data-path]').forEach(function(x){ x.addEventListener('click',function(){ if (ST.path!==x.dataset.path){ ST.fund=''; ST.loan=0; ST.domI=-1; } ST.path=x.dataset.path; mk++; renderMake(); }); });

  if (id==='maison') document.querySelectorAll('[data-home]').forEach(function(x){ x.addEventListener('click',function(){ ST.homeI=+x.dataset.home; mk++; renderMake(); }); });
  if (id==='argent'&&ST.path==='etudes'){
    var r=$('loan');
    var upd=function(){ var d=dom(); document.querySelectorAll('[data-fund]').forEach(function(x){ x.setAttribute('aria-pressed',String(x.dataset.fund===ST.fund)); }); $('loanbox').hidden=ST.fund!=='pret';
      $('f-info').textContent=ST.fund==='parents'?'Ils paient tes frais de scolarité et te versent 500 € par mois. En échange, tu leur dois des coups de main.':ST.fund==='job'?'12 h par semaine en caisse : environ 650 € par mois. '+(d.fees>3000?'Attention : ça ne couvre pas '+eur(d.fees)+' de frais par an.':'Ça couvre tes frais.'):ST.fund==='pret'?'Bourse CROUS + versements du prêt chaque mois. Remboursement sur 10 ans après le diplôme.':'Choisis comment tu finances tes études.';
      ST.loan=ST.fund==='pret'?+r.value:0; rangeFill(r); $('loan-v').textContent=eur(ST.loan); $('loan-m').textContent=ST.loan?eur(mensu(ST.loan,.0045,120))+' / mois':'—'; nx.disabled=!ST.fund||(ST.fund==='pret'&&!ST.loan); };
    document.querySelectorAll('[data-fund]').forEach(function(x){ x.addEventListener('click',function(){ ST.fund=x.dataset.fund; if (ST.fund==='pret'&&!+r.value) r.value=Math.min(20000,Math.max(5000,Math.ceil(dom().fees*dom().d/1000)*1000)); upd(); }); });
    r.addEventListener('input',upd); upd(); nx.addEventListener('click',function(){ mk++; renderMake(); });
  }
  if (id==='argent'&&ST.path==='boite'){
    var r2=$('loan');
    var upd2=function(){ var d=dom(); ST.loan=+r2.value; rangeFill(r2); $('loan-v').textContent=eur(ST.loan); var have=2400+ST.loan, ok=have>=d.mise; $('mise-t').textContent=ok?'Mise réunie':'Il manque'; $('mise-b').textContent=ok?'✓':eur(d.mise-have); $('mise-b').className=ok?'up':'dn'; nx.disabled=!ok; };

    $('bdice').addEventListener('click',function(){ ST.biz=BIZN[(BIZN.indexOf(ST.biz)+1)%BIZN.length]; $('biz').value=ST.biz; });
    nx.addEventListener('click',function(){ ST.biz=(ST.biz||'').trim(); if (!ST.biz){ shake($('biz')); return; } mk++; renderMake(); });
  }
  if (id==='recap') $('go').addEventListener('click',function(e){ startGame(); bills(e.currentTarget,10); setTimeout(function(){ go('home'); },RM?0:400); });
}
function startGame(){
  var d=dom();
  ST.cash=1900; ST.livret=500;
  if (ST.path==='travail'){ ST.salaire=d.sal; ST.job=d.job; ST.emp=d.emp; }
  if (ST.path==='etudes'){ ST.studyD=d.d; ST.studyY=1; ST.emp=d.alt?d.emp:d.school; if (ST.fund==='pret') ST.stuLeft=ST.loan; }
  if (ST.path==='boite'){ var used=Math.max(0,d.mise-ST.loan); ST.cash=Math.max(0,2400-used); ST.livret=0; ST.treso=Math.round(d.mise*.6); ST.bizPay=1100; ST.stuLeft=ST.loan; ST.stuMens=ST.loan?Math.round(ST.loan/60):0; ST.ach.boss=2026; }
  ST.hum=clamp(70+(home().k==='coloc'?5:home().k==='parents'?-8:0),0,100);
  ST.hist=[{y:2025,n:Math.round(net())}];
  ST.log=[{y:2026,txt:'Début : '+(ST.path==='etudes'?gz(d.n):ST.path==='travail'?gz(d.job)+' chez '+d.emp:ST.biz)}];
  ST.ev=pickEvent(); save();
}

function bindEv(){
  var e=evById(ST.ev); if (!e) return;
  if (e.bet){
    var r=$('bet-r'); var upd=function(){ var x=+r.value, p=x/Math.max(1,net()); rangeFill(r); $('bet-v').textContent=eur(x); var z=x<=0?['Rien','']:p<.05?['Prudent','g']:p<.15?['Mesuré','o']:['Risqué','r']; $('bet-z').innerHTML='<span class="chip '+z[1]+'">'+z[0]+'</span>'; $('bet-ok').lastChild.textContent=x>0?'Maintenir pour miser '+eur(x):'Maintenir pour ne rien miser'; };
    r.addEventListener('input',upd); upd();
    hold($('bet-ok'),function(btn){ var x=+r.value, old=ST.cash; ST.ev=null; if (x>0){ cash(-x); ST.bets.push({lab:e.t,amt:x,o:e.o,ach:e.ach||''}); bills($('hn-cash'),6,btn); ST.evDone='Tu as misé '+eur(x)+' · '+evText(e.t); } else ST.evDone='Tu n\'as rien misé · '+evText(e.t); ST.log.push({y:ST.year,txt:ST.evDone,ev:e.id}); ST.xp+=10; save(); hud(old); toast(esc(ST.evDone)); setTimeout(rHome,RM?0:500); });
    return;

    var tm=0; function go2(ev){ if (btn.disabled) return; ev.preventDefault(); btn.classList.add('on'); tm=setTimeout(function(){ btn.classList.remove('on'); pick(btn); },RM?120:520); }

    if (ST.studyY>=ST.studyD){ ST.path='travail'; ST.salaire=Math.round(d.sal*(1+(ST.rep-50)/400)/10)*10; ST.job=d.job; ST.emp=d.emp+(d.city?', '+d.city:''); if (ST.fund==='pret'&&ST.stuLeft) ST.stuMens=Math.round(mensu(ST.stuLeft,.0045,120)); unlock('diplome'); news.push('🎓 '+d.dip+' obtenu ! Embauché·e chez '+d.emp+' : '+eur(ST.salaire)+' net.'); ST.log.push({y:ST.year,txt:'Diplôme : '+d.dip}); }
    else ST.studyY++;
  } else if (ST.path==='travail'){ ST.salaire=Math.round(ST.salaire*1.018/10)*10; if (d&&d.comm){ var c=Math.round(3000+N()*2500+(m>0?2000:-1500)); c=Math.max(0,c); cash(c); news.push('🏠 Commissions de l\'année : +'+eur(c)); } }
  else if (ST.path==='boite'){ var bad=Math.random()<d.risk, pr=bad?-Math.round(d.base*ST.bizLvl*(.6+Math.random()*.8)):Math.round(d.base*ST.bizLvl*(.6+Math.random()*1.1)); pr-=Math.round(ST.bizPay*12*.4); ST.treso+=pr; news.push((pr>=0?'🚀 ':'📉 ')+ST.biz+' : '+sgn(pr)+' de résultat.');
    if (ST.treso>25000*ST.bizLvl){ ST.bizLvl++; ST.bizPay+=300; news.push('⭐ '+ST.biz+' grandit (niveau '+ST.bizLvl+'). Ta rémunération passe à '+eur(ST.bizPay)+'.'); }
    if (ST.treso<0){ news.push('💀 Faillite de '+ST.biz+'. Tu retrouves un poste salarié à 1 900 € net.'); ST.log.push({y:ST.year,txt:'Faillite : '+ST.biz}); ST.treso=0; ST.path='travail'; ST.domPath='travail'; ST.domI=0; ST.salaire=1900; ST.job='Commercial·e'; ST.emp='Nord Distribution, Lille'; bump('hum',-15); } }
  bump('hum',(ST.owned.piano?2:0)+(home().k==='parents'&&!ownRP()&&ST.age>23?-3:0)+(crash&&invB>5000?-5:0)+(ST.couple!==null?1:-1));
  if (ST.couple!==null){ bump('couple',ST.married?-2:-3); if (ST.couple<15){ news.push('💔 '+ST.partner+' te quitte. '+(ST.married?'Divorce : −8 000 € de frais.':'')); if (ST.married) cash(-8000); ST.couple=null; ST.partner=''; ST.married=false; bump('hum',-15); } }
  if (ST.cash<0){ var need=-ST.cash; var t=Math.min(need,ST.livret); ST.livret-=t; need-=t; if (need>0){ news.push('🚨 Découvert : la banque t\'accorde un crédit de '+eur(need)+'.'); ST.stuLeft+=need; ST.stuMens+=Math.max(30,Math.round(need/36)); } else news.push('⚠️ Compte à sec : ton Livret A a comblé le trou.'); ST.cash=0; }
  ST.age++; ST.year++; ST.asked=false;
  var after=net(), delta=after-before; ST.xp+=20+(delta>0?10:0); ST.hist.push({y:ST.year-1,n:Math.round(after)}); ST.log.push({y:ST.year-1,txt:'Clôture de l\'année',d:Math.round(delta)});
  var yr=ST.yr; ST.yr={inv:0,out:0,shop:0,casino:0,tax:0}; ST.evDone='';
  checkAch(); ST.ev=pickEvent(); if (ST.age>=65) ST.over=true;
  var hi=+(store(KEY+'-hi')||0); if (after>hi) store(KEY+'-hi',String(Math.round(after)));
  save(); showEnd({delta:delta,saved:saved,inv:invG,bets:betG,prop:propG,news:news,lvB:lvB,yr:yr});
}
function showEnd(o){
  screen('scr-end'); var gain=o.delta>=0;
  var h='<span class="lab d">Bilan de l\'année '+(ST.year-1)+' · '+esc(ST.pseudo)+', '+(ST.age-1)+' ans</span><div class="end-vis" id="end-vis"></div><div class="delta '+(gain?'up':'dn')+'" id="end-d" style="color:'+(gain?'#4FD18F':'#FF6B7F')+'">0 €</div><p style="margin:0;text-align:center;color:var(--muted-d)">Patrimoine : <b style="color:#fff">'+eur(net())+'</b></p>'+
    '<div class="card pad"><span class="lab d">Ce qui a fait bouger ton patrimoine</span>'+[['👛 Épargne de l\'année',o.saved],['📈 Placements et Livret A',o.inv],['🏢 Immobilier (valeur − crédit)',o.prop],['🎲 Paris',o.bets]].filter(function(x){return Math.round(x[1]);}).map(function(x){return '<div class="kv"><span>'+x[0]+'</span><b class="'+(x[1]>=0?'up':'dn')+'">'+sgn(x[1])+'</b></div>';}).join('')+'</div>'+
    (o.news.length?'<div class="news">'+o.news.map(function(n){return '<span>'+esc(gz(n))+'</span>';}).join('')+'</div>':'')+
    '<button class="btn gold" id="end-go" style="margin-top:auto"><span>'+(ST.over?'Voir la fin de partie':'Commencer '+ST.year)+'</span></button>';
  $('end').innerHTML=h;
  if (gain){ $('end-vis').innerHTML='<div style="font-size:84px;line-height:1;'+(RM?'':'animation:pop .5s cubic-bezier(.2,1.6,.4,1)')+'">💰</div>'; countTo($('end-d'),0,o.delta,1100,sgn); for (var i=0;i<3;i++) setTimeout(function(){ bills($('end-vis'),12); },i*220); }
  else { $('end-vis').innerHTML='<svg width="96" height="116" viewBox="0 0 150 170" aria-hidden="true" style="'+(RM?'':'animation:slam .45s cubic-bezier(.5,0,.6,1.4)')+'"><path d="M50 6h50v92h38L75 164 12 98h38z" fill="#C8102E"/></svg>'; countTo($('end-d'),0,o.delta,900,sgn); setTimeout(function(){ shake(app); },RM?0:420); }
  if (lvl()>o.lvB) setTimeout(function(){ toast('⬆️ <b>Niveau '+lvl()+'</b> · '+gz(LVT[Math.min(LVT.length-1,lvl()-1)])); },900);
  $('end-go').addEventListener('click',function(){ if (ST.over) endGame(); else go('home'); }); $('end-go').focus();
}
function endGame(){
  screen('scr-end'); var n=net(), rank=n<150000?['🥉','Petit·e épargnant·e']:n<600000?['🥈','Bon·ne gestionnaire']:n<1500000?['🥇','Rentier·ère']:n<4000000?['🏆','Baron·ne de la Corbeille']:['👑','Légende de la Corbeille'];
  $('end').innerHTML='<span class="lab d">Fin de partie · '+ST.year+'</span><div style="font-size:84px;text-align:center;line-height:1.1">'+rank[0]+'</div><h2 class="H" style="margin:0;text-align:center;font-size:30px">'+gz(rank[1])+'</h2><div class="delta" id="fin" style="color:var(--gold)">0 €</div>'+
    '<div class="card pad"><div class="kv"><span>Âge</span><b>65 ans</b></div><div class="kv"><span>Niveau</span><b>'+lvl()+'</b></div><div class="kv"><span>Succès</span><b>'+Object.keys(ST.ach).length+' / '+ACH.length+'</b></div><div class="kv"><span>Humeur finale</span><b>'+ST.hum+' / 100</b></div><div class="kv"><span>Record</span><b>'+eur(Math.max(n,+(store(KEY+'-hi')||0)))+'</b></div></div>'+
    '<button class="btn gold" id="replay" style="margin-top:auto"><span>Rejouer</span></button><button class="btn ghost" id="seep"><span>Voir mon profil</span></button>';
  countTo($('fin'),0,n,1600); bills($('fin'),16);
  $('replay').addEventListener('click',function(){ store(KEY,null); renderTitle(); }); $('seep').addEventListener('click',function(){ go('profil'); });
}

/* ---------- conseils ---------- */
var TIPS={
  home:[['La décision de l\'année','Chaque année, une décision t\'attend dans l\'Accueil. Tu ne peux pas clôturer l\'année sans l\'avoir prise.'],['La réputation pro','Elle monte avec les formations, les pots de départ ou un bon costume. Elle compte pour les augmentations et les promotions.']],
  inv:[['Ouvre ton PEA tôt','Le compteur des 5 ans démarre à l\'ouverture, même avec 0 € dessus. Après 5 ans, tu ne paies que 18,6 % sur les gains au lieu de 31,4 %.'],['L\'or','Il protège pendant les crises. Mais sur le très long terme, les actions ont fait mieux, et l\'or a perdu de sa valeur de 1980 à 2000. Une petite part, pas tout.'],['Diversifier','Un ETF Monde, c\'est 1 500 entreprises d\'un coup. Une action seule comme Neuronia peut faire ×3 ou perdre 80 %.']],
  immo:[['L\'apport','La banque demande en général 10 % du prix plus les frais de notaire (7,5 % dans l\'ancien).'],['Les 35 %','Toutes tes mensualités de crédit ne doivent pas dépasser 35 % de tes revenus. Au-delà, la banque refuse.'],['Le cash-flow','Un bien rentable couvre sa mensualité avec son loyer net. Sinon, c\'est ton salaire qui paie la différence.']],
  budget:[['Se payer en premier','Place ton épargne dès que l\'argent arrive. Ce qui reste sur le compte courant finit souvent dépensé.'],['Le taux d\'épargne','Épargner 15 à 20 % de ses revenus, c\'est déjà très bien.']],
  shop:[['Le casino','La maison gagne toujours sur la durée : 2,7 % à la roulette, environ 16 % à la machine à sous ici. C\'est un loisir, pas un placement.'],['Plaisir ou placement ?','Un achat plaisir fait monter ton humeur tout de suite. Le même argent placé à 7 % double en 10 ans.']],
  profil:[['Les niveaux','Chaque année jouée, chaque décision et chaque succès donnent de l\'expérience.'],['Un secret','Les vieux joueurs connaissent un code de console célèbre. Sur téléphone, tape 7 fois sur ton avatar.']]
};
var tipI=0;
function tipRefresh(){ var L=TIPS[cur]; $('tip-n').textContent=L.length; $('tip').dataset.seen=ST.seenTips[cur]?'1':'0'; var o=$('bubble'); if (o) o.remove(); tipI=0; }
$('tip').addEventListener('click',function(){ var o=$('bubble'); if (o){ o.remove(); return; } var L=TIPS[cur]; ST.seenTips[cur]=1; $('tip').dataset.seen='1'; save();
  var b=document.createElement('div'); b.className='bubble'; b.id='bubble'; b.setAttribute('role','dialog'); b.setAttribute('aria-label','Conseil');
  function draw(){ var t=L[tipI]; b.innerHTML='<h4>'+t[0]+'</h4><p>'+t[1]+'</p><div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">'+(tipI+1)+' / '+L.length+'</span><button class="btn" id="tip-n2" style="min-height:40px"><span>'+(tipI<L.length-1?'Suivant':'Compris')+'</span></button></div>'; $('tip-n2').addEventListener('click',function(){ if (tipI<L.length-1){ tipI++; draw(); } else { b.remove(); tipI=0; } }); }
  $('scr-hub').appendChild(b); draw(); });

/* ---------- code secret ---------- */
function cheat(){ if (!ST||!ST.path) return; if (ST.konami){ toast('👾 Code déjà utilisé.'); return; } ST.konami=true; var old=ST.cash; cash(1000); unlock('konami'); save(); hud(old); bills($('hud-av'),12,$('hn-cash')); toast('👾 <b>Code secret</b> · +1 000 €'); }
var KS=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'],kp=0;
document.addEventListener('keydown',function(e){ if ($('scr-hub').hidden) return; var k=e.key.length===1?e.key.toLowerCase():e.key; kp=k===KS[kp]?kp+1:(k===KS[0]?1:0); if (kp===KS.length){ kp=0; cheat(); } });
var taps=0,tapT=0; $('hud-av').addEventListener('click',function(){ var n=Date.now(); taps=n-tapT<700?taps+1:1; tapT=n; if (taps>=7){ taps=0; cheat(); } });

renderTitle();
})();
