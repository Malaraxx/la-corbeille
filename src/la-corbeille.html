<title>La Corbeille</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,800;1,6..96,500;1,6..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : bandeau de situation, la Gazette de l’année, la Une + le dilemme perso, carnet d’ordres par enveloppe, bureau immobilier ; un bilan par an */
:root{
  --paper:#f1dccb; --sheet:#f9ece2; --ink:#221b29; --muted:#6c5952; --rule:#d2b2a0;
  --accent:#0d5163; --accent-ink:#fbefe6; --up:#1b7740; --down:#b0281e; --warn:#9a5a00; --life:#8a2f5c;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --crash:#4a1512; --night:#17141d;
  --f-display:"Bodoni Moda", Didot, "Bodoni 72", Georgia, serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#16141b; --sheet:#211d28; --ink:#f1e3d8; --muted:#a8968e; --rule:#3c3545;
  --accent:#7ccbdc; --accent-ink:#0f1a1e; --up:#61cd90; --down:#ff8576; --warn:#eab560; --life:#f08cbd; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --crash:#3b0f0d; --night:#0e0c12; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#16141b; --sheet:#211d28; --ink:#f1e3d8; --muted:#a8968e; --rule:#3c3545;
  --accent:#7ccbdc; --accent-ink:#0f1a1e; --up:#61cd90; --down:#ff8576; --warn:#eab560; --life:#f08cbd; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --crash:#3b0f0d; --night:#0e0c12; color-scheme:dark }

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:22px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .mut{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.small{font-size:12.5px}

.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px double var(--ink);padding-bottom:10px}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,46px);letter-spacing:-.01em;line-height:1}
.logo i{font-weight:500}
.tag{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.ghost{background:transparent;border:1px solid var(--rule);border-radius:4px;padding:6px 10px;font-size:13px}
.ghost:hover{border-color:var(--ink)}
.ghost.danger{border-color:var(--down);color:var(--down)}
.ghost:disabled{opacity:.4;cursor:not-allowed}

.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.status>div{background:var(--sheet);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.status strong{font-family:var(--f-mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .date strong{font-family:var(--f-display);font-size:20px;font-weight:700}
.status small{font-family:var(--f-mono);font-size:12px}
.status small.who{font-family:var(--f-body)}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
.gauge{display:flex;flex-direction:column;gap:4px}
.gauge .top{display:flex;justify-content:space-between;font-size:12px;gap:4px}
.gauge .bar-g{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.gauge .bar-g i{display:block;height:100%;background:var(--life)}
.gauge.low .bar-g i{background:var(--down)}
.timeline{position:relative;height:22px}
.timeline .track{position:absolute;left:0;right:0;top:4px;height:4px;background:var(--rule);border-radius:2px}
.timeline .fill{position:absolute;left:0;top:4px;height:4px;background:var(--ink);border-radius:2px}
.timeline span{position:absolute;top:10px;font-size:10px;color:var(--muted);transform:translateX(-50%);font-family:var(--f-mono)}
.timeline span:first-of-type{transform:none} .timeline span:last-of-type{transform:translateX(-100%)}

.cards{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.cards.single{grid-template-columns:minmax(0,1fr)}
.une{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--rule)}
.une-mast{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:6px;font-family:var(--f-display);font-style:italic;font-size:14px}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--down)}
.une h2{font-size:clamp(24px,3.6vw,34px);font-weight:700}
.lede{font-size:15.5px;max-width:62ch}
.shocks{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.fiche{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.fiche table{font-size:13.5px}
.fiche td{padding:4px 6px}
.fiche td:first-child{padding-left:0}
.life{background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--life);border-radius:4px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.life .kicker{color:var(--life)}
.life h3{font-size:22px;font-weight:700}
.decision{border-top:1px dashed var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.must{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--warn)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:transparent;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.choice:hover{border-color:var(--ink);background:var(--paper)}
.choice b{font-weight:600}
.choice small{color:var(--muted);font-size:12.5px}
.result{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;background:var(--paper);border-radius:6px;padding:10px 12px}
.result::before{content:"✓";font-weight:700;color:var(--up)}
.err{color:var(--down);font-size:13px}
.ok{color:var(--muted);font-size:13px}
.invest{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,.invest input,.order input,.wd input{font:inherit;font-family:var(--f-mono);font-size:14px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;min-width:0}
.invest input,.order input,.wd input{width:140px}
.minis{display:flex;gap:4px;flex-wrap:wrap}
.mini{background:transparent;border:1px solid var(--rule);border-radius:4px;padding:3px 8px;font-size:12px;font-family:var(--f-mono)}
.mini:hover{border-color:var(--ink)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:8px 14px;font-weight:600}
.secondary:disabled{opacity:.4;cursor:not-allowed}
.sell{border-color:var(--down);color:var(--down)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:6px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .mut{font-size:13px}
.locked{background:var(--sheet);border:1px dashed var(--life);border-radius:6px;padding:10px 12px;color:var(--life);font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--rule)}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px 6px;display:flex;flex-direction:column;align-items:flex-start;font-weight:600;font-size:14px;margin-bottom:-1px}
.tab small{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--accent)}
.tab:hover{color:var(--accent)}
.envhead{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.envhead .kv{max-width:520px}
.wd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.book{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 84px repeat(3,minmax(0,1fr)) 78px;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--rule)}
.row.head{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:4px}
.row .r{text-align:right}
.aname b{display:block;font-weight:600}
.aname small{color:var(--muted);font-size:12px}
.row.open{background:var(--sheet)}
.obtn{background:transparent;border:1px solid var(--rule);border-radius:4px;padding:5px 0;font-size:13px}
.obtn:hover{border-color:var(--ink)}
.obtn:disabled{opacity:.4;cursor:not-allowed}
.spark{display:block}
.c-sp{display:flex;align-items:center}
.alloc{display:flex;flex-direction:column;gap:12px}
.abar{display:flex;gap:2px;height:22px;border-radius:4px;overflow:hidden}
.abar i{display:block;height:100%;min-width:3px}
.alegend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px 18px;font-size:13.5px}
.alegend div{display:flex;align-items:baseline;gap:8px;min-width:0}
.alegend .sw{width:10px;height:10px;border-radius:2px;flex:none;transform:translateY(1px)}
.alegend .v{margin-left:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.idle{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px solid var(--warn);border-radius:6px;padding:10px 14px;background:var(--sheet)}
.idle b{font-family:var(--f-mono);font-weight:500}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.profiles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{background:transparent;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:13px}
.pchip:hover{border-color:var(--ink)}
.pchip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.slider{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.slider input{width:200px;max-width:100%;accent-color:var(--accent)}
.plan{border:1px dashed var(--accent);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px;background:var(--paper)}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.invd{border-top:1px solid var(--ink);padding-top:8px;display:flex;flex-direction:column;gap:14px}
.invd summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;list-style:none}
.invd summary::-webkit-details-marker{display:none}
.invd summary::before{content:"▸";font-size:14px;color:var(--muted)}
.invd[open] summary::before{content:"▾"}
.h2like{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.invd[open]>*:not(summary){margin-top:12px}
table.inv{font-size:13.5px}
table.inv td{vertical-align:top}
.nowrap{white-space:nowrap}
.mcap{display:none;text-align:left;padding-bottom:4px;border-bottom:1px solid var(--ink)}
@media (max-width:760px){
  .mcap{display:block}
  table.inv thead{display:none}
  table.inv,table.inv tbody{display:block;width:100%}
  table.inv tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--rule)}
  table.inv td{display:block;border:0;padding:0;text-align:left;min-width:0}
  table.inv td:first-child{grid-column:1/3}
  table.inv td.per{grid-column:1/3;color:var(--muted);font-size:13px}
  table.inv td[data-l]::before{content:attr(data-l);display:block;color:var(--muted);font-size:11px;font-family:var(--f-body);letter-spacing:.04em}
  table.inv td.n{text-align:left;white-space:nowrap}
}
.archs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.archc{text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.archc:hover{border-color:var(--ink)}
.archc[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.archc b{font-family:var(--f-display);font-size:19px}
.archc .kv{font-size:12.5px}
.setup{display:flex;flex-direction:column;gap:16px}
.goals{display:flex;flex-wrap:wrap;gap:6px}
.goal{font-size:12.5px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:var(--sheet)}
.goal.ok{border-color:var(--up);color:var(--up);font-weight:600}
.goal.ko{color:var(--muted);text-decoration:line-through}
.advs{display:flex;flex-direction:column;gap:8px}
.adv{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.adv p{margin:2px 0;font-style:italic}
.ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;background:var(--paper);border:1px solid var(--rule)}
.toasts{display:flex;flex-direction:column;gap:8px}
.toast{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;border:1px solid var(--accent);border-left-width:4px;border-radius:6px;padding:8px 12px;background:var(--sheet)}
.toast b{font-family:var(--f-display);font-size:17px}
.anim{position:fixed;inset:0;z-index:20;background:var(--night);color:#f6eadf;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:background .4s}
.anim.crash{background:var(--crash)}
.anim-in{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:620px;width:100%}
.anim .lbl{color:#cbb8ad}
.anim-y{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,16vw,128px);line-height:1}
.anim-net{font-family:var(--f-mono);font-size:clamp(26px,6vw,40px)}
.anim-pct{font-family:var(--f-mono);font-size:18px}
.anim-pct.up{color:#7fe0a6} .anim-pct.down{color:#ff9b8f}
.anim-notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14.5px;color:#e9d9cd;min-height:44px}
.anim-ach{color:#f3c96b;font-weight:600}
.anim .ghost{color:#f6eadf;border-color:#6d5f67;margin-top:8px}
.ticker{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow:hidden;white-space:nowrap;font-family:var(--f-mono);font-size:13px;color:#cbb8ad;border-top:1px solid #3c3545;border-bottom:1px solid #3c3545;padding:6px 0}
.ticker span{display:inline-block;padding-left:100%}
@media (prefers-reduced-motion:no-preference){.ticker span{animation:tick 9s linear infinite}@keyframes tick{to{transform:translateX(-100%)}}}
.coups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.coups ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ach{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.ach b{font-size:14px}
.ach.on{border-color:var(--accent);background:var(--sheet)}
.ach.off{color:var(--muted)}
.ach.off b::before{content:"🔒 ";font-size:11px}
.share{display:flex;flex-direction:column;gap:8px}
.share textarea{font:inherit;font-size:13px;width:100%;min-height:70px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:8px}
@media (max-width:760px){.archs,.coups{grid-template-columns:minmax(0,1fr)}}
.order{background:var(--sheet);border-bottom:1px solid var(--rule);padding:10px 12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.order .note{flex-basis:100%;font-size:12.5px;color:var(--muted)}
.order label{font-size:13px}

.desk{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.offer{border:1px solid var(--rule);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--sheet)}
.offer h3{font-size:19px;font-weight:700}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px}
.kv span:nth-child(even){font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.owned{display:flex;flex-direction:column}
.prop{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--rule);font-size:14px}
.prop .btns{justify-content:flex-end}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bar-in{max-width:980px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar small{font-size:13px;opacity:.8}
.bar .primary{background:var(--paper);color:var(--ink)}

.bilan{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:16px}
.bilan h2{font-size:clamp(26px,4vw,38px);font-weight:700}
.bigline{display:flex;flex-wrap:wrap;gap:22px;align-items:baseline}
.bigline .v{font-family:var(--f-mono);font-size:clamp(22px,4vw,30px);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--ink)}
td{padding:7px 8px;border-bottom:1px solid var(--rule)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td small{color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:6px;padding-left:0;margin:0;list-style:none}
.notes li{padding:8px 10px;background:var(--paper);border-radius:4px;font-size:14px}
.notes b{font-family:var(--f-mono);font-weight:500;margin-right:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
details{border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:14px}
details[open] summary{margin-bottom:8px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

function makeThemes(){

  for(const [a,b] of [[0,6],[12,22],[26,38]]){
    const T=pool.splice(Math.floor(rnd()*pool.length),1)[0],ok=rnd()<.5;
    out.push({...T,start:Y0+a+Math.floor(rnd()*(b-a+1)),ok,dr:1+Math.floor(rnd()*2),da:ok?2+Math.floor(rnd()*3):1+Math.floor(rnd()*3),db:ok?1+Math.floor(rnd()*2):0});
  }
  return out;
}
// Étape d'un thème une année donnée : rumeur → lancement du fonds → adoption → bulle → krach → maturité (ou échec → zombie).
function themeStage(T,y){
  let t=y-T.start;if(t<0)return null;
  if(t<T.dr)return 'rumeur';t-=T.dr;
  if(t===0)return 'lancement';t--;
  if(t<T.da)return 'adoption';t-=T.da;
  if(T.ok){if(t<T.db)return 'bulle';t-=T.db;return t===0?'krach':'mature';}
  return t===0?'echec':'zombie';
}

function irr(fl){
  const f=fl.filter(x=>Math.abs(x.a)>0.004).sort((a,b)=>a.t-b.t);
  if(!f.length)return null;
  const pos=f.reduce((s,x)=>s+(x.a>0?x.a:0),0);if(pos<0.01)return -1;
  if(f.length<2)return null;
  const t0=f[0].t;if(f[f.length-1].t-t0<0.5)return null;
  const npv=r=>f.reduce((s,x)=>s+x.a/Math.pow(1+r,x.t-t0),0);
  let lo=-0.999,hi=10,flo=npv(lo);if(flo*npv(hi)>0)return null;
  for(let i=0;i<90;i++){const m=(lo+hi)/2,fm=npv(m);if(fm*flo>0){lo=m;flo=fm;}else hi=m;}
  return (lo+hi)/2;
}

  if(META[id].k!=='special'&&!ENVS[e].el.includes(id))return `${nm(id)} n’est pas éligible au ${ENVS[e].n}.`;
  const A=S.acc[e],fromEnv=e==='cto'?0:Math.min(A.cash,amt),fromMain=amt-fromEnv;
  if(fromMain>S.cash+0.5)return `Liquidités insuffisantes : il te manque ${fmt(fromMain-S.cash)}. Vends d’abord une ligne ou retire de l’argent d’une enveloppe.`;

  if(e!=='cto'){if(A.open==null)A.open=S.year;A.cash-=fromEnv;A.vers+=fromMain;}

}

  const u=Math.min(S.lossCarry,g);S.lossCarry-=u;return (g-u)*ctoRate();
}
function estTaxCto(id,amt){
  const h=S.acc.cto.hold[id];if(!h||h.v<=0)return 0;
  amt=Math.min(amt,h.v);const g=amt-h.b*(amt/h.v);if(g<=0)return 0;

}
function sellIn(e,id,amt){
  const h=S.acc[e].hold[id];if(!h||h.v<=0)return {err:'Tu ne détiens rien sur cette ligne.'};
  amt=Math.min(Math.floor(amt*100)/100,h.v);if(!(amt>0))return {err:'Indique un montant.'};
  if(h.v-amt<1)amt=h.v;
  const basis=h.b*(amt/h.v);h.v-=amt;h.b-=basis;if(h.v<.01){h.v=0;h.b=0;}
  if(e==='cto'){const tax=taxGain(amt-basis);S.cash+=amt-tax;lgFlow(e,id,amt-tax);return {amt,tax};}
  S.acc[e].cash+=amt;lgFlow(e,id,amt);return {amt,tax:0,inEnv:true};
}

}
function livOut(amt){amt=Math.min(amt,S.liv);if(!(amt>0))return {err:'Ton Livret A est vide.'};S.liv-=amt;if(S.liv<.01)S.liv=0;S.cash+=amt;lgFlow('liv','livret',amt);return {amt,tax:0};}
function avAbattLeft(){const cap=S.me.marie?9200:4600;return cap-(S.avAb.y===S.year?S.avAb.used:0);}
function wdCalc(e,amt){
  const A=S.acc[e],tot=envTotal(e),close=e==='pea'&&envYears('pea')<5;
  amt=close?tot:Math.min(amt,A.cash);
  if(!(amt>0.005)||tot<=0)return {amt:0,tax:0,close,taxable:0};
  const taxable=amt*Math.max(0,1-A.vers/tot);let tax;
  if(e==='pea')tax=taxable*(close?ctoRate():psRate());
  else if(envYears('av')>=8)tax=Math.max(0,taxable-avAbattLeft())*.075+taxable*psRate();
  else tax=taxable*ctoRate();
  return {amt,tax,close,taxable};
}
function withdraw(e,amt){
  const A=S.acc[e],c=wdCalc(e,amt);
  if(!(c.amt>0))return {err:c.close?'Ton PEA est vide.':'Aucune liquidité dans cette enveloppe : vends d’abord une ligne, l’argent y restera disponible.'};
  const tot=envTotal(e);
  if(c.close){for(const k in A.hold){lgFlow(e,k,A.hold[k].v);A.cash+=A.hold[k].v;}A.hold={};}
  A.vers-=A.vers*(c.amt/tot);A.cash-=c.amt;if(A.cash<.01)A.cash=0;
  if(e==='av'&&envYears('av')>=8){if(S.avAb.y!==S.year)S.avAb={y:S.year,used:0};S.avAb.used+=Math.min(c.taxable,avAbattLeft());}
  if(c.close){A.open=null;A.vers=0;A.cash=0;}
  S.cash+=c.amt-c.tax;lgEnv(e,c.amt-c.tax);return {amt:c.amt,tax:c.tax,closed:c.close};
}
// Couvre un solde négatif du compte courant en vendant dans un ordre fiscalement raisonnable. Boucle jusqu'à couverture.
function raiseCash(ctx){
  ctx.sold=ctx.sold||0;ctx.tax=ctx.tax||0;ctx.props=ctx.props||[];
  const add=r=>{if(r&&!r.err){ctx.sold+=r.amt;ctx.tax+=r.tax||0;}};
  let guard=0;
  while(S.cash<-0.5&&guard++<120){
    const need=-S.cash*1.6+1;
    if(S.liv>0.5){add(livOut(Math.min(S.liv,need)));continue;}
    const eCash=['av','pea'].find(e=>S.acc[e].cash>0.5&&!(e==='pea'&&envYears('pea')<5));
    if(eCash){add(withdraw(eCash,Math.min(S.acc[eCash].cash,need)));continue;}
    let id=['oat','monde','tracker','or','pharma','luxe','telecom','banque','petro','aero',...THEMES,'jeton'].find(k=>ev('cto',k)>0.5);
    if(id){add(sellIn('cto',id,Math.min(ev('cto',id),need)));continue;}
    id=['euros','oat','monde','tracker',...THEMES].find(k=>ev('av',k)>0.5);
    if(id){sellIn('av',id,Math.min(ev('av',id),need));continue;}
    if(envTotal('pea')>0.5){
      if(envYears('pea')>=5){id=EQUITY.find(k=>ev('pea',k)>0.5);if(id){sellIn('pea',id,Math.min(ev('pea',id),need));continue;}}
      else{add(withdraw('pea',0));ctx.peaClosed=true;continue;}
    }
    if(S.props.length){const p=S.props[0];const c=sellProp(p.uid,propValue(p)*.85,ctx.y||S.year,'Vente forcée');ctx.props.push(`${pname(p.type)} vendu d’office avec 15 % de décote (${fmt(c.net)} net).`);continue;}
    break;
  }
  if(S.cash<-1){
    if(ctx.retired){ctx.ruin=-S.cash;S.yearExt-=S.cash;S.extTot=(S.extTot||0)-S.cash;S.cash=0;}
    else S.flags.faillite=true;
  }
  return ctx;
}
function raiseNotes(ctx,label){
  const n=[];
  if(ctx.sold>0.5)n.push(`${label} : ${fmt(ctx.sold)} vendus ou retirés d’office${ctx.tax>0.5?` (impôt ${fmt(ctx.tax)})`:''}.`);
  if(ctx.peaClosed)n.push('Ton PEA avait moins de 5 ans : le retrait forcé l’a clôturé.');
  n.push(...ctx.props);
  if(ctx.ruin)n.push(`Ton patrimoine financier est épuisé : il manque ${fmt(ctx.ruin)} pour compléter ta pension. Tu te serres la ceinture (humeur −15).`);
  if(S.flags.faillite)n.push('Plus rien à vendre : faillite personnelle.');
  return n;
}
// Dépense immédiate (vie perso ou frais). Si le compte passe dans le rouge, on vend tout de suite et on le dit.
function spend(a,isLife){
  if(isLife)ext(-a);else S.cash-=a;
  if(S.cash<-0.5){const c=raiseCash({retired:retired(S.year)});if(c.ruin)S.me.humeur=clamp(S.me.humeur-15,0,100);return ' '+raiseNotes(c,'Pour payer').join(' ');}
  return '';
}

/* ===================== IMMOBILIER ===================== */
const annuity=(L,r,n)=>r===0?L/n:L*r/(1-Math.pow(1+r,-n));
// Un crédit = un prêt principal {p,r,n,ann} et, pour un premier achat, un prêt à taux zéro z {p,ann} remboursé sur la même durée.
const loanAnn=p=>p.loan&&p.loan.n>0?p.loan.ann+(p.loan.z&&p.loan.z.p>0?p.loan.z.ann:0):0;
const loanLeft=p=>p.loan?p.loan.p+(p.loan.z?p.loan.z.p:0):0;
function payLoan(p){
  const L=p.loan;if(!L||L.n<=0)return {ann:0,it:0};
  const it=L.p*L.r;let ann=L.ann;L.p=Math.max(0,L.p-(L.ann-it));
  if(L.z&&L.z.p>0){const a=Math.min(L.z.p,L.z.ann);L.z.p-=a;ann+=a;}
  L.n--;if(L.n<=0){L.p=0;if(L.z)L.z.p=0;}
  return {ann,it};
}
function effort(extraAnn,extraRent){
  const ann=S.props.reduce((a,p)=>a+loanAnn(p),0)+extraAnn;
  const rents=S.props.filter(p=>!isRP(p)).reduce((a,p)=>a+S.idx[p.type].rent*p.rentMult,0)+extraRent;
  return ann/(foyerRev()+0.7*rents);
}
// Prêt à taux zéro : premier achat de résidence principale, revenus du foyer sous 60 000 € (en euros de 2026). Il finance 20 % du prix.
const ptzOk=type=>BIENS[type].k==='rp'&&!S.flags.ownedRP&&foyerRev()<=60000*S.defl;
const DURS=[15,20,25];
function propQuote(type,n=20){
  if(!DURS.includes(n))n=20;
  // Avec un PTZ, la banque se contente d'un apport de 10 % + frais de notaire ; sinon 20 % + frais.
  const ix=S.idx[type],price=ix.price,frais=price*0.075,z=ptzOk(type)?price*.2:0,ap=z?.1:.2,L=price*(1-ap),r=(curCredit()+(n>=25?.2:n<=15?-.15:0))/100;
  const annM=annuity(L-z,r,n),annZ=z?z/n:0,ann=annM+annZ;
  return {price,frais,cashNeed:price+frais,apport:price*ap+frais,ap,L,z,r,n,ann,annM,annZ,rent:ix.rent,eff:effort(ann,BIENS[type].k==='rp'?0:ix.rent)};
}
// La plus courte durée qui passe sous les 35 % de taux d'effort.
function bestDur(type){for(const n of DURS)if(propQuote(type,n).eff<=.35)return n;return 25;}
function buyProp(type,mode,n=20){
  if(!BIENS[type])return 'Bien inconnu.';
  if(retired(S.year)&&mode==='credit')return 'À la retraite, ta banque ne te prête plus sur 20 ans.';
  const rp=BIENS[type].k==='rp';
  if(rp&&S.props.some(isRP))return 'Tu as déjà une résidence principale.';
  const q=propQuote(type,n);
  if(mode==='cash'){
    if(S.cash<q.cashNeed)return `Il faut ${fmt(q.cashNeed)} sur ton compte courant (prix + frais de notaire). Tu as ${fmt(S.cash)}.`;
    S.cash-=q.cashNeed;S.props.push({uid:S.uid++,type,buyYear:S.year,cost:q.cashNeed,loan:null,rentMult:1,vacantUntil:0,noRent:0,mode:'comptant',flows:[{t:S.clk.t,y:S.clk.y,a:-q.cashNeed}]});
  }else{
    if(S.cash<q.apport)return `Apport insuffisant : il faut ${fmt(q.apport)} (${pc0(q.ap)} + frais de notaire) sur ton compte courant. Tu as ${fmt(S.cash)}.`;
    if(q.eff>0.35)return `Ta banque refuse : taux d’effort de ${f1(q.eff*100)} % pour un maximum de 35 %.`;
    S.cash-=q.apport;S.props.push({uid:S.uid++,type,buyYear:S.year,cost:q.cashNeed,loan:{p:q.L-q.z,r:q.r,n:q.n,ann:q.annM,z:q.z?{p:q.z,ann:q.annZ}:null},rentMult:1,vacantUntil:0,noRent:0,mode:`crédit ${q.n} ans${q.z?' + PTZ':''}`,flows:[{t:S.clk.t,y:S.clk.y,a:-q.apport}]});
  }
  if(rp){S.home={type,own:true,since:S.year};S.flags.ownedRP=true;if(S.flags.rpYear==null)S.flags.rpYear=S.year;if(age(S.year)<30)unlock('proprio');}
  if(S.props.filter(p=>!isRP(p)).length>=2)S.flags.twoRent=true;
  if(S.props.length>=3)unlock('empire');
  return null;
}
function pvImmoTax(gain,d){
  if(gain<=0)return 0;
  const abIR=d<=5?0:d>=22?1:.06*(d-5);
  const abPS=d<=5?0:d>=30?1:d<=21?.0165*(d-5):d===22?.28:.28+.09*(d-22);
  return gain*(1-abIR)*.19+gain*(1-abPS)*psRate();
}
function propSaleCalc(p,gross,y){
  const repay=(p.loan&&p.loan.p>0?p.loan.p*1.03:0)+(p.loan&&p.loan.z?p.loan.z.p:0);
  const tax=isRP(p)?0:pvImmoTax(gross-p.cost,y-p.buyYear);
  return {gross,repay,tax,net:gross-repay-tax};
}
function sellProp(uid,gross,y,how){
  const i=S.props.findIndex(p=>p.uid===uid);if(i<0)return null;
  const p=S.props[i];const c=propSaleCalc(p,gross??propValue(p)*0.95,y??S.year);
  S.cash+=c.net;S.props.splice(i,1);lgProp(p,c.net);
  if(S.lg)S.lg.props.push({type:p.type,mode:p.mode||'',buyYear:p.buyYear,sellYear:S.clk.y,how:how||'Vente',flows:p.flows||[]});
  if(isRP(p))S.home={type:bestRental(),own:false,since:S.year}; // on redevient locataire
  return c;
}
function canReneg(p){return p.loan&&p.loan.n>2&&p.loan.p>1000&&curCredit()/100<p.loan.r-0.007;}
function reneg(uid){
  const p=S.props.find(x=>x.uid===uid);if(!p||!canReneg(p))return 'Renégociation impossible.';
  const cost=p.loan.p*0.01;
  if(cost>S.cash)return `Il faut ${fmt(cost)} de frais sur ton compte courant.`;
  S.cash-=cost;lgProp(p,-cost);p.loan.r=curCredit()/100;p.loan.ann=annuity(p.loan.p,p.loan.r,p.loan.n);return null;
}
// ----- se loger -----
const cityRP=()=>Object.keys(BIENS).filter(k=>BIENS[k].k==='rp'&&BIENS[k].v===(S.city||'lille'));
// Un propriétaire bailleur demande des revenus d'au moins trois fois le loyer.
const canRent=type=>type==='parents'?age(S.year)<30:type==='coloc'?!P():foyerRev()>=3*S.idx[type].rent;
function bestRental(){
  const c=cityRP().filter(canRent).sort((a,b)=>S.idx[a].rent-S.idx[b].rent);
  return c.find(k=>BIENS[k].cap>=need())||c[c.length-1]||(P()?cityOf().t2:'coloc');
}
// Le meilleur achat possible en ville : assez grand, finançable, le moins cher. Sinon le moins cher assez grand (pour montrer ce qui manque).
function bestBuy(){
  const rp=rpOf(),avail=Math.max(0,S.cash)+S.liv+(rp?Math.max(0,propSaleCalc(rp,propValue(rp)*.95,S.year).net):0);
  const c=cityRP().filter(k=>BIENS[k].cap>=Math.min(need(),5)&&(!rp||k!==rp.type)).sort((a,b)=>S.idx[a].price-S.idx[b].price);
  const all=c.map(type=>{const n=bestDur(type),q=propQuote(type,n);return {type,n,q,ok:q.eff<=.35&&avail>=q.apport};});
  return all.find(x=>x.ok)||all[0]||null;
}
const moveCost=()=>Math.round(1500*S.defl/10)*10;
function moveTo(type,free){
  if(S.props.some(isRP))return 'Vends d’abord ta résidence principale pour déménager.';
  if(S.home&&S.home.type===type)return 'Tu y vis déjà.';
  if(!canRent(type))return type==='parents'?'Après 30 ans, retourner chez tes parents n’est plus une option.':type==='coloc'?'La colocation, c’est pour les célibataires.':`Le propriétaire demande des revenus d’au moins trois fois le loyer, soit ${fmt(3*S.idx[type].rent/12)} par mois.`;
  S.home={type,own:false,since:S.year};
  if(!free)spend(moveCost(),true);
  return null;
}
// Achète une résidence principale en vendant l'ancienne et en complétant l'apport avec le Livret A si besoin.
function buyHome(type,n){
  const rp=rpOf(),probe=dry(()=>{if(rp)sellProp(rp.uid);const q=propQuote(type,n);if(S.cash<q.apport&&S.liv>0)livOut(Math.min(S.liv,q.apport-S.cash));return buyProp(type,'credit',n);});
  if(probe)return probe;
  if(rp)sellProp(rp.uid,undefined,undefined,'Vente pour déménager');
  const q=propQuote(type,n);if(S.cash<q.apport&&S.liv>0)livOut(Math.min(S.liv,q.apport-S.cash));
  return buyProp(type,'credit',n);
}

/* ===================== CHOCS ===================== */
// map : {actif: variation en %}. Les clés « loc », « bur » et « rp » touchent tous les biens de ce type.
function shock(map){
  for(const k in map){
    const d=map[k]/100;
    if(k==='loc'||k==='bur'||k==='rp'){for(const b in BIENS)if(BIENS[b].k===k){const before=S.idx[b].price;S.idx[b].price*=1+d;for(const p of S.props)if(p.type===b)S.shockEur=(S.shockEur||0)+before*d;}}
    else{S.px[k]*=1+d;for(const e in S.acc){const h=S.acc[e].hold[k];if(h){S.shockEur=(S.shockEur||0)+h.v*d;h.v*=1+d;}}if(k==='monde')S.bench.trk*=1+d;}
    S.turnShock[k]=(S.turnShock[k]||0)+map[k];
  }
}
function setPending(y,k,v){(S.pending[y]||(S.pending[y]={}))[k]=v;}
function sellEverywhere(ids){
  let t=0,tax=0;for(const id of ids)for(const e in S.acc){if(ev(e,id)>0){const r=sellIn(e,id,ev(e,id));t+=r.amt||0;tax+=r.tax||0;}}
  return {t,tax};
}
const ctoLatent=()=>{let t=0;for(const id in S.acc.cto.hold){const h=S.acc.cto.hold[id];if(META[id].k!=='special'&&h.v>h.b)t+=h.v-h.b;}return t;};
function purgeCto(){let t=0;for(const id in S.acc.cto.hold){const h=S.acc.cto.hold[id];if(META[id].k==='special'||h.v<=h.b)continue;const tax=taxGain(h.v-h.b);h.v-=tax;h.b=h.v;t+=tax;}return t;}

/* ===================== RÉPARTITION ===================== */
const CLASSES=[{k:'safe',n:'Garanti et liquidités',c:'--c1'},{k:'eq',n:'Actions',c:'--c2'},{k:'bond',n:'Obligations',c:'--c3'},{k:'immo',n:'Immobilier net',c:'--c4'},{k:'spec',n:'Or et spéculatif',c:'--c5'}];
function alloc(){
  const a={safe:Math.max(0,S.cash)+S.liv+envCash(),eq:0,bond:0,immo:Math.max(0,propsValue()-debtTotal()),spec:0};
  for(const e in S.acc)for(const k in S.acc[e].hold){const v=S.acc[e].hold[k].v;if(!(v>0))continue;
    if(k==='euros')a.safe+=v;else if(k==='oat')a.bond+=v;else if(EQUITY.includes(k))a.eq+=v;else a.spec+=v;}
  return a;
}
const finT=a=>a.safe+a.eq+a.bond;
const eqShare=()=>{const a=alloc(),t=finT(a);return t>0?a.eq/t:0;};
const idleAmt=()=>Math.max(0,S.cash)+envCash();
const isIdle=()=>idleAmt()>=Math.max(1000,.02*Math.max(0,net()));
function op(ops,verb,id,env,amt,note){const o=ops.find(x=>x.verb===verb&&x.id===id&&x.env===env);if(o)o.amt+=amt;else ops.push({verb,id,env,amt,note});}
function opText(o){
  const env={liv:'',cto:' (compte-titres)',pea:' (PEA)',av:' (assurance-vie)'}[o.env];
  const name=o.id.includes('→')?o.id.split('→').map(nm).join(' vers l’'):nm(o.id);
  const v={Acheter:'Acheter',Verser:'Verser',Retirer:'Retirer',Vendre:'Vendre',Arbitrer:'Arbitrer'}[o.verb];
  const prep=o.verb==='Verser'?'sur le ':o.verb==='Retirer'?'du ':o.verb==='Arbitrer'?'du ':'de ';
  return `${v} ${fmt(o.amt)} ${prep}${name}${env}${o.note?` · ${o.note}`:''}`;
}
function routeEq(amt,ops){
  amt=Math.floor(Math.min(amt,S.cash));if(amt<1)return 0;let left=amt;
  const room=Math.floor(Math.max(0,peaCap()-S.acc.pea.vers)),x=Math.min(left,room);
  if(x>=1&&!buyIn('pea','monde',x)){op(ops,'Acheter','monde','pea',x);left-=x;}
  if(left>=1&&!buyIn('av','monde',left)){op(ops,'Acheter','monde','av',left);left=0;}
  return amt-left;
}
function routeSafe(amt,ops){
  amt=Math.floor(Math.min(amt,S.cash));if(amt<1)return;
  const x=Math.min(amt,Math.floor(Math.max(0,livretCap()-S.liv)));
  if(x>=1&&!livIn(x)){op(ops,'Verser','livret','liv',x);amt-=x;}
  if(amt>=1&&!buyIn('av','euros',amt))op(ops,'Acheter','euros','av',amt);
}
// Place l'argent qui dort (compte courant + liquidités d'enveloppe) vers la cible, sans rien vendre.
function placeIdle(p,ops){
  const a=alloc();let need=Math.max(0,p*finT(a)-a.eq);
  let x=Math.floor(Math.min(S.acc.pea.cash,need));
  if(x>=1&&!buyIn('pea','monde',x)){op(ops,'Acheter','monde','pea',x,'avec les liquidités du PEA');need-=x;}
  if(S.acc.av.cash>=1){x=Math.floor(Math.min(S.acc.av.cash,need));if(x>=1&&!buyIn('av','monde',x)){op(ops,'Acheter','monde','av',x);need-=x;}
    const rest=Math.floor(S.acc.av.cash);if(rest>=1&&!buyIn('av','euros',rest))op(ops,'Acheter','euros','av',rest);}
  need-=routeEq(Math.min(S.cash,need),ops);
  routeSafe(S.cash,ops);
}
function rebalance(p){
  const ops=[];let tax=0;
  placeIdle(p,ops);
  const a=alloc(),T=finT(a),tol=Math.max(500,T*.01);let diff=p*T-a.eq,x;
  if(diff>tol){
    x=Math.floor(Math.min(diff,ev('av','euros')));if(x>=1){sellIn('av','euros',x);buyIn('av','monde',x);op(ops,'Arbitrer','euros→monde','av',x,'sans impôt');diff-=x;}
    x=Math.floor(Math.min(diff,S.liv));if(x>=1){livOut(x);op(ops,'Retirer','livret','liv',x);routeEq(x,ops);diff-=x;}
    x=Math.floor(Math.min(diff,ev('av','oat')));if(x>=1){sellIn('av','oat',x);buyIn('av','monde',x);op(ops,'Arbitrer','oat→monde','av',x,'sans impôt');diff-=x;}
    x=Math.floor(Math.min(diff,ev('cto','oat')));if(x>=1){const r=sellIn('cto','oat',x);tax+=r.tax||0;op(ops,'Vendre','oat','cto',x);routeEq(x-(r.tax||0),ops);diff-=x;}
  }else if(diff<-tol){
    let need=-diff;
    x=Math.floor(Math.min(need,ev('av','monde')));if(x>=1){sellIn('av','monde',x);buyIn('av','euros',x);op(ops,'Arbitrer','monde→euros','av',x,'sans impôt');need-=x;}
    x=Math.floor(Math.min(need,ev('cto','monde')));if(x>=1){const r=sellIn('cto','monde',x);tax+=r.tax||0;op(ops,'Vendre','monde','cto',x);routeSafe(x-(r.tax||0),ops);need-=x;}
    x=Math.floor(Math.min(need,ev('pea','monde')));if(x>=1){sellIn('pea','monde',x);op(ops,'Vendre','monde','pea',x,'l’argent reste en liquidités dans le PEA');need-=x;}
  }
  return {ops,tax,after:eqShare()};
}
function dry(fn){const saved=S;S=JSON.parse(JSON.stringify(saved));try{return fn();}finally{S=saved;}}

/* ===================== FICHES ANALYSTE ===================== */
function peekR(k,y){
  const pd=S.pending[y]&&S.pending[y][k];
  if(pd!=null)return pd/100;
  const f=S.fut[y];if(!f||f.r[k]==null)return null;
  return f.r[k];
}
function fwdScore(a){
  const r=peekR(a,S.year),rt=peekR('tracker',S.year);
  if(r==null||rt==null)return 0;
  return clamp((r-rt)/.12,-1,1);
}
function makeFiche(a,s){
  const pg=clamp(.5+.4*s,.08,.92),u=(lo,hi)=>lo+rnd()*(hi-lo),sg=x=>(x>=0?'+':'−')+f1(Math.abs(x))+' %';
  const rows=[],m=(k,good,bad,r)=>rows.push({k,v:rnd()<pg?good():bad(),r});
  if(THEMES.includes(a)){
    m('Clients qui renouvellent',()=>Math.round(u(82,96))+' %',()=>Math.round(u(45,72))+' %','> 80 %');
    m('Croissance des ventes',()=>sg(u(40,120)),()=>sg(u(-10,18)),'> 30 %');
    m('Trésorerie des sociétés du fonds',()=>f1(u(3,6))+' ans',()=>Math.round(u(8,18))+' mois','> 2 ans');

    m('Couverture des intérêts',()=>f1(u(6,18))+' x',()=>f1(u(1.1,2.8))+' x','> 4 x');

    m(a==='banque'?'Croissance du PNB':'Croissance du chiffre d’affaires',()=>sg(u(3,12)),()=>sg(u(-14,1)),'> 0 %');
  }

// Tirage de la phase de l'année : matrice de transition, modulée par les excès visibles dans la Gazette
// (crédit qui gonfle, Bourse chère, courbe des taux inversée, choc pétrolier).
function drawPhase(w,exo){
  const P={...TRANS[w.phase]};
  if(w.phase!=='crise'){
    P.crise=(P.crise||0)+.025*Math.max(0,w.cg-3)+(w.pe>22?.04:0);
    if(w.r10<w.rate)P.recession=(P.recession||0)+.15;
    if(exo==='energie')P.recession=(P.recession||0)+.25;
  }
  if(w.infl>4&&P.surchauffe!=null)P.surchauffe+=.1;
  let tot=0;for(const k in P)tot+=P[k];
  let x=rnd()*tot;for(const k in P){x-=P[k];if(x<=0)return k;}
  return w.phase;
}
// Risque de crise dans les deux ans, tel qu'une étude indépendante peut l'estimer à partir de l'état du monde.
function crisisRisk(w){return .04+.025*Math.max(0,w.cg-3)+(w.pe>22?.04:0)+(w.r10<w.rate?.05:0)+(w.phase==='surchauffe'?.06:0);}
const isElection=y=>y>Y0&&(y-(Y0+1))%5===0;
function makeElection(){
  const ks=Object.keys(PARTIS),a=pick(ks),b=pick(ks.filter(k=>k!==a));
  const A={...newPres(a),prog:PROG[a]()},B={...newPres(b,A.nom),prog:PROG[b]()};
  const s=clamp(50+gauss()*4,38,62);A.poll=Math.round(s);B.poll=100-A.poll;
  const winA=rnd()<1/(1+Math.exp(-(s-50)/2.5));
  return {A,B,win:winA?'A':'B'};
}
// Génère l'année y à partir de l'état connu fin y-1 (S.w) : phase, macroéconomie, rendements de tous les actifs.
// Le joueur ne voit que la Gazette (état passé et signaux) ; les rendements restent cachés jusqu'au bilan.
function genYear(y){
  const w=S.w,f={y,exo:null,shock:null,d:0};
  const ex=y===Y0?1:rnd(); // la première année est calme : le temps de découvrir la Gazette
  if(ex<.012&&y-(S.flags.lastPand||0)>15){f.exo='pandemie';S.flags.lastPand=y;}
  else if(ex<.047)f.exo='energie';
  else if(ex<.067)f.exo='guerre';
  f.phase=y===Y0?'expansion':f.exo==='pandemie'?'crise':drawPhase(w,f.exo);
  const PH=PHASES[f.phase];
  if(f.phase==='crise'){
    f.cause=f.exo==='pandemie'?'pandemie':w.cg>4?'credit':w.pe>21?'bulle':pick(['credit','bulle','assureur']);
    f.d=Math.round(f.exo==='pandemie'?30+rnd()*10:25+rnd()*20);
  }
  if(isElection(y))f.elec=makeElection();
  const E=f.elec?f.elec[f.elec.win]:null,react=E?E.prog.react:{t:0,b:0,sp:0};
  // macroéconomie
  const g=PH.g+gauss()*PH.gs+(f.exo==='pandemie'?-5:0)+(f.exo==='energie'?-.8:0);
  const infl=clamp(w.infl+.35*(2-w.infl)+PH.ip+gauss()*.45+(f.exo==='energie'?2.5:0)+(f.exo==='guerre'?.6:0),-1,12);
  const taylor=Math.max(0,2+1.5*(infl-2)+.5*(g-1.3));
  let rate=w.rate+.55*(taylor-w.rate);if(f.phase==='crise')rate=Math.min(rate,w.rate*.4);
  rate=clamp(Math.round(rate*4)/4,0,9);
  S.pol.spreadAdj=S.pol.spreadAdj*.7+react.sp;
  const debt=clamp(w.debt+S.pol.deficit+PH.def-(g+infl)*w.debt/100,40,250);
  if(debt>130&&S.pol.deficit>2)S.pol.deficit=Math.max(2,S.pol.deficit-.1); // les marchés imposent la rigueur
  const spread=clamp(.3+.015*Math.max(0,debt-100)+(f.phase==='crise'?.4:0)+S.pol.spreadAdj+gauss()*.1,.1,6);
  const r10=clamp(.5*rate+1+PH.tp+spread+gauss()*.2,0,14);
  const credit=Math.max(.8,.5*w.credit+.5*(r10+.2));
  const livret=Math.max(.5,Math.round((w.infl+w.rate)/2*10)/10);
  const euros=Math.max(.5,.7*w.euros+.3*r10*.9);
  const u=clamp(w.u+PH.du+.15*(7.5-w.u)+gauss()*.3,3.5,15);
  let cg=w.cg;if(f.phase==='crise')cg*=.3;else if(f.phase==='recession')cg*=.75;else cg+=PH.cg+.3*(2.5-w.rate)+gauss()*.3;cg=clamp(cg,-2,12);
  const oil=clamp(w.oil*Math.exp(gauss()*.18+.25*Math.log(70/w.oil))*(f.exo==='energie'?1.8:1)*(f.exo==='guerre'?1.25:1)*(f.phase==='crise'?.7:1),20,250),dOil=oil/w.oil-1;
  const fx=clamp(w.fx*Math.exp(gauss()*.06+.3*Math.log(1.15/w.fx))*(f.phase==='crise'?.94:1),.8,1.6);
  // marché actions : phase + valorisation (une Bourse chère rapporte moins ensuite) + dérive propre à la partie
  const m=PH.m+gauss()*PH.ms-.04*Math.log(w.pe/16)+S.drift.mkt+(f.exo==='guerre'?-.06:0);
  if(f.d){const d=f.d;
    f.shock=f.cause==='pandemie'?{tracker:-d,monde:-d*.9,telecom:-d*.6,luxe:-d*1.1,banque:-d*1.3,petro:-d*1.4,aero:-d*1.8,pharma:10,or:5}
      :{tracker:-d,monde:-d*.95,telecom:-d*.8,luxe:-d*1.1,banque:-d*(f.cause==='credit'?1.6:1.3),petro:-d,aero:-d*1.3,pharma:-d*.5,or:6};
    THEMES.forEach((id,i)=>{const st=themeStage(S.th[i],y);if(st&&st!=='rumeur')f.shock[id]=-d*1.4;});}
  const r={};
  r.tracker=Math.max(-.6,m+.006+gauss()*.04+react.t);
  r.monde=Math.max(-.6,(1+m+.01+gauss()*.035+react.t*.2)*(w.fx/fx)-1);
  for(const s of STOCKS){const p=SP[s];let x=p.d+.015+p.b*(m-.08)+gauss()*p.v+S.drift[s];
    if(s==='petro')x+=.5*dOil-(E&&E.prog.carbon?.15:0);
    if(s==='aero')x-=.3*dOil+(f.exo==='pandemie'?.25:0)+(E&&E.prog.carbon?.08:0);
    if(s==='banque')x+=react.b+.03*((r10-rate)-(w.r10-w.rate));
    if(s==='telecom')x-=.02*(r10-w.r10);
    r[s]=clamp(x,-.85,3);}
  r.or=.035+gauss()*.13-.3*(m-.08)+(f.phase==='crise'?.06:0)+.01*(infl-2);
  r.oat=w.r10/100-7*(r10-w.r10)/100+gauss()*.004;
  THEMES.forEach((id,i)=>{const T=S.th[i],st=themeStage(T,y);let x=0;
    if(st==='mature'||st==='zombie')x=(st==='mature'?.045:-.02)+1.3*(m-.08)+gauss()*.22;
    else if(st&&st!=='rumeur'){const [a,b,sd]=TR[st];x=(T.ok?a:b)+.8*(m-.08)+gauss()*sd;}
    r[id]=clamp(x,-.9,3);});
  // valorisation de la Bourse de Paris (PER) : prix contre bénéfices
  const tot=(1+(f.shock?f.shock.tracker/100:0))*(1+r.tracker)-1,eps=PH.eps+gauss()*.03;
  const pe=clamp(w.pe*(1+tot-.03)/(1+eps),7,40);
  // immobilier : inflation, variation des taux de crédit, cycle, puis sensibilité propre à chaque ville
  const gH=.7*infl/100+.012-1.8*(credit-w.credit)/100+PH.h+gauss()*.025;
  const gB={},rg={};
  for(const k in BIENS){const B=BIENS[k];
    gB[k]=B.k==='bur'?gH*B.beta-.01+gauss()*.04:gH*B.beta+S.drift['b_'+k]+gauss()*.012;
    rg[k]=(B.k==='bur'?(infl-.5)/100:Math.min(infl,3.5)/100)+B.rentG;}
  f.r=r;
  f.mac={phase:f.phase,g,infl,rate,r10,spread,credit,livret,euros,u,cg,oil,fx,pe,debt,gH,gB,rg};
  return f;
}

const progTax=pr=>(pr.ir??S.pol.ir)+(pr.ps??S.pol.ps);
function progText(pr){
  const p=S.pol,t=[],tax=progTax(pr);
  if(Math.abs(tax-ctoRate())>.001)t.push(`flat tax ${tax>ctoRate()?'relevée':'abaissée'} à ${f1(tax*100)} %`);
  if(pr.peaCap>p.peaCap)t.push(`plafond du PEA porté à ${fmt(pr.peaCap)}`);
  if(pr.age!=null&&pr.age!==p.ageLegal)t.push(`retraite à ${pr.age} ans`);
  if(pr.livCap>p.livCap)t.push(`Livret A plafonné à ${fmt(pr.livCap)}`);

  if(pr.carbon)t.push('taxe carbone renforcée');
  t.push(pr.deficit<0?'réduction du déficit':'relance par la dépense publique');
  return t.join(', ');
}
function applyProg(pr){
  const p=S.pol;
  if(pr.ir!=null)p.ir=pr.ir;if(pr.ps!=null)p.ps=pr.ps;if(pr.age!=null)p.ageLegal=pr.age;if(pr.irLoyer!=null)p.irLoyer=pr.irLoyer;

}

function pickW(list){const tot=list.reduce((a,x)=>a+x.w,0);let r=rnd()*tot;for(const x of list){r-=x.w;if(r<=0)return x.id;}return list[list.length-1].id;}
// Une année sur trois environ n'a pas d'événement : la Gazette suffit.
function pickEvent(y,f){
  if(y===Y0)return null;
  if(f.cause==='pandemie')return 'pandemie';
  if(f.phase==='crise')return 'krach';
  if(f.elec)return 'election';
  if(f.exo==='energie'||f.exo==='guerre')return f.exo;
  const last=S.usedFut[S.usedFut.length-1];
  const el=Object.keys(EVT).filter(id=>!EVT[id].forced&&id!==last).map(id=>({id,w:EVT[id].w(y,f)})).filter(x=>x.w>0);
  el.push({id:null,w:5});
  return pickW(el);
}

function retireOpts(){
  const L=S.pol.ageLegal,g=a=>a<L?.30:a<L+2?.24:.18;
  const ys=[...new Set([S.year,Y0+(L-25),Y0+(L-25)+3].filter(y=>y>=S.year&&y<=YN))];
  return ys.map(y=>({y,gap:g(age(y)),dh:age(y)<L?15:age(y)>=L+3?-8:0}));
}

function headline(y){
  const w=S.w,P0=S.wPrev,f=S.fut[y],ev=S.event&&S.event.id,c=[],H=(t,ch)=>c.push({t,c:ch});
  const prev=S.page&&S.page.head&&S.page.head.t,r=S.me.raise,lag=r!=null&&r*100<w.infl-.05;
  if(y===Y0)return {t:'Bienvenue dans la vie active',c:''};
  if(ev==='pandemie')H('Un virus met le pays à l’arrêt','Écoles fermées, rideaux baissés.');
  if(ev==='krach')H(pick(['Panique sur les marchés','Le grand plongeon','Lundi noir à la Bourse']),'Tout le monde parle de sa banque.');
  if(f.exo==='energie')H('Le pétrole s’envole, le plein aussi','On fait la queue aux stations.');
  if(f.exo==='guerre')H('La guerre aux portes de l’Europe','Le prix du gaz inquiète.');
  if(w.phase==='crise')H('Après la tempête, on compte les dégâts',`Le chômage atteint ${f1(w.u)} %.`);
  if(w.phase==='recession')H(P0&&P0.phase==='recession'?'La récession s’installe':'La France entre en récession','Les entreprises gèlent les embauches.');
  if(w.phase==='reprise')H(pick(['La reprise est là','Le moral revient','Ça repart']),'Les entreprises recommencent à embaucher.');
  if(f.elec)H(`Présidentielle : ${f.elec.A.name} contre ${f.elec.B.name}`,'On vote en avril.');
  if(w.infl>3.5)H(`Tout augmente : ${f1(w.infl)} % d’inflation`,lag?'Les prix grimpent plus vite que les salaires.':'Les salaires suivent, de justesse.');
  if(w.pe>22)H('La Bourse bat record sur record','Tout le monde en parle à la machine à café.');
  if(w.cg>4&&P0&&w.cg>P0.cg)H(w.credit<4?'Crédit facile : tout le monde emprunte':'Tout le monde s’endette, malgré des taux élevés','Les anciens disent que ça finit rarement bien.');
  if(P0&&w.credit<=P0.credit-.4)H(w.credit<3.5?'Les taux de crédit fondent':'Le crédit baisse enfin',`Emprunter sur 20 ans coûte ${rate(w.credit)}.`);
  if(w.r10<w.rate)H('Les taux font un drôle de signal','Les économistes y voient souvent l’annonce d’une récession.');
  if(w.phase==='surchauffe')H('L’économie tourne à plein régime','Mais les prix commencent à grimper.');
  H(pick(['Une année sans histoire','L’économie avance à petits pas','Ni crise ni euphorie'].filter(t=>t!==prev)),'');
  return c.find(x=>x.t!==prev)||c[0];
}
const kidAge=k=>S.year-k.born;
function kidLine(k){
  const a=kidAge(k),n=k.n;
  if(a<=0)return `${n} vient d’arriver. On ne dort plus, mais quel bonheur.`;
  if(a<=2)return pick([`${n} fait ses premiers pas dans le salon.`,`${n} a ${a} an${a>1?'s':''} et des nuits encore courtes.`]);
  if(a<=5)return pick([`${n} a ${a} ans et dit « non » à tout.`,`${n} a ${a} ans et dessine sur tous les murs.`]);
  if(a<=10)return pick([`${n} a ${a} ans et adore l’école.`,`${n} a ${a} ans : les devoirs du soir, la fête de l’école.`]);
  if(a<=17)return pick([`${n} a ${a} ans : l’adolescence, les portes qui claquent.`,`${n} a ${a} ans et veut un téléphone neuf.`]);
  if(a<=24)return `${n} fait ses études. Ça coûte, mais on est fiers.`;
  return `${n} vole de ses propres ailes et passe le dimanche.`;
}
function makeNotes(y,head,imp){
  const w=S.w,n=[],r=S.me.raise,ret=retired(y),me=S.me;
  if(y===Y0){n.push({i:'maison',t:'Premier jour de ma vie d’adulte. Un salaire, un budget, et tout à construire.'});return n;}
  n.push({i:'eco',t:`Au journal : « ${head.t} ».${head.c?' '+head.c:''}`});
  if(ret)n.push({i:'argent',t:pick(['La retraite : du temps pour soi, mais l’œil sur le budget.','Plus de réveil le matin. On profite, en surveillant les comptes.'])});
  else if(r!=null){const dep=monthlySpend()*w.infl/(100+w.infl);
    n.push({i:'argent',t:r<.0005?(w.infl>.5?`Pas d’augmentation cette année, alors que les prix ont pris ${f1(w.infl)} %.`:'Pas d’augmentation cette année, mais les prix ne bougent pas.'):`Augmentation de ${f1(r*100)} % : ${fmt(S.revenu*r/(1+r)/12)} de plus par mois.${w.infl>1.5?` Les courses, elles, coûtent ${fmt(dep)} de plus.`:''}`});}
  if(me.kids&&me.kids.length)n.push({i:'famille',t:kidLine(me.kids[y%me.kids.length])});
  if(P()){const rel=me.relation;n.push({i:'coeur',t:rel>=70?pick([`${P()} et moi, toujours aussi complices.`,`Un dimanche au marché avec ${P()} : le bonheur simple.`]):rel>=40?pick([`Avec ${P()}, la routine s’installe.`,`${P()} et moi, on se voit surtout le soir, fatigués.`]):pick([`Avec ${P()}, on se parle peu en ce moment.`,`Des disputes pour des broutilles avec ${P()}.`])});}
  else n.push({i:'coeur',t:me.humeur>=60?pick(['Célibataire, et plutôt bien comme ça.','Des amis, des sorties : la vie de célibataire a du bon.']):'Les dimanches sont longs quand on vit seul·e.'});
  const h=S.home;
  if(h&&h.type==='parents')n.push({i:'maison',t:P()?`Toujours chez les parents. ${P()} rêve d’un chez-nous.`:'Toujours chez mes parents. Pratique, mais j’ai hâte d’avoir mon chez-moi.'});
  else if(homeCap()<need())n.push({i:'maison',t:`${homeName()} devient trop petit : on se marche dessus.`});
  else if(h&&h.own){const rp=rpOf();if(rp&&rp.loan&&rp.loan.n>0)n.push({i:'maison',t:`Encore ${rp.loan.n} an${rp.loan.n>1?'s':''} de crédit pour notre logement : ${fmt(loanAnn(rp)/12)} par mois.`});}
  else if(h&&h.type!=='coloc'&&S.wPrev)n.push({i:'maison',t:`Le loyer passe à ${fmt(homeCost()/12)} par mois.`});
  if(imp)n.push({i:'argent',t:`${imp.t} : ${fmt(imp.c)}.${imp.note||''}`});
  if(me.humeur<35&&!ret)n.push({i:'coeur',t:'Je dors mal. Il faudrait que je prenne soin de moi.'});
  return n.slice(0,6);
}
// Un pépin dans l'année : payé tout de suite, comme dans la vraie vie.
function imprevu(y){
  if(y===Y0||rnd()>.3)return null;
  const L=[{t:'Le lave-linge a rendu l’âme',c:700},{t:'Une couronne chez le dentiste',c:900},{t:'Le frigo nous a lâchés',c:800},{t:'L’ordinateur ne s’allume plus',c:900}];
  if(S.home&&S.home.own){L.push({t:'La chaudière est à changer',c:4000},{t:'Fuite dans la salle de bain',c:2500});if(BIENS[S.home.type].cap>=5)L.push({t:'La toiture doit être refaite',c:9000});}
  const x=pick(L),c=Math.round(x.c*S.defl/10)*10;
  return {t:x.t,c,note:spend(c,true)};
}
// Conseils de bon gestionnaire, tirés de l'état connu et de ton portefeuille (jamais du futur). Fonction pure.
function conseils(){
  const w=S.w,P0=S.wPrev,y=S.year,a=alloc(),T=finT(a),eqs=eqShare(),out=[],add=(t,btn)=>out.push({t,btn});
  const crash=S.event&&EVT[S.event.id].crash,risk=crisisRisk(w),cs=coussin();
  if(crash)add('Krach : la Bourse remonte en général avant l’économie, souvent dès l’année suivante. Vendre maintenant fige la perte.',isIdle()&&S.profile!=null?{act:'place',label:'Placer l’argent qui dort'}:null);
  if(cs<3&&!retired(y))add(`Ton coussin de sécurité ne couvre que ${f1(cs)} mois de dépenses. Vise 3 à 6 mois sur le Livret A avant d’investir : un pépin ne t’obligera pas à vendre au mauvais moment.`,{act:'tip-tab',tab:'liv',label:'Aller au Livret A'});
  if(isIdle()&&!S.lock&&cs>=3){const idle=idleAmt();add(`${fmt(idle)} dorment sans rien rapporter.${w.infl>2?` Avec ${f1(w.infl)} % d’inflation, ils perdent environ ${fmt(idle*w.infl/100)} par an.`:''}`,
    S.profile!=null?{act:'place',label:`Placer selon mon profil (${pc0(S.profile)} actions)`}:{act:'tip-prof',p:.5,label:'Choisir un profil équilibré'});}
  if(homeCap()<need())add(`À ${need()} dans ${homeName().toLowerCase()}, on se marche dessus : l’humeur et le couple en pâtissent chaque année.`,{act:'tip-home',label:'Voir les logements'});
  if(!crash&&risk>=.1&&eqs>.65&&T>10000){const why=[w.r10<w.rate?'courbe des taux inversée':'',w.cg>4?'crédit trop gonflé':'',w.pe>22?'Bourse chère':'',w.phase==='surchauffe'?'économie en surchauffe':''].filter(Boolean).join(', ');
    add(`Plusieurs voyants sont à l’orange (${why}) : une forte baisse devient plus probable. Avec ${pc0(eqs)} d’actions, une chute de 35 % te coûterait environ ${fmt(.35*a.eq)}. Si ça t’empêche de dormir, allège.`,{act:'tip-prof',p:.5,label:'Voir les ordres pour 50 % d’actions'});}
  if(w.pe<11&&eqs<.7&&T>5000)add(`La Bourse est bradée (${f1(w.pe)} fois les bénéfices, contre 15 en moyenne). Acheter bon marché paie souvent sur dix ans.`,{act:'tip-prof',p:.8,label:'Voir les ordres pour 80 % d’actions'});
  const rn=S.props.find(canReneg);
  if(rn)add(`Les taux ont baissé : renégocier ton crédit à ${rate(curCredit())} ferait baisser tes mensualités (frais : ${fmt(rn.loan.p*.01)}).`,{act:'reneg',u:rn.uid,label:'Renégocier'});
  if(S.acc.pea.open==null&&y<=YN-5&&!retired(y)&&cs>=3)add('Ton PEA n’est pas ouvert. Ses 5 ans avant l’exonération ne démarrent qu’au premier versement : ouvre-le tôt, même avec un petit montant.',{act:'tip-tab',tab:'pea',label:'Aller au PEA'});
  if(P0&&w.rate-P0.rate>=.75&&hv('oat')>500)add('La BCE monte ses taux : tes fonds OAT perdent de la valeur quand les taux grimpent. Le Livret A et le fonds euros, eux, vont mieux rapporter.',null);
  if(w.credit<2.5&&!rpOf()&&!retired(y)&&age(y)<55)add(`Le crédit ne coûte que ${rate(w.credit)} : c’est quand les taux sont bas qu’acheter sa résidence principale coûte le moins cher en intérêts.`,{act:'tip-home',label:'Voir les logements'});
  for(const id of [...STOCKS,...THEMES,'jeton','or']){const v=hv(id);if(T>5000&&v>.25*T){add(`${nm(id)} pèse ${pc0(v/T)} de ton épargne. Une seule mauvaise nouvelle et c’est tout ton patrimoine qui trinque.`,null);break;}}
  S.th.forEach((Th,i)=>{if(themeStage(Th,y)==='bulle'&&hv(THEMES[i])>500)add(`Le ${Th.f} s’envole. Les bulles finissent par éclater, personne ne sait quand : encaisser une partie des gains limite la casse.`,null);});
  if(w.infl>3.5&&a.safe>.5*Math.max(1,T))add(`Avec ${f1(w.infl)} % d’inflation, l’argent garanti (Livret A, fonds euros) rapporte moins que la hausse des prix.`,null);
  if(!out.length)add('Rien d’urgent cette année. Le meilleur réflexe : garder le cap, placer ton épargne et ne pas réagir aux gros titres.',null);
  return out.slice(0,3);
}
// Pense-bêtes : les échéances à ne pas oublier (fonction pure).
function rappels(){
  const y=S.year,out=[],f=S.flags;
  if(f.pretAmi)out.push(`Le prêt à mon ami : il a promis de rembourser en ${f.pretAmi.y}.`);
  if(f.startup&&f.startup.end>=y)out.push(`${f.startup.name} : revente prévue fin ${f.startup.end}.`);
  if(f.struct&&f.struct.end>=y&&hv('struct')>0)out.push(`Fonds Rendement Sérénité bloqué jusqu’à fin ${f.struct.end}.`);
  if(S.acc.pea.open!=null&&y<S.acc.pea.open+5)out.push(`Mon PEA aura 5 ans en ${S.acc.pea.open+5} : après, retraits presque sans impôt.`);
  if(S.acc.av.open!=null&&y<S.acc.av.open+8)out.push(`Mon assurance-vie aura 8 ans en ${S.acc.av.open+8}.`);
  if(!retired(y)&&S.me.retireYear==null&&age(y)>=55)out.push(`Retraite à taux plein à ${S.pol.ageLegal} ans, en ${Y0+S.pol.ageLegal-25}.`);
  return out.slice(0,3);
}

};
const achatCost=id=>Math.round(ACHATS[id].cost()*S.defl/10)*10;
function achatState(id){
  const A=ACHATS[id],y=S.year,hist=(S.buyHist&&S.buyHist[id])||[];
  if(A.can&&!A.can())return null;
  const recent=hist.filter(x=>x>=y-2&&x<y).length,f=1/(1+recent),c=achatCost(id),done=hist.includes(y);
  const k=id==='voiture'&&!cityOf().car?.4:1;
  return {c,f:f*k,done,ok:!done&&Math.max(0,S.cash)+S.liv>=c,recent};
}
function acheter(id){
  const s=achatState(id);if(!s)return 'Pas possible dans ta situation.';
  if(s.done)return 'Déjà fait cette année.';
  if(!s.ok)return `Il te faut ${fmt(s.c)} sur ton compte courant ou ton Livret A.`;
  if(S.cash<s.c)livOut(s.c-S.cash);
  ext(-s.c);const A=ACHATS[id];mood(A.h*s.f,A.r*s.f);
  if(id==='voiture')S.me.car=true;
  if(id==='sorties'&&!P())S.flags.rencBoost=S.year;
  (S.buyHist||(S.buyHist={}))[id]=((S.buyHist[id])||[]).concat([S.year]);
  if(S.page)S.page.spent=(S.page.spent||0)+s.c;
  save();return null;
}

function recoHome(opts){
  const sp=monthlySpend(),fit=o=>o.ok&&!o.warn;
  const buy=opts.filter(o=>o.kind==='buy'&&fit(o)&&o.left>=3*sp&&o.q.eff<=.33&&o.reste>=150*S.defl).sort((a,b)=>a.cost-b.cost)[0];

  const rent=opts.filter(o=>o.kind==='rent'&&!['parents','coloc'].includes(o.type)&&fit(o)).sort((a,b)=>a.cost-b.cost)[0];

const finLiquid=()=>Math.max(0,S.cash)+S.liv+envTotal('cto')+envTotal('pea')+envTotal('av');
function pickLife(crash){
  const f=S.fut[S.year],y=S.year;
  if(S.me.humeur<=18)return 'burnout';
  if(P()&&S.me.relation<=10)return 'rupture';
  if(y>=Y0+37&&S.me.retireYear==null)return 'retraite';

  if(!d.props.length&&!d.fin.length)return '<p class="mut">Aucun investissement pour l’instant.</p>';
  return `${invTable('Immobilier',d.props,'Valeur nette')}${invTable('Placements financiers',d.fin,'Valeur actuelle')}${invTable('Enveloppes fiscales',d.envs,'Valeur actuelle')}

}

  let ids;
  if(tab==='liv')ids=['livret'];

    if(m.k==='special')return tab==='cto'&&S.acc.cto.hold[id]&&(S.acc.cto.hold[id].v>0||S.acc.cto.hold[id].b>0);

function niceTicks(lo,hi){
  const t=[];for(let e=3;e<=10;e++)for(const m of [1,2.5,5]){const v=m*Math.pow(10,e);if(v>=lo&&v<=hi)t.push(v);}
  return t.length>6?t.filter((_,i)=>i%2===0):t;
}
const kfmt=v=>v>=1e6?(v/1e6).toLocaleString('fr-FR')+' M€':(v/1e3).toLocaleString('fr-FR')+' k€';
function chart(hist,h=230){
  const W=640,Hh=h,L=62,R=14,T=12,B=26;
  const x0=Y0,x1=Math.max(Y0+5,hist[hist.length-1].x);
  const vals=hist.flatMap(d=>[d.net,d.liv,d.trk]).filter(v=>v>0);
  let lo=Math.min(...vals)*.85,hi=Math.max(...vals)*1.15;if(hi/lo<3)lo=hi/3;lo=Math.max(lo,1000);
  const X=x=>L+(W-L-R)*(x-x0)/(x1-x0),Y=v=>T+(Hh-T-B)*(1-(Math.log(Math.max(v,lo))-Math.log(lo))/(Math.log(hi)-Math.log(lo)));
  const path=k=>hist.map((d,i)=>`${i?'L':'M'}${X(d.x).toFixed(1)},${Y(d[k]).toFixed(1)}`).join('');
  const yt=niceTicks(lo,hi).map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${kfmt(v)}</text>`).join('');
  const xt=TICKS.filter(t=>t<=x1).map(t=>`<text x="${X(t)}" y="${Hh-6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${t}</text>`).join('');
  const last=hist[hist.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Évolution du patrimoine">${yt}${xt}
    <path d="${path('liv')}" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="2 4"/>
    <path d="${path('trk')}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="6 4"/>
    <path d="${path('net')}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="${X(last.x)}" cy="${Y(last.net)}" r="4" fill="var(--accent)"/></svg>
    <div class="legend"><span><i></i>Ton patrimoine net</span><span><i class="t"></i>Mêmes versements que toi, tout sur l’ETF Monde</span><span><i class="l"></i>Mêmes versements, tout sur le Livret A sans plafond</span></div></div>`;
}

function coups(){
  const d=invData(),rows=[...d.props,...d.fin].filter(x=>x.inv>=1000);
  const best=rows.filter(x=>x.gain>0).sort((a,b)=>b.gain-a.gain).slice(0,3),worst=rows.filter(x=>x.gain<0).sort((a,b)=>a.gain-b.gain).slice(0,3);
  return {best,worst};
}
function epilogue(){
  const A=ARCH[S.arch]||ARCH.heritier,c=coups(),t=[];
  t.push(`${A.n} de ${Y0} a aujourd’hui 75 ans.`);
  if(P())t.push(`${S.me.marie?'Marié·e':'En couple'} avec ${P()}${S.me.enfants?`, ${S.me.enfants} enfant${S.me.enfants>1?'s':''}`:''}${S.me.ruptures?`, après ${S.me.ruptures} rupture${S.me.ruptures>1?'s':''}`:''}.`);
  else t.push(S.me.ruptures?`Seul·e, après ${S.me.ruptures} rupture${S.me.ruptures>1?'s':''}.`:'Toujours célibataire.');
  if(S.flags.rpYear)t.push(`Propriétaire de sa résidence principale depuis ${S.flags.rpYear}.`);
  if(S.me.retireYear)t.push(`A cessé de travailler à ${age(S.me.retireYear)} ans.`);
  const short=x=>x.name.replace(' (résidence principale)','');
  if(c.best[0])t.push(`Son plus beau coup : ${short(c.best[0])}, +${fmt(c.best[0].gain)}.`);
  if(c.worst[0])t.push(`Son pire : ${short(c.worst[0])}, −${fmt(-c.worst[0].gain)}.`);
  if(S.flags.panicSold)t.push('Il reste le souvenir amer d’une vente dans la panique.');
  if(S.me.ruined)t.push('Les dernières années ont été serrées : le patrimoine n’a pas suffi à compléter la pension.');
  return t.join(' ');
}

    <div class="sec-h"><h2>Succès</h2><span class="mut">${Object.keys(S.ach||{}).length} / ${ACH.length}</span></div>
    <div class="achs">${ACH.map(a=>{const y=(S.ach||{})[a.id];return `<div class="ach ${y?'on':'off'}"><b>${a.n}</b><span>${a.d}</span>${y?`<span class="small mut">Débloqué en ${y}</span>`:''}</div>`;}).join('')}</div>
    <div class="sec-h"><h2>Tes investissements</h2></div>${invBody()}
    <div class="sec-h"><h2>Ton journal de décisions</h2></div>
    <div class="journal">${S.log.map(l=>`<div><b>${l.y}</b><span><strong>${l.t}</strong><br><span class="mut">${l.r}</span></span></div>`).join('')}</div>
    <div class="btns"><button class="primary" data-act="replay">Rejouer</button></div></section>`;
}
function introView(){
  const st=U.setup,A=ARCH[st.arch];
  const archs=Object.entries(ARCH).map(([k,a])=>`<button class="archc" aria-pressed="${st.arch===k}" data-act="arch" data-k="${k}"><b>${a.n}</b><span class="small">${a.d}</span>
    <span class="kv"><span>Capital</span><span>${fmt(a.cash)}</span><span>Salaire</span><span>${fmt(a.rev)}/an</span><span>Épargne</span><span>${pc0(a.tx)} du salaire</span><span>Difficulté</span><span>${a.lvl} · ×${String(a.coef).replace('.',',')}</span></span></button>`).join('');
  const goals=Object.entries(GOALS).map(([k,g])=>`<button class="pchip" aria-pressed="${st.goals.includes(k)}" data-act="goal" data-k="${k}" title="${g.d}">${g.n} · +${pc0(g.bonus)}</button>`).join('');
  const L=U.legacy;
  const legacy=L?`<div class="idle"><span><strong>Nouvelle saison.</strong> Ta partie de l’ancienne version (2000-2050) s’arrête ici, en ${L.year}, avec un patrimoine de ${fmt(L.net)}. Le jeu se joue désormais dans un monde inventé à chaque partie.</span><button class="secondary" data-act="legacy-ok">Compris</button></div>`:'';
  return `${legacy}<section class="intro"><div class="setup">
    <p class="kicker">1er janvier ${Y0} · tu as 25 ans</p><h2>Cinquante ans de marchés t’attendent.</h2>
    <p class="lede">Un monde inventé à chaque partie : cycles, krachs, bulles, élections, révolutions technologiques. Ta famille, ton logement, tes placements : chaque année s’écrit dans ton carnet, et Sophie, ta cousine, t’accompagne.</p>
    <div class="sec-h"><h2>Choisis ton personnage</h2></div><div class="archs">${archs}</div>
    <div class="sec-h"><h2>Choisis 2 objectifs de vie</h2><span class="mut">Plus l’objectif est dur, plus il rapporte</span></div>
    <div class="profiles">${goals}</div>
    <p class="small mut">${st.goals.map(g=>`<b>${GOALS[g].n}</b> : ${GOALS[g].d}`).join('<br>')||'Aucun objectif choisi.'}</p>
    <div class="btns"><button class="primary" data-act="start">Commencer avec ${A.n.toLowerCase()} →</button></div></div>
    <div class="rules"><span class="lbl">Règles</span><ul>
      <li>Au départ, Sophie t’aide en 5 étapes : ta ville, ton logement (louer ou acheter selon tes moyens), ton épargne de sécurité, ton profil, ton premier portefeuille.</li>
      <li>Un tour = une page de ton carnet : les nouvelles de la famille, ton salaire, tes dépenses, l’économie, et les décisions de l’année. Le classeur range tes placements et ton logement.</li>
      <li>Ton budget est réel : loyer ou mensualités, voiture, enfants, imprévus. Ce qui reste, tu l’épargnes ; avec un coussin trop mince, tu stresses.</li>
      <li>Les crises naissent des excès : crédit qui gonfle, Bourse trop chère, taux qui s’inversent. Elles finissent toujours par passer.</li>
      <li>Tous les cinq ans, une présidentielle peut changer la flat tax, le PEA, le Livret A ou l’âge de la retraite.</li>
      <li>Trois enveloppes : compte-titres, PEA (fiscalité douce après 5 ans) et assurance-vie (après 8 ans). Plus le Livret A et l’immobilier à Lille, Lyon ou Paris.</li>
      <li>Tu épargnes une part de ton salaire chaque année. Vers 62-67 ans, tu prends ta retraite et tu puises dans ton patrimoine.</li>
      <li>Humeur et couple comptent : moral bas, burn-out et ventes paniques ; couple négligé, rupture coûteuse.</li>
      <li>Score final : ton patrimoine en euros de ${Y0} × ton bien-être moyen × tes objectifs atteints × la difficulté de ton personnage. ${ACH.length} succès à débloquer.</li></ul></div></section>`;
}
function animHtml(){
  const b=S.bilans[U.anim.i];if(!b)return '';
  const fl=(b.flows.epargne||0)+(b.flows.retraite||0),dl=b.netEnd-b.netStart,mk=b.netStart>0?(dl-fl)/b.netStart:0;
  const tick=b.r?Object.entries(b.r).filter(([k,v])=>v!=null).map(([k,v])=>`${nm(k).toUpperCase()} ${pct(v)}`).join('   ·   '):'';
  const achs=Object.entries(S.ach||{}).filter(([id,y])=>y===b.y).map(([id])=>`<li class="anim-ach">Succès débloqué : ${ACHM[id].n}</li>`).join('');
  return `<div class="anim ${mk<-.1?'crash':''}" role="status" aria-live="polite"><div class="anim-in">
    <span class="lbl">La Bourse tourne · ${PHASES[b.phase].n}</span><div class="anim-y">${b.y}</div>
    <div class="anim-net" id="anim-net">${fmt(b.netStart)}</div><div class="anim-pct ${cls(dl)}">${dl>=0?'+':'−'}${fmt(Math.abs(dl))} sur l’année${Math.abs(fl)>0.5?` · dont ${fl>=0?'+':'−'}${fmt(Math.abs(fl))} ${fl>=0?'d’épargne':'de retraits'}`:''}</div>
    <ul class="anim-notes">${b.notes.slice(0,2).map(n=>`<li>${n}</li>`).join('')}${achs}</ul>
    <button class="ghost" data-act="skip-anim">Passer →</button></div>${tick?`<div class="ticker" aria-hidden="true"><span>${tick}</span></div>`:''}</div>`;
}
function canAnim(){try{return typeof window!=='undefined'&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}}
function runAnim(){
  const tok=++U.animTok;if(!U.anim)return;
  const b=S.bilans[U.anim.i],el=document.getElementById('anim-net'),t0=performance.now(),D=800;
  const step=now=>{if(tok!==U.animTok||!U.anim)return;const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);if(el)el.textContent=fmt(b.netStart+(b.netEnd-b.netStart)*e);if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
  setTimeout(()=>{if(tok!==U.animTok||!U.anim)return;U.anim.i++;if(U.anim.i>=S.bilans.length)U.anim=null;render();if(U.anim)runAnim();},1400);
}
function render(){
  const app=document.getElementById('app');
  let body;
  if(!S)body=introView();
  else if(S.phase==='turn')body=turnView();
  else if(S.phase==='bilan')body=bilanView();
  else body=endView();
  app.innerHTML=header()+body+(U.anim&&S&&S.phase==='bilan'?animHtml():'');
}

/* ===================== ÉVÉNEMENTS DOM ===================== */
function availFor(e){return S.cash+(e==='pea'||e==='av'?S.acc[e].cash:0);}
function onClick(ev_){
  const t=ev_.target.closest('[data-act]');if(!t||t.disabled)return;
  const a=t.dataset.act,key=t.dataset.key;
  if(a!=='reset')U.confirmReset=false;
  if(a!=='prop-sell')U.confirmSell=null;
  if(a!=='pea-close')U.confirmClose=false;
  if(!['rebal-preview','rebal-ok','tip-prof'].includes(a))U.plan=null;
  if(!['place','rebal-ok'].includes(a))U.allocMsg=null;
  if(a!=='achat')U.achErr='';if(a!=='life')U.lifeErr='';if(!['home-rent','home-buy'].includes(a))U.homeMsg=null;
  const [e,id]=key?key.split(':'):[];
  switch(a){
    case 'start':dropLegacy();U.legacy=null;U.classeur=false;newGame(U.setup.arch,U.setup.goals,true);break;
    case 'onb-city':U.onbErr=onbCity(t.dataset.c)||'';save();break;
    case 'onb-home':U.onbErr=onbHome(+t.dataset.i)||'';save();break;
    case 'onb-cushion':{const m=+t.dataset.m;U.onbErr=(m?onbCushion(m):null)||'';if(!U.onbErr){S.onb=4;save();}break;}
    case 'onb-q':{const q=+t.dataset.q,a=+t.dataset.a;S.onbAns[q]=a;if(S.onbAns.filter(x=>x!=null).length===3)S.profile=onbProfile(S.onbAns);save();break;}
    case 'onb-next':U.onbErr='';if(S.onb===2&&!S.onbHome){U.onbErr='Choisis d’abord où tu vas vivre.';break;}onbNext();window.scrollTo({top:0});break;
    case 'onb-back':U.onbErr='';if(S.onb>1&&!(S.onb===2&&S.onbHome))S.onb--;break;
    case 'achat':U.achErr=acheter(t.dataset.a)||'';break;
    case 'classeur':U.classeur=!U.classeur;if(U.classeur)U.scroll='classeur';break;
    case 'tip-home':U.classeur=true;U.scroll='home';break;
    case 'home-rent':{const e=moveTo(t.dataset.t);U.homeMsg=e?{t:e}:{t:`Tu emménages : ${homeName()}.`,ok:true};save();break;}
    case 'home-buy':{const e=buyHome(t.dataset.t,U.dur||20);U.homeMsg=e?{t:e}:{t:`Te voilà propriétaire : ${homeName()}.`,ok:true};if(!e)spend(moveCost(),true);save();break;}
    case 'legacy-ok':dropLegacy();U.legacy=null;break;
    case 'arch':U.setup.arch=t.dataset.k;break;
    case 'goal':{const k=t.dataset.k,g=U.setup.goals;if(g.includes(k))U.setup.goals=g.filter(x=>x!==k);else U.setup.goals=[...g,k].slice(-2);break;}
    case 'skip-anim':U.anim=null;U.animTok++;break;
    case 'copy':{const txt=shareText();try{navigator.clipboard.writeText(txt).then(()=>{U.copied=true;render();},()=>{U.copied='fallback';render();setTimeout(()=>{const ta=document.getElementById('share-txt');if(ta)ta.select();},0);});}catch(er){U.copied='fallback';}break;}
    case 'tip-prof':{const p=+t.dataset.p;S.profile=p;U.plan={p,...dry(()=>rebalance(p))};U.classeur=true;U.scroll='alloc';save();break;}
    case 'tip-tab':U.tab=t.dataset.tab;U.open=null;U.envMsg={};U.classeur=true;U.scroll='book';break;
    case 'tip-desk':U.classeur=true;U.scroll='desk';break;
    case 'prof':S.profile=+t.dataset.p;save();break;
    case 'place':{if(S.profile==null||S.lock)break;const ops=[];placeIdle(S.profile,ops);U.allocMsg=ops.length?`Placé : ${ops.map(opText).join(' ; ')}.`:'Rien à placer.';save();break;}
    case 'rebal-preview':if(S.profile!=null){const p=S.profile;U.plan={p,...dry(()=>rebalance(p))};}break;
    case 'rebal-ok':{if(!U.plan)break;const r=rebalance(U.plan.p);U.allocMsg=`Portefeuille rééquilibré : ${pc0(r.after)} d’actions${r.tax>0.5?`, impôt ${fmt(r.tax)}`:''}.`;U.plan=null;save();break;}
    case 'rebal-cancel':U.plan=null;break;
    case 'replay':wipe();S=null;U.copied=null;break;
    case 'reset':if(U.confirmReset){U.confirmReset=false;wipe();S=null;}else U.confirmReset=true;break;
    case 'tab':U.tab=t.dataset.tab;U.open=null;U.envMsg={};break;
    case 'open':U.open=U.open===key?null:key;U.msg={};break;
    case 'fill':{const f=t.dataset.f;U.amt[key]=f==='pos'?Math.floor((e==='liv'?S.liv:ev(e,id))*100)/100:Math.floor(availFor(e)*+f);break;}
    case 'buy':{const v=+(U.amt[key]||0);const er=e==='liv'?livIn(v):buyIn(e,id,v);U.msg[key]=er?{t:er}:{t:`${e==='liv'?'Versement':'Achat'} de ${fmt(v)} exécuté.`,ok:true};if(!er)U.amt[key]='';save();break;}
    case 'sell':{const v=+(U.amt[key]||0);const r=e==='liv'?livOut(v):sellIn(e,id,v);U.msg[key]=r.err?{t:r.err}:{t:`${e==='liv'?'Retrait':'Vente'} de ${fmt(r.amt)} exécuté${r.tax>0.5?`, impôt ${fmt(r.tax)}`:''}${r.inEnv?', l’argent reste dans l’enveloppe':''}.`,ok:true};if(!r.err)U.amt[key]='';save();break;}
    case 'wd-all':U.wd[t.dataset.env]=Math.floor(S.acc[t.dataset.env].cash*100)/100;break;
    case 'wd':{const en=t.dataset.env,v=+(U.wd[en]||S.acc[en].cash);const r=withdraw(en,v);U.envMsg[en]=r.err?{t:r.err}:{t:`Retrait de ${fmt(r.amt)} vers ton compte courant${r.tax>0.5?`, impôt ${fmt(r.tax)}`:''}.`,ok:true};U.wd[en]='';save();break;}
    case 'pea-close':if(U.confirmClose){const r=withdraw('pea',0);U.envMsg.pea=r.err?{t:r.err}:{t:`PEA clôturé : ${fmt(r.amt-r.tax)} net sur ton compte courant (impôt ${fmt(r.tax)}).`,ok:true};U.confirmClose=false;save();}else U.confirmClose=true;break;
    case 'ev-fill':U.evAmt=Math.floor(availFor(U.evEnv)*+t.dataset.f);break;
    case 'ev-invest':{U.evErr=answerEvent('invest',U.evAsset,+(U.evAmt||0),U.evEnv)||'';if(!U.evErr)U.evAmt='';break;}
    case 'ev-pass':U.evErr=answerEvent('pass')||'';break;
    case 'ev-choice':U.evErr=answerEvent('choice',t.dataset.c)||'';break;
    case 'life':U.lifeErr=answerLife(t.dataset.c)||'';break;
    case 'prop-buy':{const er=buyProp(t.dataset.t,t.dataset.m,U.dur||20);U.deskErr=er?{t:er}:{t:`${BIENS[t.dataset.t].n} acheté.`,ok:true};save();break;}
    case 'prop-sell':{const u=+t.dataset.u;if(U.confirmSell===u){const c=sellProp(u,undefined,undefined,'Vente');U.deskErr={t:`Bien vendu : ${fmt(c.net)} net après crédit et impôt.`,ok:true};U.confirmSell=null;save();}else U.confirmSell=u;break;}
    case 'reneg':{const er=reneg(+t.dataset.u);U.deskErr=er?{t:er}:{t:'Crédit renégocié : tes mensualités baissent.',ok:true};save();break;}
    case 'end':U.open=null;U.msg={};U.deskErr='';U.evErr='';U.envMsg={};S.achNew=[];endTurn();window.scrollTo({top:0});if(S.phase==='bilan'&&canAnim()){U.anim={i:0};render();runAnim();return;}break;
    case 'next':S.achNew=[];nextBilan();U.evAmt='';U.evAsset=null;U.evEnv=null;window.scrollTo({top:0});break;
  }
  render();
  if(U.scroll){const el=document.getElementById(U.scroll);U.scroll=null;if(el)el.scrollIntoView({behavior:canAnim()?'smooth':'auto',block:'start'});}
}
function onInput(e){
  const t=e.target;
  if(t.dataset.amt){const key=t.dataset.amt;U.amt[key]=t.value;const [en,id]=key.split(':');const sp=document.getElementById('tx-'+key);if(sp&&en==='cto'){const x=estTaxCto(id,+t.value||0);sp.textContent=x>0.5?`Impôt estimé sur ce montant : ${fmt(x)}.`:'';}}
  if(t.dataset.wd){const en=t.dataset.wd;U.wd[en]=t.value;const sp=document.getElementById('wdtax-'+en);if(sp){const c=wdCalc(en,+t.value||S.acc[en].cash);sp.textContent=c.amt>0?`Impôt estimé : ${fmt(c.tax)}`:'';}}
  if(t.id==='prof-r'){const v=+t.value;const sp=document.getElementById('prof-v');if(sp)sp.textContent=v+' % actions';if(e.type==='change'){S.profile=v/100;U.plan=null;save();render();}}
  if(t.id==='ev-amt')U.evAmt=t.value;
  if(t.id==='dur'&&e.type==='change'){U.dur=+t.value;render();}
  if(t.id==='ev-asset'&&e.type==='change'){U.evAsset=t.value;U.evEnv=null;render();}
  if(t.id==='ev-env'&&e.type==='change'){U.evEnv=t.value;render();}
}
// Pas de migration : la version 3 change de monde. Une partie de la version 2 est close avec son patrimoine (voir legacyGame).
// Complète une partie des versions 3.0 et 3.1 (avant le carnet) avec les nouveaux champs.
function migrate(o){
  if(!o)return o;
  for(const k in BIENS){if(!o.idx[k])o.idx[k]={price:BIENS[k].price*o.defl,rent:BIENS[k].rent*o.defl};if(o.drift&&o.drift['b_'+k]==null)o.drift['b_'+k]=0;}
  if(!o.city)o.city='lille';
  if(!o.home){const rp=o.props.find(p=>BIENS[p.type]&&BIENS[p.type].k==='rp');o.home=rp?{type:rp.type,own:true,since:rp.buyYear}:{type:'t2rp',own:false,since:o.year};if(rp)o.flags.ownedRP=true;}
  if(o.me.car==null)o.me.car=true;
  if(!o.me.kids){o.me.kids=[];for(let i=0;i<o.me.enfants;i++)o.me.kids.push({n:KIDS[i],born:o.year-2-i});}
  if(!o.buyHist)o.buyHist={};
  if(o.onb===undefined)o.onb=null;
  if(!o.onbAns)o.onbAns=[];
  if(!o.page)o.page={head:(o.gaz&&o.gaz.head)||{t:`Année ${o.year}`,c:''},notes:[],imp:null,spent:0};
  delete o.gaz;delete o.sigRec;
  return o;
}
function boot(data){
  S=migrate((data&&data.S&&data.S.v===3)?data.S:load());
  if(!S)U.legacy=legacyGame();
  if(typeof document!=='undefined'){
    document.addEventListener('click',onClick);
    document.addEventListener('input',onInput);
    document.addEventListener('change',onInput);
    document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='inv-d')U.invOpen=e.target.open;},true);
    render();
  }
}
if(typeof document!=='undefined'){
  try{window.claude?.hot?.snapshot?.(()=>({S}));}catch(e){}
  window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
</script>
