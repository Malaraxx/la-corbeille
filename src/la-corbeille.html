<title>La Corbeille</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,800;1,6..96,500;1,6..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : bandeau de situation, la Gazette de l’année, la Une + le dilemme perso, carnet d’ordres par enveloppe, bureau immobilier ; un bilan par an */
:root{
  --paper:#f1dccb; --sheet:#f9ece2; --ink:#221b29; --muted:#6c5952; --rule:#d2b2a0;
  --accent:#0d5163; --accent-ink:#fbefe6; --up:#196f3c; --down:#b0281e; --warn:#8f5300; --life:#8a2f5c;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --crash:#4a1512; --night:#17141d;
  --f-display:"Bodoni Moda", Didot, "Bodoni 72", Georgia, serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#16141b; --sheet:#211d28; --ink:#f1e3d8; --muted:#a8968e; --rule:#3c3545;
  --accent:#7ccbdc; --accent-ink:#0f1a1e; --up:#61cd90; --down:#ff8576; --warn:#eab560; --life:#f08cbd; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --crash:#3b0f0d; --night:#0e0c12; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#16141b; --sheet:#211d28; --ink:#f1e3d8; --muted:#a8968e; --rule:#3c3545;
  --accent:#7ccbdc; --accent-ink:#0f1a1e; --up:#61cd90; --down:#ff8576; --warn:#eab560; --life:#f08cbd; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --crash:#3b0f0d; --night:#0e0c12; color-scheme:dark }

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:22px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .mut{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.small{font-size:12.5px}

.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px double var(--ink);padding-bottom:10px}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,46px);letter-spacing:-.01em;line-height:1}
.logo i{font-weight:500}
.mtag{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.ghost{background:transparent;border:1px solid var(--rule);border-radius:4px;padding:6px 10px;font-size:13px}
.ghost:hover{border-color:var(--ink)}
.ghost.danger{border-color:var(--down);color:var(--down)}
.ghost:disabled{opacity:.4;cursor:not-allowed}


.une-mast{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:6px;font-family:var(--f-display);font-style:italic;font-size:14px}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--down)}
.lede{font-size:15.5px;max-width:62ch}
.shocks{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.fiche{border:1px solid var(--rule);border-radius:2px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.fiche table{font-size:13.5px}
.fiche td{padding:4px 6px}
.fiche td:first-child{padding-left:0}
.decision{border-top:1px dashed var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.must{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--warn)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:transparent;border:1px solid var(--rule);border-radius:2px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.choice:hover{border-color:var(--ink);background:var(--paper)}
.choice b{font-weight:600}
.choice small{color:var(--muted);font-size:12.5px}
.result{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;background:var(--paper);border-radius:2px;padding:10px 12px}
.result::before{content:"✓";font-weight:700;color:var(--up)}
.err{color:var(--down);font-size:13px}
.ok{color:var(--muted);font-size:13px}
.invest{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,.invest input,.order input,.wd input,.cin input{font:inherit;font-family:var(--f-mono);font-size:14px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;min-width:0}
.invest input,.order input,.wd input{width:140px}
.minis{display:flex;gap:4px;flex-wrap:wrap}
.mini{background:transparent;border:1px solid var(--rule);border-radius:4px;padding:3px 8px;font-size:12px;font-family:var(--f-mono)}
.mini:hover{border-color:var(--ink)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:2px;padding:9px 16px;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:2px;padding:8px 14px;font-weight:600}
.secondary:disabled{opacity:.4;cursor:not-allowed}
.sell{border-color:var(--down);color:var(--down)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:6px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h .mut{font-size:13px}
.locked{background:var(--sheet);border:1px dashed var(--life);border-radius:2px;padding:10px 12px;color:var(--life);font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--rule)}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px 6px;display:flex;flex-direction:column;align-items:flex-start;font-weight:600;font-size:14px;margin-bottom:-1px}
.tab small{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--accent)}
.tab:hover{color:var(--accent)}
.envhead{background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.envhead .kv{max-width:520px}
.wd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.book{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 84px repeat(3,minmax(0,1fr)) 78px;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--rule)}
.row.head{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:4px}
.row .r{text-align:right}
.aname b{display:block;font-weight:600}
.aname small{color:var(--muted);font-size:12px}
.row.open{background:var(--sheet)}
.obtn{background:transparent;border:1px solid var(--rule);border-radius:4px;padding:5px 0;font-size:13px}
.obtn:hover{border-color:var(--ink)}
.obtn:disabled{opacity:.4;cursor:not-allowed}
.spark{display:block}
.c-sp{display:flex;align-items:center}
.idle{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px solid var(--warn);border-radius:2px;padding:10px 14px;background:var(--sheet)}
.idle b{font-family:var(--f-mono);font-weight:500}
.profiles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{background:transparent;border:1px solid var(--rule);border-radius:2px;padding:5px 12px;font-size:13px}
.pchip:hover{border-color:var(--ink)}
.pchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.plan{border:1px dashed var(--accent);border-radius:2px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px;background:var(--paper)}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
table.inv{font-size:13.5px}
table.inv td{vertical-align:top}
.nowrap{white-space:nowrap}
.mcap{display:none;text-align:left;padding-bottom:4px;border-bottom:1px solid var(--ink)}
@media (max-width:760px){
  .mcap{display:block}
  table.inv thead{display:none}
  table.inv,table.inv tbody{display:block;width:100%}
  table.inv tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--rule)}
  table.inv td{display:block;border:0;padding:0;text-align:left;min-width:0}
  table.inv td:first-child{grid-column:1/3}
  table.inv td.per{grid-column:1/3;color:var(--muted);font-size:13px}
  table.inv td[data-l]::before{content:attr(data-l);display:block;color:var(--muted);font-size:11px;font-family:var(--f-body);letter-spacing:.04em}
  table.inv td.n{text-align:left;white-space:nowrap}
}
.goals{display:flex;flex-wrap:wrap;gap:6px}
.goal{font-size:12.5px;border:1px solid var(--rule);border-radius:2px;padding:3px 10px;background:var(--sheet)}
.goal.ok{border-color:var(--up);color:var(--up);font-weight:600}
.goal.ko{color:var(--muted);text-decoration:line-through}
.advs{display:flex;flex-direction:column;gap:8px}
.adv{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.adv p{margin:2px 0;font-style:italic}
.ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;background:var(--paper);border:1px solid var(--rule)}
.toasts{display:flex;flex-direction:column;gap:8px}
.toast{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;border:1px solid var(--accent);border-left-width:4px;border-radius:2px;padding:8px 12px;background:var(--sheet)}
.toast b{font-family:var(--f-display);font-size:17px}
.anim{position:fixed;inset:0;z-index:20;background:var(--night);color:#f6eadf;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:background .4s}
.anim.crash{background:var(--crash)}
.anim-in{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:620px;width:100%}
.anim .lbl{color:#cbb8ad}
.anim-y{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,16vw,128px);line-height:1}
.anim-net{font-family:var(--f-mono);font-size:clamp(26px,6vw,40px)}
.anim-pct{font-family:var(--f-mono);font-size:18px}
.anim-pct.up{color:#7fe0a6} .anim-pct.down{color:#ff9b8f}
.anim-notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14.5px;color:#e9d9cd;min-height:44px}
.anim-ach{color:#f3c96b;font-weight:600}
.anim .ghost{color:#f6eadf;border-color:#6d5f67;margin-top:8px}
.ticker{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow:hidden;white-space:nowrap;font-family:var(--f-mono);font-size:13px;color:#cbb8ad;border-top:1px solid #3c3545;border-bottom:1px solid #3c3545;padding:6px 0}
.ticker span{display:inline-block;padding-left:100%}
@media (prefers-reduced-motion:no-preference){.ticker span{animation:tick 9s linear infinite}@keyframes tick{to{transform:translateX(-100%)}}}
.coups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.coups ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ach{border:1px solid var(--rule);border-radius:2px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.ach b{font-size:14px}
.ach.on{border-color:var(--accent);background:var(--sheet)}
.ach.off{color:var(--muted)}
.ach.off b::before{content:"🔒 ";font-size:11px}
.share{display:flex;flex-direction:column;gap:8px}
.share textarea{font:inherit;font-size:13px;width:100%;min-height:70px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:8px}
@media (max-width:760px){.coups{grid-template-columns:minmax(0,1fr)}}
.order{background:var(--sheet);border-bottom:1px solid var(--rule);padding:10px 12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.order .note{flex-basis:100%;font-size:12.5px;color:var(--muted)}
.order label{font-size:13px}

.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px}
.kv span:nth-child(even){font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bar-in{max-width:980px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar small{font-size:13px;opacity:.8}
.bar .primary{background:var(--paper);color:var(--ink)}

.bilan{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:16px}
.bilan h2{font-size:clamp(26px,4vw,38px);font-weight:700}
.bigline{display:flex;flex-wrap:wrap;gap:22px;align-items:baseline}
.bigline .v{font-family:var(--f-mono);font-size:clamp(22px,4vw,30px);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--ink)}
td{padding:7px 8px;border-bottom:1px solid var(--rule)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td small{color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:6px;padding-left:0;margin:0;list-style:none}
.notes li{padding:8px 10px;background:var(--paper);border-radius:4px;font-size:14px}
.notes b{font-family:var(--f-mono);font-weight:500;margin-right:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
details{border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:14px}
details[open] summary{margin-bottom:8px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.t{border-top:2px dashed var(--muted)} .legend i.l{border-top:2px dotted var(--muted)}

.rank{font-family:var(--f-display);font-style:italic;font-size:clamp(28px,5vw,44px);font-weight:700;line-height:1.1}
.journal{display:flex;flex-direction:column}
.journal div{display:grid;grid-template-columns:60px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.journal b{font-family:var(--f-mono);font-weight:500}
.journal strong{font-weight:600}

@media (max-width:760px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:minmax(0,1fr) 84px 70px;row-gap:2px}
  .row .aname{grid-column:1;grid-row:1}
  .row .c-sp{grid-column:2;grid-row:1}
  .row .obtn{grid-column:3;grid-row:1}
  .row .c-px{display:none}
  .row.head{display:none}
  .row .c-var{grid-column:1;text-align:left}
  .row .c-var::before{content:"Dernier tour : ";color:var(--muted);font-size:11px;font-family:var(--f-body)}
  .row .c-pos{grid-column:2/4}
  .row .c-pos::before{content:"Position : ";color:var(--muted);font-size:11px;font-family:var(--f-body)}
  .row .c-pl{grid-column:1/4;text-align:left}
  .row .c-pl::before{content:"Latent : ";color:var(--muted);font-size:11px;font-family:var(--f-body)}
  .tab{padding:6px 8px 4px;font-size:13px}
}
.pourquoi{font-size:15px;background:var(--paper);border-radius:2px;padding:10px 12px;border-left:3px solid var(--accent)}
/* ----- mise en page : barre d'argent, onglets, panneaux ----- */
svg.dw{display:block;color:var(--ink);flex:none}
.topbar{position:sticky;top:0;z-index:6;background:var(--paper);border-bottom:1px solid var(--rule);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px))}
.tb-in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.1fr) repeat(5,minmax(0,1fr));gap:12px;align-items:end}
.tb-in>div{display:flex;flex-direction:column;min-width:0}
.tb-in span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tb-in b{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-date b{font-family:var(--f-display);font-size:19px;font-weight:700}
.tb-date span{text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px}
.tb-net b{color:var(--accent);font-weight:600}
.topbar .neg b{color:var(--down)}
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto}
.vtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 8px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center;margin-bottom:-1px}
.vtabs button:hover{color:var(--ink)}
.vtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{background:var(--down);color:var(--sheet);border-radius:2px;font-size:11px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.tabpanel{display:flex;flex-direction:column;gap:18px}
.decs h3{font-size:19px;font-weight:700}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.pmain,.pside{display:flex;flex-direction:column;gap:18px;min-width:0}
.year .ph h2{font-size:32px}
.news{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.news li{padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.news li:first-child{border-top:0;padding-top:0}
.decs{display:flex;flex-direction:column;gap:12px}
.dec{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--warn);border-radius:3px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dec.life{border-left-color:var(--life)}
.dec.done{border-left-color:var(--rule)}
.dec h3{font-size:21px}
.dec .lbl{color:var(--warn)}
.dec.life .lbl{color:var(--life)}
.advice{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.advice li{padding:10px 0 10px 16px;border-top:1px solid var(--rule);position:relative;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.advice li:first-child{border-top:0;padding-top:0}

.biens{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

.bien .go{color:var(--accent);font-weight:600;font-size:13.5px}
.dossier{border-top:2px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:12px}

.pgrid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
/* ----- création du profil et choix du logement ----- */
.setup2{display:flex;flex-direction:column;gap:18px}

  .vtabs button{padding:8px 7px 6px;font-size:13.5px;gap:4px}

}
/* ----- écran unique : barre d'argent, navigation, scène en cartes, fenêtres de décision ----- */
html,body{height:100%}
body{margin:0;overflow:hidden}
.wrap{max-width:1320px;height:100vh;height:100dvh;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));gap:10px;box-sizing:border-box;overflow:hidden}
.stage{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.mast{flex:none;padding-bottom:6px}

/* barre d'argent */
.hud{flex:none;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);border-radius:3px;padding:8px 10px 8px 16px}
.brand{display:flex;flex-direction:column;flex:none;line-height:1.15}

.mchips{flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mchip{position:relative;display:flex;flex-direction:column;min-width:0;padding:4px 10px;border-radius:3px;background:color-mix(in srgb,var(--paper) 9%,transparent)}
.mchip span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip b{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip.net{background:var(--accent);color:var(--accent-ink)}
.mchip.net span{opacity:.85}
.mchip.neg{background:color-mix(in srgb,var(--down) 45%,transparent)}
.delta{position:absolute;right:6px;top:-9px;font-style:normal;font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:2px;background:var(--sheet);border:1px solid currentColor;pointer-events:none}
.delta.up{color:var(--up)} .delta.down{color:var(--down)}
.hud .ghost{color:var(--paper);border-color:color-mix(in srgb,var(--paper) 30%,transparent);flex:none}
.hud .ghost.danger{color:var(--down);border-color:var(--down);background:var(--sheet)}
.sm{padding:4px 9px;font-size:12.5px}
/* navigation et bouton d'année */

.navbar .vtabs{border:0;flex:1;min-width:0}

/* cartes */

  B.bud={...budOf(B),[k]:v};return null;

const liquidOf=e=>{let t=0;for(const k in S.acc[e].hold)t+=S.acc[e].hold[k].v;return t;};
const envTotal=e=>liquidOf(e)+(S.acc[e].cash||0);
const envCash=()=>S.acc.pea.cash+S.acc.av.cash;
const ev=(e,id)=>S.acc[e].hold[id]?S.acc[e].hold[id].v:0;
function hv(id){let t=0;for(const e in S.acc)t+=ev(e,id);return t;}
const holdOf=(e,id)=>S.acc[e].hold[id]||(S.acc[e].hold[id]={v:0,b:0});
const propValue=p=>S.idx[p.type].price;
const propsValue=()=>S.props.reduce((a,p)=>a+propValue(p),0);
const debtTotal=()=>S.props.reduce((a,p)=>a+loanLeft(p),0);
const net=()=>S.cash+S.liv+envTotal('cto')+envTotal('pea')+envTotal('av')+propsValue()-debtTotal()+bizStake();
const curCredit=()=>S.w.credit;
const curLivret=()=>S.fut[S.year]?S.fut[S.year].mac.livret:S.w.livret;
const curEuros=()=>S.w.euros;
const humeurMult=()=>S.me.humeur<30?0.7:S.me.humeur>70?1.05:1;
const coupleBonus=()=>P()?(S.me.marie?.08:.06):0; // part d'épargne en plus quand on vit à deux
const retired=y=>S.me.retireYear!=null&&y>=S.me.retireYear;
// Épargne de base du foyer, avant logement, voiture et enfants (le taux suppose un T2 loué et une voiture en province).
// Les dépenses courantes (hors logement, voiture, enfants) ne descendent jamais sous 900 € par mois seul, 1 350 € à deux.
const depMin=()=>(P()?1350:900)*12*S.defl;
const epargneYear=()=>{if(retired(S.year)||S.me.chomY===S.year)return 0;if(S.cust)return custSave()-refRent()-carRef();const I=foyerRev();return Math.min(I*(S.tauxEp+coupleBonus())*humeurMult(),I-depMin()-refRent()-carRef());};
// Un enfant coûte 300 € par mois, allocations déduites, jusqu'à ses 22 ans.
const KIDCOST=3600;
const kidsCost=()=>(S.me.kids||[]).filter(k=>S.year-k.born<22).length*KIDCOST*S.defl;
// ----- logement et budget du foyer -----
// Le taux d'épargne du personnage suppose un T2 loué (loyer de référence) et une voiture en province.
// Chaque année : revenus moins dépenses courantes = épargne de base + loyer de référence + voiture de référence,
// puis on paie le vrai logement et la vraie voiture. Louer moins cher ou être propriétaire fait donc épargner plus.
// Ton conjoint de départ gagne ce que tu as indiqué ; un nouveau conjoint, 60 % de ton salaire.
const pRatio=()=>!P()?0:S.cust&&S.cust.partner===P()&&S.cust.sal>0?(S.cust.salP||0)/S.cust.sal:.6;
// Profil sur mesure : revenus moins tes dépenses courantes (indexées sur l'inflation, au moins 300 € par mois seul, 450 € à deux),
// plus 450 € par mois si un nouveau conjoint arrive (tes chiffres étaient ceux du départ), le moral jouant sur ce qui reste.
const custDep=()=>12*S.defl*Math.max(S.cust.dep+(P()&&S.cust.partner!==P()?450:0),CUSTMIN(!!P()));
const custSave=()=>{const m=foyerRev()-custDep();return m>0?m*humeurMult():m;};
// Autre crédit déclaré au départ : mensualité fixe jusqu'à son terme.
const debtCost=()=>S.cust&&S.cust.debtN>0&&S.year<Y0+S.cust.debtN?S.cust.debt*12:0;
const foyerRev=()=>S.revenu+baseSal()*pRatio(); // revenus nets du foyer (le conjoint gagne 60 % de ton salaire de référence)
const cityOf=()=>CITIES[S.city]||CITIES.lille;
const refRent=()=>{const a=S.idx.t2rp.rent,b=S.idx[cityOf().t2].rent;return a+.5*(b-a);};
const COLOCS={lille:5400,lyon:6240,paris:9600,bordeaux:5760,marseille:5100}; // loyer annuel d'une chambre en colocation, en euros de 2026
const colocCost=()=>(COLOCS[S.city]||5400)*S.defl;
const persoRent=()=>S.cust.rent*12*S.idx[cityOf().t2].rent/BIENS[cityOf().t2].rent; // ton loyer, indexé comme ceux de ta ville
const persoRoom=()=>ROOMS[clamp((S.cust.rooms||1)-1,0,4)];
const homeCost=()=>{const h=S.home;if(!h||h.type==='parents')return 0;if(h.type==='perso')return persoRent();if(h.type==='coloc')return colocCost();return S.idx[h.type].rent;};
const homeCap=()=>{const h=S.home;if(!h||h.type==='parents')return 9;if(h.type==='perso')return persoRoom()[1];if(h.type==='coloc')return 1;return BIENS[h.type].cap;};
const homeName=()=>{const h=S.home;if(!h)return '';if(h.type==='perso'){const r=persoRoom()[0];return r==='Maison'?'Ta maison actuelle':`Ton ${r==='Studio'?'studio':r} actuel`;}if(h.type==='parents')return 'Chez tes parents';if(h.type==='coloc')return 'En colocation';return BIENS[h.type].n;};
const need=()=>1+(P()?1:0)+S.me.enfants;
const litre=w=>1+.0115*w.oil*(1.16/w.fx); // prix du litre d'essence selon le baril et le dollar
const carBase=()=>(1800+600*litre(S.w)/1.75)*S.defl; // assurance, entretien, essence
const carCost=()=>!S.me.car?0:S.cust&&S.cust.car>0&&!S.me.newCar?S.cust.car*12*S.defl*litre(S.w)/litre(W0):carBase();
const carRef=()=>cityOf().car?carBase():0;
const rpOf=()=>S.props.find(isRP);
// Ce que coûte vraiment le logement chaque année : loyer, ou mensualités + charges pour un propriétaire.
const housingOut=()=>{const rp=rpOf();if(rp)return S.idx[rp.type].rent*.15+loanAnn(rp);return homeCost();};
// Ce qu'il reste à mettre de côté chaque année (négatif : on puise dans le patrimoine).
// Ce qu'un retraité puise cette année, en anticipant le premier départ et l'arrivée de la pension après une retraite anticipée.
const besoinYear=()=>{if(!retired(S.year))return 0;let b=S.me.pension?S.me.besoin:S.revenu*S.me.gap;if(S.me.early&&age(S.year)>=S.pol.ageLegal&&!S.me.pension62)b*=.5;return b;};
const pensionYear=()=>S.me.pension?S.revenu:S.revenu*.6;
const yearlySave=()=>{const base=retired(S.year)?-besoinYear():epargneYear();return base+refRent()+carRef()-housingOut()-carCost()-kidsCost()-debtCost()-famCost();};
const monthlySpend=()=>Math.max(500*S.defl,(retired(S.year)?pensionYear()+besoinYear():foyerRev()-epargneYear())/12-(refRent()+carRef())/12+(housingOut()+carCost()+kidsCost()+debtCost()+famCost())/12);
const coussin=()=>(Math.max(0,S.cash)+S.liv)/monthlySpend();
function mood(dh,dr){S.me.humeur=clamp(S.me.humeur+(dh||0),0,100);if(P())S.me.relation=clamp(S.me.relation+(dr||0),0,100);}
function unlock(id){if(!S.ach)S.ach={};if(S.ach[id]||!ACHM[id])return;S.ach[id]=S.clk?S.clk.y:S.year;(S.achNew||(S.achNew=[])).push(id);}
function ext(a){S.cash+=a;S.yearExt+=a;S.extTot=(S.extTot||0)+a;}
/* ----- registre des investissements (flux datés, pour le récap et le TRI) ----- */
function lgKey(e,id){return e+':'+id+(id==='jeton'?':'+S.jeton.name:'');}
function lgFlow(e,id,a){
  if(!S.lg||!(Math.abs(a)>0.004))return;const k=lgKey(e,id);
  const L=S.lg.lines[k]||(S.lg.lines[k]={env:e,id,label:nm(id),first:S.clk.y,flows:[]});

}
function lgEnv(e,a){if(S.lg&&S.lg.env[e]&&Math.abs(a)>0.004)S.lg.env[e].push({t:S.clk.t,y:S.clk.y,a});}
function lgProp(p,a){if(Math.abs(a)>0.004){(p.flows||(p.flows=[])).push({t:S.clk.t,y:S.clk.y,a});S.yearProp=(S.yearProp||0)+a;}}
// Ordres passés pendant le tour (janvier) : servent à chiffrer au bilan ce que tes choix ont rapporté face à « ne rien toucher ».
function mvRec(o){if(S.clk&&S.clk.t===S.year&&S.phase==='turn')(S.moves||(S.moves=[])).push(o);}
// Repère « ta vie et ton immobilier à l'identique, mais tous tes placements financiers sur l'ETF Monde (ou le Livret A) » :
// il reçoit les mêmes flux externes et les mêmes flux immobiliers que toi ; on y ajoute la valeur nette actuelle de ton immobilier.
const propNet=()=>propsValue()-debtTotal();
const benchRef=()=>({trk:S.bench.trk+propNet(),liv:S.bench.liv+propNet()});
function irr(fl){
  const f=fl.filter(x=>Math.abs(x.a)>0.004).sort((a,b)=>a.t-b.t);
  if(!f.length)return null;
  const pos=f.reduce((s,x)=>s+(x.a>0?x.a:0),0);if(pos<0.01)return -1;
  if(f.length<2)return null;
  const t0=f[0].t;if(f[f.length-1].t-t0<0.5)return null;
  const npv=r=>f.reduce((s,x)=>s+x.a/Math.pow(1+r,x.t-t0),0);
  let lo=-0.999,hi=10,flo=npv(lo);if(flo*npv(hi)>0)return null;
  for(let i=0;i<90;i++){const m=(lo+hi)/2,fm=npv(m);if(fm*flo>0){lo=m;flo=fm;}else hi=m;}
  return (lo+hi)/2;
}

/* ===================== ORDRES ===================== */
function tradable(id){
  if(META[id].k==='special')return false;
  if(THEMES.includes(id))return themeOpen(thIdx(id));
  if(id==='jeton')return S.jeton.alive;
  return true;
}
function eligEnvs(id){if(META[id].k==='special')return ['cto'];return Object.keys(ENVS).filter(e=>ENVS[e].el.includes(id));}
function buyIn(e,id,amt){
  amt=Math.floor(amt);
  if(!(amt>0))return 'Indique un montant.';
  if(META[id].k!=='special'&&!ENVS[e].el.includes(id))return `${nm(id)} n’est pas éligible au ${ENVS[e].n}.`;
  const A=S.acc[e],fromEnv=e==='cto'?0:Math.min(A.cash,amt),fromMain=amt-fromEnv;
  if(fromMain>S.cash+0.5)return `Liquidités insuffisantes : il te manque ${fmt(fromMain-S.cash)}. Vends d’abord une ligne ou retire de l’argent d’une enveloppe.`;
  if(e==='pea'&&A.vers+fromMain>peaCap()+0.5)return `Plafond du PEA atteint : tu peux encore y verser ${fmt(Math.max(0,peaCap()-A.vers))}.`;
  if(e!=='cto'){if(A.open==null)A.open=S.year;A.cash-=fromEnv;A.vers+=fromMain;}
  S.cash-=fromMain;const h=holdOf(e,id);h.v+=id==='scpi'?amt*.92:amt;h.b+=amt;
  lgFlow(e,id,-amt);mvRec({e,id,a:amt});if(e!=='cto')lgEnv(e,-fromMain);
  return null;
}
function taxGain(g){
  if(g<=0){S.lossCarry+=-g;return 0;}
  const u=Math.min(S.lossCarry,g);S.lossCarry-=u;return (g-u)*ctoRate();
}
function estTaxCto(id,amt){
  const h=S.acc.cto.hold[id];if(!h||h.v<=0)return 0;
  amt=Math.min(amt,h.v);const g=amt-h.b*(amt/h.v);if(g<=0)return 0;
  return Math.max(0,g-S.lossCarry)*ctoRate();
}
function sellIn(e,id,amt){
  const h=S.acc[e].hold[id];if(!h||h.v<=0)return {err:'Tu ne détiens rien sur cette ligne.'};
  amt=Math.min(Math.floor(amt*100)/100,h.v);if(!(amt>0))return {err:'Indique un montant.'};
  if(h.v-amt<1)amt=h.v;
  const basis=h.b*(amt/h.v);h.v-=amt;h.b-=basis;if(h.v<.01){h.v=0;h.b=0;}
  if(e==='cto'){const tax=taxGain(amt-basis);S.cash+=amt-tax;lgFlow(e,id,amt-tax);mvRec({e,id,a:-amt,tax});return {amt,tax};}
  S.acc[e].cash+=amt;lgFlow(e,id,amt);mvRec({e,id,a:-amt});return {amt,tax:0,inEnv:true};
}
function livIn(amt){
  amt=Math.floor(amt);if(!(amt>0))return 'Indique un montant.';
  if(amt>S.cash+0.5)return `Liquidités insuffisantes : il te reste ${fmt(S.cash)}.`;
  const room=livretCap()-S.liv;if(amt>room+0.5)return `Plafond du Livret A (${fmt(livretCap())}) : tu peux encore verser ${fmt(Math.max(0,room))}.`;
  S.liv+=amt;S.cash-=amt;lgFlow('liv','livret',-amt);mvRec({e:'liv',id:'livret',a:amt});return null;
}
function livOut(amt){amt=Math.min(amt,S.liv);if(!(amt>0))return {err:'Ton Livret A est vide.'};S.liv-=amt;if(S.liv<.01)S.liv=0;S.cash+=amt;lgFlow('liv','livret',amt);mvRec({e:'liv',id:'livret',a:-amt});return {amt,tax:0};}
function avAbattLeft(){const cap=S.me.marie?9200:4600;return cap-(S.avAb.y===S.year?S.avAb.used:0);}
function wdCalc(e,amt){
  const A=S.acc[e],tot=envTotal(e),close=e==='pea'&&envYears('pea')<5;
  amt=close?tot:Math.min(amt,A.cash);
  if(!(amt>0.005)||tot<=0)return {amt:0,tax:0,close,taxable:0};
  const taxable=amt*Math.max(0,1-A.vers/tot);let tax;
  if(e==='pea')tax=taxable*(close?ctoRate():psRate());
  else if(envYears('av')>=8)tax=Math.max(0,taxable-avAbattLeft())*.075+taxable*psFRate();
  else tax=taxable*avRate();
  return {amt,tax,close,taxable};
}
function withdraw(e,amt){
  const A=S.acc[e],c=wdCalc(e,amt);
  if(!(c.amt>0))return {err:c.close?'Ton PEA est vide.':'Aucune liquidité dans cette enveloppe : vends d’abord une ligne, l’argent y restera disponible.'};
  const tot=envTotal(e);
  if(c.close){for(const k in A.hold){lgFlow(e,k,A.hold[k].v);mvRec({e,id:k,a:-A.hold[k].v});A.cash+=A.hold[k].v;}A.hold={};}
  if(c.tax>0.5)mvRec({tax:c.tax});
  A.vers-=A.vers*(c.amt/tot);A.cash-=c.amt;if(A.cash<.01)A.cash=0;
  if(e==='av'&&envYears('av')>=8){if(S.avAb.y!==S.year)S.avAb={y:S.year,used:0};S.avAb.used+=Math.min(c.taxable,avAbattLeft());}
  if(c.close){A.open=null;A.vers=0;A.cash=0;}
  S.cash+=c.amt-c.tax;lgEnv(e,c.amt-c.tax);return {amt:c.amt,tax:c.tax,closed:c.close};
}
// Couvre un solde négatif du compte courant en vendant dans un ordre fiscalement raisonnable. Boucle jusqu'à couverture.
function raiseCash(ctx){
  ctx.sold=ctx.sold||0;ctx.tax=ctx.tax||0;ctx.props=ctx.props||[];
  const add=r=>{if(r&&!r.err){ctx.sold+=r.amt;ctx.tax+=r.tax||0;}};
  let guard=0;
  while(S.cash<-0.5&&guard++<120){
    const need=-S.cash*1.6+1;
    if(S.liv>0.5){add(livOut(Math.min(S.liv,need)));continue;}
    const eCash=['av','pea'].find(e=>S.acc[e].cash>0.5&&!(e==='pea'&&envYears('pea')<5));
    if(eCash){add(withdraw(eCash,Math.min(S.acc[eCash].cash,need)));continue;}
    let id=['oat','corp','monde','tracker','or','scpi','pharma','luxe','telecom','banque','petro','aero',...THEMES,'jeton'].find(k=>ev('cto',k)>0.5);
    if(id){add(sellIn('cto',id,Math.min(ev('cto',id),need)));continue;}
    id=['euros','oat','corp','monde','tracker','scpi',...THEMES].find(k=>ev('av',k)>0.5);
    if(id){sellIn('av',id,Math.min(ev('av',id),need));continue;}
    if(envTotal('pea')>0.5){
      if(envYears('pea')>=5){id=EQUITY.find(k=>ev('pea',k)>0.5);if(id){sellIn('pea',id,Math.min(ev('pea',id),need));continue;}}
      else{add(withdraw('pea',0));ctx.peaClosed=true;continue;}
    }
    if(bizBoss()&&S.biz.tre>100){const B=S.biz,x=Math.min(need,B.tre/1.45);B.tre-=x*1.45;B.val=Math.max(0,B.val-x*1.45);ext(x);B.prime=(B.prime||0)+x;ctx.prime=(ctx.prime||0)+x;continue;}
    if(bizOn()&&bizStake()>0.5){const r=bizSell('urgence');ctx.sold+=r.amt;ctx.tax+=r.tax;ctx.props.push(`Tes parts de boîte sont cédées en urgence, avec 30 % de décote (${fmt(r.amt)} net).`);continue;}
    if(S.props.length){const p=S.props[0];const c=sellProp(p.uid,propValue(p)*.85,ctx.y||S.year,'Vente forcée');ctx.props.push(`${pnameP(p)} vendu d’office avec 15 % de décote (${fmt(c.net)} net).`);continue;}
    break;
  }
  if(S.cash<-1){
    if(ctx.retired){ctx.ruin=-S.cash;S.yearRuin=(S.yearRuin||0)-S.cash;S.yearExt-=S.cash;S.extTot=(S.extTot||0)-S.cash;S.cash=0;}
    else S.flags.faillite=true;
  }
  return ctx;
}
function raiseNotes(ctx,label){
  const n=[];
  if(ctx.sold>0.5)n.push(`${label} : ${fmt(ctx.sold)} vendus ou retirés d’office${ctx.tax>0.5?` (impôt ${fmt(ctx.tax)})`:''}.`);
  if(ctx.prime)n.push(`Ta boîte te verse une prime de ${fmt(ctx.prime)} pour boucler tes fins de mois (${fmt(ctx.prime*1.45)} de trésorerie en moins).`);
  if(ctx.peaClosed)n.push('Ton PEA avait moins de 5 ans : le retrait forcé l’a clôturé.');
  n.push(...ctx.props);
  if(ctx.ruin)n.push(`Ton patrimoine financier est épuisé : il manque ${fmt(ctx.ruin)} pour compléter ta pension. Tu te serres la ceinture (humeur −15).`);
  if(S.flags.faillite)n.push('Plus rien à vendre : faillite personnelle.');
  return n;
}
// Dépense immédiate (vie perso ou frais). Si le compte passe dans le rouge, on vend tout de suite et on le dit.
function spend(a,isLife){
  if(isLife)ext(-a);else S.cash-=a;
  if(S.cash<-0.5){const c=raiseCash({retired:retired(S.year)});if(c.ruin)S.me.humeur=clamp(S.me.humeur-15,0,100);return ' '+raiseNotes(c,'Pour payer').join(' ');}
  return '';
}

/* ===================== IMMOBILIER ===================== */
const annuity=(L,r,n)=>r===0?L/n:L*r/(1-Math.pow(1+r,-n));
// Un crédit = un prêt principal {p,r,n,ann} et, pour un premier achat, un prêt à taux zéro z {p,ann} remboursé sur la même durée.
const loanAnn=p=>p.loan&&p.loan.n>0?p.loan.ann+(p.loan.z&&p.loan.z.p>0?p.loan.z.ann:0):0;
const loanLeft=p=>p.loan?p.loan.p+(p.loan.z?p.loan.z.p:0):0;
function payLoan(p){
  const L=p.loan;if(!L||L.n<=0)return {ann:0,it:0};
  const it=L.p*L.r;let ann=L.ann;L.p=Math.max(0,L.p-(L.ann-it));
  if(L.z&&L.z.p>0){const a=Math.min(L.z.p,L.z.ann);L.z.p-=a;ann+=a;}
  L.n--;if(L.n<=0){L.p=0;if(L.z)L.z.p=0;}
  return {ann,it};
}
function effort(extraAnn,extraRent){
  const ann=S.props.reduce((a,p)=>a+loanAnn(p),0)+extraAnn+debtCost();
  const rents=S.props.filter(p=>!isRP(p)).reduce((a,p)=>a+S.idx[p.type].rent*p.rentMult,0)+extraRent;
  return ann/(foyerRev()+0.7*rents);
}
// Prêt à taux zéro : premier achat de résidence principale, revenus du foyer sous 60 000 € (en euros de 2026). Il finance 20 % du prix.
const ptzOk=(type,use)=>(use||(BIENS[type].k==='rp'?'rp':'loc'))==='rp'&&BIENS[type].k==='rp'&&!S.flags.ownedRP&&foyerRev()<=60000*S.defl;
const DURS=[15,20,25];
// apIn : part du prix apportée en plus des frais de notaire (0 = « frais seuls », jusqu'à 90 %). Par défaut 20 %, 10 % avec un PTZ.
// Sous 10 % d'apport, la banque prend 0,25 point de plus.
function propQuote(type,n=20,use,apIn){
  if(!DURS.includes(n))n=20;
  use=use||(BIENS[type].k==='rp'?'rp':'loc');
  const ix=S.idx[type],price=ix.price,frais=price*0.075,z0=ptzOk(type,use)?price*.2:0,ap=apIn!=null?clamp(+apIn,0,.9):z0?.1:.2,L=price*(1-ap),z=Math.min(z0,L),r=(curCredit()+(n>=25?.2:n<=15?-.15:0)+(ap<.1?.25:0))/100;
  const annM=annuity(L-z,r,n),annZ=z?z/n:0,ann=annM+annZ;
  return {price,frais,cashNeed:price+frais,apport:price*ap+frais,ap,L,z,r,n,ann,annM,annZ,use,rent:ix.rent,eff:effort(ann,use==='rp'?0:ix.rent)};
}
// La plus courte durée qui passe sous les 35 % de taux d'effort.
function bestDur(type,use,ap){for(const n of DURS)if(propQuote(type,n,use,ap).eff<=.35)return n;return 25;}
function buyProp(type,mode,n=20,use,meuble,ap){
  if(!BIENS[type])return 'Bien inconnu.';
  use=BIENS[type].k==='bur'?'loc':use||(BIENS[type].k==='rp'?'rp':'loc');
  if(retired(S.year)&&mode==='credit')return 'À la retraite, ta banque ne te prête plus sur 20 ans.';
  const rp=use==='rp';

// Tirage de la phase de l'année : matrice de transition, modulée par les excès visibles dans la Gazette
// (crédit qui gonfle, Bourse chère, courbe des taux inversée, choc pétrolier).
function drawPhase(w,exo){
  const P={...TRANS[w.phase]};
  if(w.phase!=='crise'){
    P.crise=(P.crise||0)+.025*Math.max(0,w.cg-3)+(w.pe>22?.04:0);
    if(w.r10<w.rate)P.recession=(P.recession||0)+.15;
    if(exo==='energie')P.recession=(P.recession||0)+.25;
  }
  if(w.infl>4&&P.surchauffe!=null)P.surchauffe+=.1;
  let tot=0;for(const k in P)tot+=P[k];
  let x=rnd()*tot;for(const k in P){x-=P[k];if(x<=0)return k;}
  return w.phase;
}
// Risque de crise dans les deux ans, tel qu'une étude indépendante peut l'estimer à partir de l'état du monde.
function crisisRisk(w){return .04+.025*Math.max(0,w.cg-3)+(w.pe>22?.04:0)+(w.r10<w.rate?.05:0)+(w.phase==='surchauffe'?.06:0);}
const isElection=y=>y>Y0&&(y-(Y0+1))%5===0;

// Génère l'année y à partir de l'état connu fin y-1 (S.w) : phase, macroéconomie, rendements de tous les actifs.

function genYear(y){
  const w=S.w,f={y,exo:null,shock:null,d:0};
  const ex=y===Y0?1:rnd(); // la première année est calme : le temps de découvrir la Gazette
  if(ex<.012&&y-(S.flags.lastPand||0)>15){f.exo='pandemie';S.flags.lastPand=y;}
  else if(ex<.047)f.exo='energie';
  else if(ex<.067)f.exo='guerre';
  f.phase=y===Y0?'expansion':f.exo==='pandemie'?'crise':drawPhase(w,f.exo);
  const PH=PHASES[f.phase];
  if(f.phase==='crise'){
    f.cause=f.exo==='pandemie'?'pandemie':w.cg>4?'credit':w.pe>21?'bulle':pick(['credit','bulle','assureur']);
    f.d=Math.round(f.exo==='pandemie'?30+rnd()*10:25+rnd()*20);
  }
  if(isElection(y))f.elec=makeElection();
  const E=f.elec?f.elec[f.elec.win]:null,react=E?E.prog.react:{t:0,b:0,sp:0};
  // macroéconomie
  const g=PH.g+gauss()*PH.gs+(f.exo==='pandemie'?-5:0)+(f.exo==='energie'?-.8:0);
  const infl=clamp(w.infl+.35*(2-w.infl)+PH.ip+gauss()*.45+(f.exo==='energie'?2.5:0)+(f.exo==='guerre'?.6:0),-1,12);
  const taylor=Math.max(0,2+1.5*(infl-2)+.5*(g-1.3));
  let rate=w.rate+.55*(taylor-w.rate);if(f.phase==='crise')rate=Math.min(rate,w.rate*.4);
  rate=clamp(Math.round(rate*4)/4,0,9);
  S.pol.spreadAdj=S.pol.spreadAdj*.7+react.sp;
  const debt=clamp(w.debt+S.pol.deficit+PH.def-(g+infl)*w.debt/100,40,250);
  if(debt>130&&S.pol.deficit>2)S.pol.deficit=Math.max(2,S.pol.deficit-.1); // les marchés imposent la rigueur
  const spread=clamp(.3+.015*Math.max(0,debt-100)+(f.phase==='crise'?.4:0)+S.pol.spreadAdj+gauss()*.1,.1,6);
  const r10=clamp(.5*rate+1+PH.tp+spread+gauss()*.2,0,14);
  const credit=Math.max(.8,.5*w.credit+.5*(r10+.2));
  const livret=Math.max(.5,Math.round((w.infl+w.rate)/2*10)/10);
  const euros=Math.max(.5,.7*w.euros+.3*r10*.9);
  const u=clamp(w.u+PH.du+.15*(7.5-w.u)+gauss()*.3,3.5,15);
  let cg=w.cg;if(f.phase==='crise')cg*=.3;else if(f.phase==='recession')cg*=.75;else cg+=PH.cg+.3*(2.5-w.rate)+gauss()*.3;cg=clamp(cg,-2,12);
  const oil=clamp(w.oil*Math.exp(gauss()*.18+.25*Math.log(70/w.oil))*(f.exo==='energie'?1.8:1)*(f.exo==='guerre'?1.25:1)*(f.phase==='crise'?.7:1),20,250),dOil=oil/w.oil-1;
  const fx=clamp(w.fx*Math.exp(gauss()*.06+.3*Math.log(1.15/w.fx))*(f.phase==='crise'?.94:1),.8,1.6);
  // marché actions : phase + valorisation (une Bourse chère rapporte moins ensuite) + dérive propre à la partie
  const m=PH.m+gauss()*PH.ms-.04*Math.log(w.pe/16)+S.drift.mkt+(f.exo==='guerre'?-.06:0);
  if(f.d){const d=f.d;
    f.shock=f.cause==='pandemie'?{tracker:-d,monde:-d*.9,telecom:-d*.6,luxe:-d*1.1,banque:-d*1.3,petro:-d*1.4,aero:-d*1.8,pharma:10,or:5}
      :{tracker:-d,monde:-d*.95,telecom:-d*.8,luxe:-d*1.1,banque:-d*(f.cause==='credit'?1.6:1.3),petro:-d,aero:-d*1.3,pharma:-d*.5,or:6};
    THEMES.forEach((id,i)=>{const st=themeStage(S.th[i],y);if(st&&st!=='rumeur')f.shock[id]=-d*1.4;});}
  const r={};
  r.tracker=Math.max(-.6,m+.006+gauss()*.04+react.t);
  r.monde=Math.max(-.6,(1+m+.01+gauss()*.035+react.t*.2)*(w.fx/fx)-1);
  for(const s of STOCKS){const p=SP[s];let x=p.d+.015+p.b*(m-.08)+gauss()*p.v+S.drift[s];
    if(s==='petro')x+=.5*dOil-(E&&E.prog.carbon?.15:0);
    if(s==='aero')x-=.3*dOil+(f.exo==='pandemie'?.25:0)+(E&&E.prog.carbon?.08:0);
    if(s==='banque')x+=react.b+.03*((r10-rate)-(w.r10-w.rate));
    if(s==='telecom')x-=.02*(r10-w.r10);
    r[s]=clamp(x,-.85,3);}
  r.or=.035+gauss()*.13-.3*(m-.08)+(f.phase==='crise'?.06:0)+.01*(infl-2);
  r.oat=w.r10/100-7*(r10-w.r10)/100+gauss()*.004;
  THEMES.forEach((id,i)=>{const T=S.th[i],st=themeStage(T,y);let x=0;
    if(st==='mature'||st==='zombie')x=(st==='mature'?.045:-.02)+1.3*(m-.08)+gauss()*.22;
    else if(st&&st!=='rumeur'){const [a,b,sd]=TR[st];x=(T.ok?a:b)+.8*(m-.08)+gauss()*sd;}
    r[id]=clamp(x,-.9,3);});
  // valorisation de la Bourse de Paris (PER) : prix contre bénéfices
  const tot=(1+(f.shock?f.shock.tracker/100:0))*(1+r.tracker)-1,eps=PH.eps+gauss()*.03;
  const pe=clamp(w.pe*(1+tot-.03)/(1+eps),7,40);
  // immobilier : inflation, variation des taux de crédit, cycle, puis sensibilité propre à chaque ville
  const gH=.7*infl/100+.012-1.8*(credit-w.credit)/100+PH.h+gauss()*.025;
  const gB={},rg={};
  for(const k in BIENS){const B=BIENS[k];
    gB[k]=B.k==='bur'?gH*B.beta-.01+gauss()*.04:gH*B.beta+S.drift['b_'+k]+gauss()*.012;
    rg[k]=(B.k==='bur'?(infl-.5)/100:Math.min(infl,3.5)/100)+B.rentG;}
  const bur=Object.keys(BIENS).filter(k=>BIENS[k].k==='bur');
  r.scpi=.045+.6*bur.reduce((a,k)=>a+gB[k],0)/bur.length+gauss()*.02+(f.phase==='crise'?-.05:0);
  r.corp=(w.r10+1.3+(f.phase==='crise'?2:f.phase==='recession'?1:0))/100-4.5*(r10-w.r10)/100-(f.phase==='crise'?.11:f.phase==='recession'?.035:0)+gauss()*.01;
  f.r=r;
  f.mac={phase:f.phase,g,infl,rate,r10,spread,credit,livret,euros,u,cg,oil,fx,pe,debt,gH,gB,rg};
  return f;
}

function progText(pr){

// Une fenêtre déjà vue autant de fois qu'elle a de versions rappelle les années précédentes : jamais deux fois le même texte.
const NV={rachat:3,dpe:3,krach:3,pandemie:3,energie:3,guerre:3,taux:3,banque:3,jeton:2,geant:3,bulle:3,offre:3,impaye:3,teletravail:3,occasion:3,theme:3,election:3};
for(const id in EVT){const f=EVT[id].view;EVT[id].view=p=>{const v=f(p),x=S.story?deja(id,NV[id]||1):'';return x?{...v,body:v.body+x}:v;};}
function pickW(list){const tot=list.reduce((a,x)=>a+x.w,0);let r=rnd()*tot;for(const x of list){r-=x.w;if(r<=0)return x.id;}return list[list.length-1].id;}
// Une année sur trois environ n'a pas d'événement : la Gazette suffit.
function pickEvent(y,f){
  if(y===Y0)return null;
  if(f.cause==='pandemie')return 'pandemie';
  if(f.phase==='crise')return 'krach';
  // La présidentielle ne devient une fenêtre que si l'écart entre les programmes pèse sur ton argent (3 fois au plus).
  if(f.elec){if(!S.story)return 'election';if(S.story.pres<3&&elecStake(f.elec)>=Math.max(1000*S.defl,.01*net())){S.story.pres++;return 'election';}}
  if(f.exo==='energie'||f.exo==='guerre')return f.exo;
  const last=S.usedFut[S.usedFut.length-1];
  const el=Object.keys(EVT).filter(id=>!EVT[id].forced&&id!==last).map(id=>({id,w:EVT[id].w(y,f)})).filter(x=>x.w>0);
  el.push({id:null,w:25});
  return pickW(el);
}

function retireOpts(){
  const L=S.pol.ageLegal,g=a=>a<L?.30:a<L+2?.24:.18;
  const ys=[...new Set([S.year,AY(L),AY(L)+3].filter(y=>y>=S.year&&y<=YN))];
  return ys.map(y=>({y,gap:g(age(y)),dh:age(y)<L?15:age(y)>=L+3?-8:0}));
}

/* ===================== CARNET ===================== */
// La page de l'année : notes écrites à la première personne (rédigées au début du tour, le hasard est tiré ici),
// conseils de Sophie et pense-bêtes (fonctions pures de l'état), achats pour se faire du bien.
function headline(y){
  const w=S.w,P0=S.wPrev,f=S.fut[y],ev=S.event&&S.event.id,c=[],H=(t,ch)=>c.push({t,c:ch});
  const prev=S.page&&S.page.head&&S.page.head.t,r=S.me.raise,lag=r!=null&&r*100<w.infl-.05;
  if(y===Y0)return {t:'Bienvenue dans la vie active',c:''};
  if(ev==='pandemie')H('Un virus met le pays à l’arrêt','Écoles fermées, rideaux baissés.');
  if(ev==='krach')H(pick(['Panique sur les marchés','Le grand plongeon','Lundi noir à la Bourse']),'Tout le monde parle de sa banque.');
  if(f.exo==='energie')H('Le pétrole s’envole, le plein aussi','On fait la queue aux stations.');
  if(f.exo==='guerre')H('La guerre aux portes de l’Europe','Le prix du gaz inquiète.');
  if(w.phase==='crise')H('Après la tempête, on compte les dégâts',`Le chômage atteint ${f1(w.u)} %.`);
  if(w.phase==='recession')H(P0&&P0.phase==='recession'?'La récession s’installe':'La France entre en récession','Les entreprises gèlent les embauches.');
  if(w.phase==='reprise')H(pick(['La reprise est là','Le moral revient','Ça repart']),'Les entreprises recommencent à embaucher.');
  if(f.elec)H(`Présidentielle : ${f.elec.A.name} contre ${f.elec.B.name}`,'On vote en avril.');
  if(w.infl>3.5)H(`Tout augmente : ${f1(w.infl)} % d’inflation`,lag?'Les prix grimpent plus vite que les salaires.':'Les salaires suivent, de justesse.');
  if(w.pe>22)H('La Bourse bat record sur record','Tout le monde en parle à la machine à café.');
  if(w.cg>4&&P0&&w.cg>P0.cg)H(w.credit<4?'Crédit facile : tout le monde emprunte':'Tout le monde s’endette, malgré des taux élevés','Les anciens disent que ça finit rarement bien.');
  if(P0&&w.credit<=P0.credit-.4)H(w.credit<3.5?'Les taux de crédit fondent':'Le crédit baisse enfin',`Emprunter sur 20 ans coûte ${rate(w.credit)}.`);
  if(w.r10<w.rate)H('Les taux font un drôle de signal','Les économistes y voient souvent l’annonce d’une récession.');
  if(w.phase==='surchauffe')H('L’économie tourne à plein régime','Mais les prix commencent à grimper.');
  H(pick(['Une année sans histoire','L’économie avance à petits pas','Ni crise ni euphorie'].filter(t=>t!==prev)),'');
  return c.find(x=>x.t!==prev)||c[0];
}

function storyInit(){
  const st={seed:Math.floor(rnd()*1000),cast:{},th:{},hist:{},chap:0,beats:[],dest:[],pres:0,given:0,care:null,stud:[],traits:{},adv:[],snap:[],uid:1};
  const g=rnd()<.5?'m':'f';st.cast.ami={n:pick(AMIS[g]),g};
  const mb=Y0-A0-29-Math.floor(rnd()*4),pb=Y0-A0-31-Math.floor(rnd()*4);
  st.cast.mere={n:pick(MERES),born:mb,g:'f'};st.cast.pere={n:pick(PERES),born:pb,g:'m'};
  // Le premier parent s'éteint entre 78 et 86 ans, le second entre 84 et 93 ans (au plus tard en YN-3).
  const firstM=rnd()<.45,a=firstM?st.cast.mere:st.cast.pere,b=firstM?st.cast.pere:st.cast.mere;
  a.die=Math.min(YN-8,Math.max(AY(45),a.born+78+Math.floor(rnd()*9)));b.die=Math.min(YN-3,Math.max(a.die+3,b.born+84+Math.floor(rnd()*10)));
  st.cast.estate=Math.round((80000+rnd()*120000)/1000)*1000;
  S.story=st;
  if(P())storyTraits(P());

  openTh('parents',Math.max(AY(37),a.die-7),{});

}

function playNotes(){
  for(let i=0;i<4;i++){const e=dueThread(true);if(!e)break;const [id,T]=e,fn=NOTES[T.k],r=fn?fn(T):null;if(!r){endTh(id,'');continue;}

     one?[`J’emmène ${one.n} voir la mer. ${one.g==='f'?'Elle':'Il'} me raconte son enfance pendant des heures.`,`Une journée à la mer avec ${one.n}.`]:null,
     [`Réunion d’anciens de la fac : ${a} n’a pas changé, Kévin raconte ses exploits en Bourse.`,`La réunion des anciens, avec ${a} et Kévin.`]],
    [[`${a} et moi partons une semaine marcher dans les Alpes, comme promis il y a vingt ans.`,`La randonnée promise avec ${a}.`],
     k?[`${k.n} passe le dimanche avec nous et me demande conseil pour ses premiers placements.`,`Les premiers placements de ${k.n}, sur tes conseils.`]:null,

    [[`${a} et moi fêtons nos 70 ans au restaurant de nos 25 ans. Le patron nous reconnaît.`,`Les 70 ans avec ${a}, au restaurant de nos 25 ans.`],
     [`Karim, toujours en jean, me raconte sa dernière idée de boîte. À 72 ans.`,`Karim, entrepreneur jusqu’au bout.`],
     [`Je range le grenier : de vieux relevés de compte de ${Y0}. Que de chemin parcouru.`,`Les vieux relevés de ${Y0}, retrouvés au grenier.`]]][c].filter(Boolean);

function elecStake(E){
  const A=E.A.prog,B=E.B.prog,dT=Math.abs(progTax(A)-progTax(B)),dPS=Math.abs((A.ps??S.pol.ps)-(B.ps??S.pol.ps)),dPF=Math.abs((A.psF??A.ps??S.pol.psF)-(B.psF??B.ps??S.pol.psF));
  const gain=e=>Math.max(0,envTotal(e)-S.acc[e].vers);
  let s=dT*ctoLatent()+dPS*gain('pea')+dPF*gain('av');
  const rents=S.props.filter(p=>!isRP(p)).reduce((a,p)=>a+S.idx[p.type].rent*p.rentMult*.6,0);
  s+=Math.abs((A.irLoyer??S.pol.irLoyer)-(B.irLoyer??S.pol.irLoyer))*rents*5;
  if(!retired(S.year)&&age(S.year)>=50)s+=Math.abs((A.age??S.pol.ageLegal)-(B.age??S.pol.ageLegal))*S.revenu*.3;
  if(S.liv>=.8*livretCap())s+=Math.abs((A.livCap||0)-(B.livCap||0))*curLivret()/100*5;
  return s;
}

// IFI : immobilier net (résidence principale abattue de 30 %, crédits déduits) au-delà de 1,3 M€ indexés ; barème de 0,5 % à 1,5 % dès 800 000 €.
function ifiTax(){
  const d=S.defl,base=S.props.reduce((a,p)=>a+propValue(p)*(isRP(p)?.7:1)-loanLeft(p),0);
  if(base<=1300000*d)return 0;

  BR.forEach(([lo,rt],i)=>{const a=lo*d,b=i<BR.length-1?BR[i+1][0]*d:Infinity;if(base>a)t+=(Math.min(base,b)-a)*rt;});

}
// Ce que les ordres de janvier ont rapporté (ou coûté) par rapport à ne rien toucher : chaque euro déplacé aurait suivi

function movesGain(b,r,mac){

function dossierHtml(){
  const t=U.dossier.t,B=BIENS[t],bur=B.k==='bur',use=bur?'loc':U.dossier.use||'rp',ret=retired(S.year),rp=rpOf(),inCity=B.v===S.city;
  // Déjà propriétaire de sa résidence : on simule les deux options (vendre ou louer l'ancienne) sur une copie de la partie.
  const sw=use==='rp'&&rp&&rp.type!==t&&inCity,old=U.dossier.old||'vendre';
  // Apport choisi : U.dossier.ap (null = apport standard), « max » = tout ce dont tu disposes.
  const cash0=sw?dry(()=>{oldHome(old);return Math.max(0,S.cash)+S.liv;}):Math.max(0,S.cash)+S.liv,price0=S.idx[t].price,apMax=clamp((cash0-price0*.075)/price0,0,.9);
  const ap=U.dossier.ap==='max'?apMax:U.dossier.ap;
  const n=U.dur||(sw?dry(()=>{oldHome(old);return bestDur(t,'rp',ap);}):bestDur(t,use,ap));
  const sim=sw?dry(()=>{oldHome(old);return {q:propQuote(t,n,'rp',ap),cash:Math.max(0,S.cash)+S.liv};}):null;
  const q=sim?sim.q:propQuote(t,n,use,ap),ix=S.idx[t],cash=sim?sim.cash:Math.max(0,S.cash)+S.liv;
  const apBtn=(v,l)=>`<button data-act="dos-ap" data-v="${v}" aria-pressed="${String(U.dossier.ap??'')===String(v)}">${l}</button>`;
  const oix=rp&&S.idx[rp.type],oRent=sw&&old==='louer'?oix.rent*.9-oix.rent*.22-Math.max(0,oix.rent*.9-oix.rent*.22-(rp.loan?rp.loan.p*rp.loan.r:0))*(S.pol.irLoyer+psFRate())-loanAnn(rp):0;
  const oSale=sw?propSaleCalc(rp,propValue(rp)*.95,S.year).net:0;
  const mb=use==='loc'&&!bur&&U.dossier.meuble;
  const ch=ix.rent*(use==='rp'?.15:bur?.12:mb?.27:.22),vac=B.vac||.1,rentIn=use==='loc'?ix.rent*(1-vac)*(mb?1.15:1):0;
  const tax=use==='loc'?(mb?.5*rentIn:Math.max(0,rentIn-ch-q.L*q.r))*(S.pol.irLoyer+psFRate()):0;
  const after=use==='rp'?yearlySave()+housingOut()-(q.ann+ch)+oRent:yearlySave()-q.ann-ch+rentIn-tax;
  const why=ret?'À la retraite, la banque ne prête plus sur ces durées.':use==='rp'&&rp&&rp.type===t?'Tu y vis déjà.':use==='rp'&&!inCity?`Pour y vivre, il faudrait habiter ${CITIES[B.v].n} : ferme ce dossier et clique sur « Déménager à ${CITIES[B.v].n} ». Tu vis à ${CITIES[S.city].n}.`:cash<q.apport?`Il te manque ${fmt(q.apport-cash)} d’apport (compte courant + Livret A).`:q.eff>.35?`Taux d’effort de ${f1(q.eff*100)} % : au-delà de 35 %, la banque refuse.`:'';

function niceTicks(lo,hi){
  const t=[];for(let e=3;e<=10;e++)for(const m of [1,2.5,5]){const v=m*Math.pow(10,e);if(v>=lo&&v<=hi)t.push(v);}

function chart(hist,h=230){

  const path=k=>hist.map((d,i)=>`${i?'L':'M'}${X(d.x).toFixed(1)},${Y(d[k]).toFixed(1)}`).join('');

// Champs : pseudo, score (meilleur), title, prof, seed, at ; dayDate, dayScore, dayTitle (meilleur score du monde du jour).
const LB={state:'off',db:null,user:null,uid:null,canW:null,owner:false,rows:[],msg:'',tab:'all'};
async function lbInit(){
  if(LB.state!=='off')return;
  if(typeof window==='undefined'||!window.claude||typeof window.claude.use!=='function'){LB.state='none';return;}
  LB.state='load';
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db){LB.state='none';render();return;}
    LB.db=db;LB.user=user;LB.uid=user?await user.id():null;LB.canW=user?await user.can('data.write'):null;LB.owner=user?await user.isOwner():false;
    const slow=setTimeout(()=>{if(LB.state==='load'){LB.state='slow';render();}},10000);
    db.collection('scores').orderBy('score','desc').limit(200).onSnapshot(s=>{clearTimeout(slow);LB.rows=s.docs.map(d=>({id:d.id,...d.data()}));LB.state='ok';render();},()=>{clearTimeout(slow);LB.state='err';render();});
  }catch(e){LB.state='none';}
  render();
}
const today=()=>new Date().toISOString().slice(0,10);
const lbMine=()=>LB.uid&&LB.rows.find(r=>r.id===LB.uid);

async function lbSend(pseudo){
  const fs=finalScore(),p=String(pseudo||'').trim().slice(0,24);if(!p){LB.msg='Choisis un pseudo.';return;}
  const old=lbMine()||{},best=(old.score||0)>=fs.score?{score:old.score,title:old.title,prof:old.prof,seed:old.seed,at:old.at}:{score:fs.score,title:fs.title,prof:profLabel(),seed:S.wseed??null,at:today()};
  const doc={pseudo:p,...best};
  if(S.daily){const same=old.dayDate===S.daily;doc.dayDate=S.daily;doc.dayScore=same?Math.max(old.dayScore||0,fs.score):fs.score;doc.dayTitle=same&&(old.dayScore||0)>fs.score?old.dayTitle:fs.title;doc.daySeed=S.wseed;}
  else if(old.dayDate){doc.dayDate=old.dayDate;doc.dayScore=old.dayScore;doc.dayTitle=old.dayTitle;doc.daySeed=old.daySeed??null;}
  try{await LB.db.doc('scores/'+LB.uid).set(doc);S.lbSent=true;save();LB.msg='Ton score est au classement.';}
  catch(e){LB.canW=false;LB.msg='Tu ne peux pas écrire dans ce classement : copie ton résultat et envoie-le à l’organisateur.';}
  render();
}
// Le propriétaire colle le résultat copié par un ami (« Copier mon résultat ») pour l'ajouter.
async function lbAdd(pseudo,txt){
  const m=/·\s*([^·]+?)\s*·\s*score\s*([\d\s  ]+)/.exec(txt||''),p=String(pseudo||'').trim().slice(0,24);
  if(!p||!m){LB.msg='Indique un pseudo et colle le résultat copié par ton ami (il contient « score »).';render();return;}
  const score=+m[2].replace(/[\s  ]/g,''),parts=txt.split('·').map(x=>x.trim()),sd=/monde n° (\d+)/.exec(txt),daily=/monde du jour/.test(txt);
  const doc={pseudo:p,score,title:m[1].trim(),prof:parts.length>4?parts[1]+' · '+parts[2]:parts[1]||'',seed:sd?+sd[1]:null,at:today(),added:true};
  if(daily){doc.dayDate=today();doc.dayScore=score;doc.dayTitle=doc.title;doc.daySeed=doc.seed;}
  try{await LB.db.collection('scores').doc('a-'+Date.now().toString(36)).set(doc);LB.msg=`Résultat de ${p} ajouté.`;}catch(e){LB.msg='Ajout refusé : seul le propriétaire du jeu peut ajouter les résultats des autres.';}
  render();
}

function sfx(kind){
  if(!U.sound||typeof window==='undefined')return;
  try{const A=sfx.ctx||(sfx.ctx=new (window.AudioContext||window.webkitAudioContext)()),t=A.currentTime;
    const tone=(f,st,d,type,g,f2)=>{const o=A.createOscillator(),v=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t+st);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+st+d);
      v.gain.setValueAtTime(0,t+st);v.gain.linearRampToValueAtTime(g,t+st+.02);v.gain.exponentialRampToValueAtTime(.0001,t+st+d);o.connect(v);v.connect(A.destination);o.start(t+st);o.stop(t+st+d+.05);};
    if(kind==='bell'){tone(880,0,1.4,'sine',.09);tone(1320,0,.9,'sine',.035);tone(660,.18,1.2,'sine',.05);}
    else if(kind==='krach'){tone(220,0,1.3,'sawtooth',.05,60);tone(110,.1,1.2,'sine',.08,50);}
    else if(kind==='ach'){tone(660,0,.25,'triangle',.07);tone(990,.12,.4,'triangle',.07);}
  }catch(e){}
}

    case 'prop-sell':{const u=+t.dataset.u;if(U.confirmSell===u){const c=sellProp(u,undefined,undefined,'Vente');U.deskErr={t:`Bien vendu : ${fmt(c.net)} net après crédit et impôt.`,ok:true};U.confirmSell=null;save();}else U.confirmSell=u;break;}
    case 'reneg':{const er=reneg(+t.dataset.u);U.deskErr=er?{t:er}:{t:'Crédit renégocié : tes mensualités baissent.',ok:true};save();break;}
    case 'end':U.open=null;U.msg={};U.deskErr='';U.evErr='';U.envMsg={};U.fresh={};U.dossier=null;U.fx=true;S.achNew=[];endTurn();if(S.phase==='bilan'&&canAnim()){U.anim={i:0};render();runAnim();return;}break;
    case 'next':{S.achNew=[];nextBilan();U.view='profil';U.dossier=null;U.fresh={};U.fx=true;U.evAmt='';U.evAsset=null;U.evEnv=null;
      const q=autoPass();U.quiet=q.length&&S.phase==='turn'?q:null;
      sfx(S.phase==='turn'&&S.event&&EVT[S.event.id].crash?'krach':'bell');
      if(q.length&&canAnim()){U.animList=q;U.anim={i:0};render();runAnim();return;}break;}
    case 'quiet-ok':U.quiet=null;U.fx=true;break;
    case 'biz-create':{const k=t.dataset.d;U.bizMsg=null;if(!k||U.bizConf!==k){U.bizConf=k||null;break;}U.bizConf=null;const er=bizCreate(k);U.bizMsg=er?{err:1,t:er}:{t:`${S.biz.name} est née. À toi de jouer : ton salaire, ton équipe, ta trésorerie.`};if(!er)sfx('bell');break;}
    case 'biz-pay':{const er=bizPay(t.dataset.v);U.bizMsg=er?{err:1,t:er}:{t:`Ton salaire : ${S.revenu?fmt(S.revenu/12)+' par mois':'rien'} cette année.`};break;}
    case 'biz-hire':{const k=+t.dataset.v,er=bizHire(k);U.bizMsg=er?{err:1,t:er}:{t:k>0?'Une embauche : plus de capacité, plus de charges.':'Un départ : trois mois de salaire versés.'};break;}
    case 'biz-raise':{const a=raiseAmt(),er=bizRaise();U.bizMsg=er?{err:1,t:er}:{t:`Levée réussie : ${fmt(a)} en trésorerie, ta part passe à ${pc0(S.biz.share)}.`};break;}
    case 'biz-div':{const c0=S.cash,er=bizDiv();U.bizMsg=er?{err:1,t:er}:{t:`Dividende versé : ${fmt(S.cash-c0)} net d’impôt sur ton compte.`};break;}
    case 'bud':{const k=t.dataset.k;if(k==='reset'){if(bizBoss())S.biz.bud={...BUD0};break;}const er=setBud(k,+t.dataset.v);U.bizMsg=er?{err:1,t:er}:null;break;}
    case 'bud-ok':if(bizBoss()){S.biz.budY=S.year;U.budEdit=false;U.bizMsg=null;U.fx=true;save();}break;
    case 'bud-open':if(bizBoss()){U.budEdit=true;U.bizMsg=null;}break;
    case 'biz-part':{const f=+t.dataset.f,r=bizSellPart(f);U.bizMsg=r.err?{err:1,t:r.err}:{t:`Tu cèdes ${pc0(f)} de tes parts : ${fmt(r.amt)} net sur ton compte. Il te reste ${pc0(S.biz.share)} du capital.`};break;}
    case 'biz-plan':{if(U.bizConf!=='plan'){U.bizConf='plan';U.bizMsg=null;break;}U.bizConf=null;const er=bizPlan();U.bizMsg=er?{err:1,t:er}:{t:'Plan social bouclé : des charges en moins, une ambiance lourde au bureau.'};break;}
    case 'biz-leave':{const er=bizLeave();U.bizMsg=er?{err:1,t:er}:{t:'Retour à un poste classique : tu gardes tes actions.'};break;}
    case 'biz-sell':case 'biz-close':{const k=a==='biz-sell'?'sell':'close';if(U.bizConf!==k){U.bizConf=k;U.bizMsg=null;break;}U.bizConf=null;const r=bizSell(k==='sell'?'vente':'fermeture');U.bizMsg=r.err?{err:1,t:r.err}:{t:`${k==='sell'?'Vendu':'Fermée'} : ${fmt(r.amt)} sur ton compte${r.tax>.5?` après ${fmt(r.tax)} d’impôt`:''}. Tu retrouves un poste salarié.`};break;}
    case 'july':halfYear();if(S.half){U.july=true;U.fx=true;U.open=null;U.msg={};U.dossier=null;sfx('bell');}break;
    case 'july-bud':U.july=false;U.budEdit=true;U.view='boite';break;
    case 'july-ok':U.july=false;if(t.dataset.v)U.view=t.dataset.v;U.fx=true;break;
    case 'julyon':S.julyOn=S.julyOn===false;save();break;
    case 'undo':break;
    case 'rules':U.rules=true;break;
    case 'lb-open':U.lb=true;lbInit();break;
    case 'lb-close':U.lb=false;break;
    case 'lb-tab':LB.tab=t.dataset.t;break;
    case 'lb-send':lbSend(U.pseudo??((lbMine()||{}).pseudo||''));break;
    case 'lb-add':lbAdd(U.fpseudo,U.ftxt).then(()=>{U.fpseudo='';U.ftxt='';render();});break;
    case 'sound':U.sound=!U.sound;if(S){S.sound=U.sound;save();}if(U.sound)sfx('bell');break;
    case 'rules-close':U.rules=false;break;
    case 'chap-ok':if(S.story){S.story.chap=chapOf(S.year)+1;save();}U.fx=true;break;
    case 'auto':S.autoPass=S.autoPass===false;save();break;
    case 'broken-new':U.broken=false;S=null;wipe();U.fx=true;break;
  }
  if(a==='undo'&&U.undoS){S=JSON.parse(U.undoS);U.undoS=null;U.undo=null;U.toast='Dernier ordre annulé.';save();}
  else if(snap&&JSON.stringify(S)!==snap){U.undoS=snap;U.undo=UNDO;}
  render();
}
function onInput(e){
  const t=e.target;
  if(t.dataset.amt){const key=t.dataset.amt;U.amt[key]=t.value;const [en,id]=key.split(':');const sp=document.getElementById('tx-'+key);if(sp&&en==='cto'){const x=estTaxCto(id,+t.value||0);sp.textContent=x>0.5?`Impôt estimé sur ce montant : ${fmt(x)}.`:'';}}
  if(t.dataset.wd){const en=t.dataset.wd;U.wd[en]=t.value;const sp=document.getElementById('wdtax-'+en);if(sp){const c=wdCalc(en,+t.value||S.acc[en].cash);sp.textContent=c.amt>0?`Impôt estimé : ${fmt(c.tax)}`:'';}}
  if(t.dataset.lb){const k=t.dataset.lb;if(k==='pseudo')U.pseudo=t.value;if(k==='fp')U.fpseudo=t.value;if(k==='ft')U.ftxt=t.value;}
  if(t.dataset.cu&&U.setup.cust){U.setup.cust[t.dataset.cu]=t.value;if(e.type==='change')render();}
  if(t.id==='ev-amt')U.evAmt=t.value;
  if(t.id==='dur'&&e.type==='change'){U.dur=+t.value;render();}
  if(t.id==='ev-asset'&&e.type==='change'){U.evAsset=t.value;U.evEnv=null;render();}
  if(t.id==='ev-env'&&e.type==='change'){U.evEnv=t.value;render();}
}
// Pas de migration : la version 3 change de monde. Une partie de la version 2 est close avec son patrimoine (voir legacyGame).
// Complète une partie des versions 3.0 et 3.1 (avant le carnet) avec les nouveaux champs.
function migrate(o){
  if(!o)return o;
  for(const k in BIENS){if(!o.idx[k])o.idx[k]={price:BIENS[k].price*o.defl,rent:BIENS[k].rent*o.defl};if(o.drift&&o.drift['b_'+k]==null)o.drift['b_'+k]=0;}
  if(!o.city)o.city='lille';
  for(const id in PX0)if(o.px&&o.px[id]==null){o.px[id]=PX0[id];(o.ph||(o.ph={}))[id]=[PX0[id]];} // nouveaux placements (SCPI, obligations d'entreprise)
  if(!o.p){const old={heritier:[2,2,1],ingenieure:[4,1,.66],infirmier:[1,1,2.3],fondatrice:[2,1,1.1]}[o.arch]||[2,2,1];o.p={city:o.city,sal:old[0],cap:old[1],couple:!!o.me.first};if(o.coef==null)o.coef=old[2];}
  if(!o.home){const rp=o.props.find(p=>BIENS[p.type]&&BIENS[p.type].k==='rp');o.home=rp?{type:rp.type,own:true,since:rp.buyYear}:{type:'t2rp',own:false,since:o.year};if(rp)o.flags.ownedRP=true;}
  if(o.me.car==null)o.me.car=true;
  if(!o.me.kids){o.me.kids=[];for(let i=0;i<o.me.enfants;i++)o.me.kids.push({n:KIDS[i],born:o.year-2-i});}
  if(!o.buyHist)o.buyHist={};
  if(o.onb===undefined)o.onb=null;
  if(!o.page)o.page={head:(o.gaz&&o.gaz.head)||{t:`Année ${o.year}`,c:''},notes:[],imp:null,spent:0};
  delete o.gaz;delete o.sigRec;
  return o;
}
function boot(data){
  try{S=migrate((data&&data.S&&data.S.v===3)?data.S:load());}catch(e){S=null;U.broken=true;stash();}
  if(S){if(S.a0==null)S.a0=25;setA0(S.a0);}else setA0(20);
  // Partie d'avant la 3.5 : le repère ne suivait pas l'immobilier. On le recale sur tes placements actuels, la comparaison repart d'aujourd'hui.
  if(S&&S.autoPass==null)S.autoPass=true;
  if(S&&!S.story){storyMigrate();}
  if(S&&!S.benchV){const f=net()-propNet();S.bench={liv:f,trk:f};S.yearProp=0;S.benchV=2;}
  if(S&&!S.moves)S.moves=[];
  // Partie d'avant la 3.14 : un seul taux de prélèvements sociaux. La hausse de 2026 (+1,4 point) touche le compte-titres et le PEA.
  if(S&&S.pol&&S.pol.psF==null){S.pol.psF=S.pol.ps;S.pol.ps=Math.round((S.pol.ps+.014)*1000)/1000;}
  if(!S)U.legacy=legacyGame();
  U.sound=!!(S&&S.sound); // réglage rangé dans la partie : localStorage reste réservé à la sauvegarde
  try{const m=typeof location!=='undefined'&&/graine-(\d{1,6})/.exec(location.hash||'');if(m){U.setup.seed=+m[1];U.setup.world='lien';}}catch(e){}
  if(typeof document!=='undefined'){
    document.addEventListener('click',onClick);
    document.addEventListener('input',onInput);
    document.addEventListener('change',onInput);
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'&&(U.rules||U.lb)){U.rules=false;U.lb=false;render();return;}
      if(e.key==='Escape'&&U.dossier){U.dossier=null;render();return;}
      // Tab reste dans la fenêtre ouverte
      const box=e.key==='Tab'&&(document.getElementById('rules')||document.querySelector('.anim')||document.querySelector('.overlay'));if(!box)return;
      const f=[...box.querySelectorAll('button:not(:disabled),input,select,textarea,summary')];if(!f.length)return;
      const i=f.indexOf(document.activeElement);
      if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&(i<0||i===f.length-1)){e.preventDefault();f[0].focus();}});
    document.addEventListener('scroll',e=>{const el=e.target;if(el&&el.classList&&el.classList.contains('more')!==(el.scrollHeight-el.scrollTop-el.clientHeight>4))el.classList.toggle('more');},true);
    window.addEventListener('resize',markMore);
    render();
    lbInit();
  }
}
if(typeof document!=='undefined'){
  try{window.claude?.hot?.snapshot?.(()=>({S}));}catch(e){}
  window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
